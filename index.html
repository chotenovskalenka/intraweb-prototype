<style>
  :root{
    --bg:#EFEEE9;--surface:#F9F7F1;--primary:#2B7059;--primary-dk:#1F5344;
    --accent:#C8BC85;--text:#1F2A2E;--muted:#5C6560;--line:rgba(31,42,46,.10);
    --serif:"Bricolage Grotesque",system-ui,sans-serif;--sans:"Inter",system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:var(--sans);
    min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:32px 20px;gap:6px}
  .logo{width:88px;height:88px;object-fit:contain;margin-bottom:8px}
  .brand{font-family:var(--serif);font-size:34px;font-weight:700;color:var(--primary-dk);letter-spacing:.01em}
  .sub{font-size:14px;color:var(--muted);margin-bottom:26px;text-align:center}
  .cards{display:flex;flex-direction:column;gap:14px;width:100%;max-width:380px}
  .card{display:flex;align-items:center;gap:16px;background:var(--surface);
    border:1px solid var(--line);border-radius:16px;padding:18px 20px;text-decoration:none;
    color:inherit;box-shadow:0 2px 10px rgba(31,83,68,.05);transition:transform .12s,box-shadow .12s}
  .card:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(31,83,68,.12)}
  .ic{width:46px;height:46px;flex-shrink:0;border-radius:12px;display:flex;align-items:center;
    justify-content:center;font-size:24px;background:rgba(43,112,89,.10)}
  .txt{display:flex;flex-direction:column;gap:2px}
  .tt{font-family:var(--serif);font-size:19px;font-weight:600;color:var(--primary-dk)}
  .dd{font-size:12.5px;color:var(--muted)}
  .arr{margin-left:auto;font-size:20px;color:var(--primary)}
  .foot{margin-top:28px;font-size:11.5px;color:var(--muted);text-align:center;line-height:1.5}
</style>
</head>
