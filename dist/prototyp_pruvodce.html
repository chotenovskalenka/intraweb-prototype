<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Průvodcovská appka (prototyp)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Design tokens — sémantická vrstva (fáze 0.4). Hodnoty se oproti původním názvům NEMĚNÍ. */
:root{
  --color-bg:#EFE9DB;
  --color-surface:#FBF8F0;
  --color-surface-2:#F4EEDF;
  --color-text:#2B2A26;
  --color-text-muted:#736E61;
  --color-text-hint:#9A9384;
  --color-primary:#2E5E43;
  --color-primary-strong:#21402F;
  --color-accent-soft:#8FA48C;
  --color-accent:#B07D3A;
  --color-info:#5B7C99;
  --color-border:rgba(43,42,38,.10);
  --color-border-strong:rgba(43,42,38,.16);
  --color-danger:#B0492F;
  --color-success:#3C7A4E;
  --radius-md:14px;
  --font-serif:"Fraunces",Georgia,serif;
  --font-sans:"Hanken Grotesk","Segoe UI",sans-serif;
  /* spacing škála — zatím bez použití, připravená pro budoucí fáze */
  --space-xs:4px;
  --space-sm:8px;
  --space-md:12px;
  --space-lg:16px;
}
</style>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--color-bg);font-family:var(--font-sans);color:var(--color-text);-webkit-font-smoothing:antialiased;min-height:100vh;line-height:1.5}
</style>
<style>
.phone{width:100%;background:var(--color-bg)}
.screen{background:var(--color-bg);min-height:100vh}.scroll{padding:14px 16px 30px}
.topbar{display:flex;align-items:center;gap:12px;margin-bottom:13px}
.burger{border:none;background:none;font-size:21px;line-height:1;color:var(--color-primary-strong);cursor:pointer;padding:2px 4px}
.ttl{font-family:var(--font-serif);font-size:19px;color:var(--color-primary-strong);flex:1}
.role{font-size:11.5px;font-weight:500;color:var(--color-primary);background:rgba(46,94,67,.10);border:1px solid rgba(46,94,67,.18);padding:5px 10px;border-radius:999px;white-space:nowrap}
.scrim{position:fixed;inset:0;background:rgba(33,42,30,.42);z-index:5;display:none}.scrim.on{display:block}
.drawer{position:fixed;top:0;left:0;bottom:0;width:76%;max-width:300px;background:var(--color-bg);z-index:6;transform:translateX(-101%);transition:.22s;padding:20px 0 14px;box-shadow:6px 0 28px rgba(0,0,0,.16);overflow-y:auto}
.drawer.on{transform:none}
.dh{font-family:var(--font-serif);font-size:17px;color:var(--color-primary-strong);padding:0 20px 14px;border-bottom:1px solid var(--color-border);margin-bottom:8px}
.dh small{display:block;font-family:var(--font-sans);font-size:11.5px;color:var(--color-text-muted);font-weight:400}
.ditem{display:flex;align-items:center;gap:11px;padding:12px 20px;font-size:15px;color:var(--color-text);cursor:pointer;border:none;background:none;width:100%;text-align:left;font-family:var(--font-sans)}
.ditem.on{background:rgba(46,94,67,.10);color:var(--color-primary);font-weight:600}
.ditem .ic{width:18px;text-align:center;opacity:.7}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--color-primary-strong);color:#F4EEDF;font-size:14px;font-weight:600;padding:11px 20px;border-radius:999px;opacity:0;pointer-events:none;transition:.22s;z-index:40;box-shadow:0 6px 20px rgba(0,0,0,.22)}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* Desktop: mobilní appka se prezentuje jako vycentrovaný telefonní rám.
   Obsah zůstává mobile-first (rodič i průvodce používají systém na mobilu),
   jen se neroztahuje přes celou obrazovku. Na mobilu se nic nemění. */
@media (min-width:700px){
  body{background:#E4DCC9;padding:28px 0}
  .phone{max-width:414px;margin:0 auto;border-radius:26px;box-shadow:0 18px 60px rgba(33,42,30,.20);overflow:hidden;border:1px solid var(--color-border-strong)}
  .screen{min-height:calc(100vh - 56px)}
  /* drawer se váže na levou hranu rámu (414/2 = 207), ne na okraj okna;
     zavřený musí být i vizuálně skrytý (translateX(-101%) ho jinak nechá vedle rámu) */
  .drawer{left:calc(50% - 207px);top:28px;bottom:28px;border-radius:26px 0 0 26px;opacity:0;visibility:hidden;transition:transform .22s,opacity .22s,visibility .22s}
  .drawer.on{opacity:1;visibility:visible}
}
/* Široký desktop: navigace jako trvalý panel vlevo vedle rámu (vzor admin sidebar) */
@media (min-width:1100px){
  .drawer{transform:none;opacity:1;visibility:visible;left:auto;right:calc(50% + 223px);width:280px;bottom:auto;max-height:calc(100vh - 56px);border-radius:26px;box-shadow:0 18px 60px rgba(33,42,30,.12);border:1px solid var(--color-border)}
  .burger{display:none}
  .scrim{display:none !important}
}
</style>
<style>
.tile{background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-md);padding:13px 15px;margin-bottom:11px}
.tlab{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:#605B4F;margin-bottom:7px}
.tval{font-size:14.5px;color:var(--color-text);line-height:1.5}
.vhead{font-family:var(--font-serif);font-size:16px;color:var(--color-primary-strong);margin:4px 2px 9px}
.note2{font-size:12px;color:var(--color-text-hint);margin-top:10px;line-height:1.5}
.note-info{background:rgba(46,94,67,.06);border-color:rgba(46,94,67,.18);font-size:13.5px;color:var(--color-text);line-height:1.5}
.note-info b{color:var(--color-primary);font-weight:600}
.np{display:flex;justify-content:space-between;align-items:center;font-size:14px;padding:5px 0}.np b{font-weight:600}
.switch{display:flex;gap:6px;background:var(--color-surface-2);padding:4px;border-radius:999px;margin-bottom:14px}
.switch button{flex:1;border:none;background:transparent;font-family:var(--font-sans);font-size:13.5px;font-weight:500;color:var(--color-text-muted);padding:12px 4px;border-radius:999px;cursor:pointer}
.switch button.on{background:var(--color-primary);color:#F4EEDF}
.selin{border:1px solid var(--color-border-strong);border-radius:8px;padding:6px 9px;font-family:var(--font-sans);font-size:13.5px;background:var(--color-surface);color:var(--color-text)}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;min-width:76px;background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-md);padding:13px 15px 11px;text-align:center;cursor:pointer}
.modes{display:flex;gap:6px;margin-bottom:10px}
.modes button{flex:1;border:1px solid var(--color-border-strong);background:var(--color-surface);font-family:var(--font-sans);font-size:12.5px;font-weight:500;color:var(--color-text-muted);padding:11px 4px;border-radius:10px;cursor:pointer}
.modes button.on{background:var(--color-accent);border-color:var(--color-accent);color:#FBF8F0}
.c-N{background:rgba(176,73,47,.14);color:var(--color-danger)}
.rnote{margin:0 8px 8px;padding:9px 11px;background:rgba(176,73,47,.10);border-radius:9px;font-size:12.5px;color:var(--color-danger);line-height:1.45;font-weight:500}
.ghostred{background:transparent;border:1px solid var(--color-danger);color:var(--color-danger)}
.clink{color:var(--color-primary);font-weight:600;text-decoration:none}
.tab .num{font-family:var(--font-serif);font-weight:600;font-size:28px;line-height:1;color:var(--color-primary-strong)}
.tab .lab{font-size:11.5px;color:var(--color-text-muted);margin-top:4px}
.tab.on{background:var(--color-primary);border-color:var(--color-primary)}.tab.on .num{color:#F8F4E8}.tab.on .lab{color:rgba(244,238,223,.8)}
.tab.lead .num{color:var(--color-primary)}.tab.on.lead .num{color:#F8F4E8}
.ctxhead{display:flex;align-items:baseline;justify-content:space-between;margin:16px 2px 3px}
.ctxhead .t{font-family:var(--font-serif);font-size:16px;color:var(--color-primary-strong)}
.ctxhead .pres{font-size:13px;color:var(--color-text-muted)}.ctxhead .pres b{color:var(--color-primary);font-weight:600}
.sectip{font-size:13px;color:var(--color-text-muted);margin:0 2px 9px;min-height:17px}
.search{width:100%;border:1px solid var(--color-border-strong);border-radius:10px;padding:9px 11px;font-family:var(--font-sans);font-size:13.5px;color:var(--color-text);background:var(--color-surface);margin-bottom:9px}
.rosterbox{max-height:340px;overflow-y:auto;border:1px solid var(--color-border);border-radius:12px;padding:5px;background:rgba(251,248,240,.5)}
.row{background:var(--color-surface);border:1px solid var(--color-border);border-radius:10px;margin-bottom:5px;overflow:hidden}.row:last-child{margin-bottom:0}
.rmain{display:flex;align-items:center;gap:9px;padding:11px 12px;cursor:pointer;min-height:52px}
.pnote{background:var(--color-surface);border:1px solid var(--color-border);border-radius:8px;padding:9px 11px;font-size:13px;line-height:1.5;color:var(--color-text)}
.chk{flex-shrink:0;width:30px;height:30px;border-radius:8px;border:1.5px solid var(--color-border-strong);background:var(--color-surface-2);display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff;cursor:pointer}
.chk.on{background:var(--color-primary);border-color:var(--color-primary)}
.rmain .nm{font-weight:500;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex-shrink:1;min-width:60px}
.rmain .ind{margin-left:auto;font-size:11.5px;color:var(--color-text-muted);flex-shrink:0;white-space:nowrap}
.ind.sleep{color:var(--color-info)}.ind.awake{color:var(--color-accent)}.ind.off{color:var(--color-danger)}
.pill{font-size:10px;font-weight:500;padding:2px 6px;border-radius:6px;flex-shrink:0}
.p-cel{background:rgba(46,94,67,.10);color:var(--color-primary)}.p-odp{background:rgba(91,124,153,.13);color:#3f5d72}
.p-dop{background:rgba(176,125,58,.13);color:var(--color-accent)}.p-note{background:rgba(176,73,47,.10);color:var(--color-danger)}
.row.absent .nm{color:var(--color-text-hint);text-decoration:line-through}
.edit{border-top:1px solid var(--color-border);padding:11px 11px 12px;background:var(--color-surface-2)}
.field{margin-bottom:9px}.field .l{font-size:11px;color:var(--color-text-muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:5px}
.mini{display:flex;gap:5px}
.mini button{flex:1;border:1px solid var(--color-border-strong);background:var(--color-surface);font-family:var(--font-sans);font-size:12.5px;font-weight:500;color:var(--color-text-muted);padding:12px 6px;border-radius:9px;cursor:pointer}
.mini button.on{background:var(--color-primary);border-color:var(--color-primary);color:#F4EEDF}
.mini.warn button.on{background:var(--color-danger);border-color:var(--color-danger)}
.note{width:100%;border:1px solid var(--color-border-strong);border-radius:8px;padding:8px 10px;font-family:var(--font-sans);font-size:13.5px;color:var(--color-text);background:var(--color-surface);min-height:54px;resize:vertical;line-height:1.45}
.empty{font-size:13px;color:var(--color-text-hint);font-style:italic;text-align:center;padding:16px}
footer{margin-top:16px;padding-top:13px;border-top:1px solid var(--color-border);display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.meals{font-size:13.5px;color:var(--color-text-muted)}.meals b{color:var(--color-text);font-weight:600}
.pwa{font-size:11.5px;color:var(--color-text-hint)}
.hint{font-size:12.5px;color:var(--color-text-hint);text-align:center;margin-top:14px;line-height:1.45}
.av{display:inline-flex;border-radius:50%;overflow:hidden;flex-shrink:0;line-height:0}.av svg{display:block}
.works{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:4px}
.work{aspect-ratio:1;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:11px;color:rgba(43,42,38,.4)}
.weekbox{max-height:430px;overflow-y:auto;border:1px solid var(--color-border);border-radius:12px;background:var(--color-surface)}
table.wt{width:100%;border-collapse:collapse;table-layout:fixed}
table.wt th,table.wt td{padding:6px 2px;text-align:center;font-size:12.5px}
table.wt thead th{position:sticky;top:0;background:var(--color-surface-2);color:var(--color-text-muted);font-weight:600;font-size:11.5px;border-bottom:1px solid var(--color-border);z-index:1}
table.wt th.who,table.wt td.who{text-align:left;width:42%;padding-left:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
table.wt td.who{font-size:13px;font-weight:500}
table.wt td.who .av{vertical-align:middle;margin-right:6px}
table.wt tbody tr{border-bottom:1px solid var(--color-border)}
table.wt th.today,table.wt td.today{background:rgba(46,94,67,.06)}
table.wt thead th.today{color:var(--color-primary);background:rgba(46,94,67,.12)}
.wc{display:inline-block;width:24px;height:24px;line-height:24px;border-radius:6px;font-size:11px;font-weight:600}
.c-C{background:rgba(46,94,67,.16);color:var(--color-primary)}.c-D{background:rgba(176,125,58,.20);color:var(--color-accent)}
.c-O{background:rgba(91,124,153,.20);color:#3f5d72}.wc.e{background:transparent;color:var(--color-text-hint);font-weight:400}
table.wt tfoot td{position:sticky;bottom:0;background:var(--color-surface-2);font-weight:600;color:var(--color-primary-strong);border-top:1px solid var(--color-border-strong);font-size:12.5px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--color-text-muted);margin:10px 2px 0}.legend span b{font-weight:600;color:var(--color-text)}
.prow{background:var(--color-surface);border:1px solid var(--color-border);border-radius:12px;margin-bottom:6px;overflow:hidden}
.prow.open{border-color:var(--color-primary)}
.pmain{display:flex;align-items:center;gap:10px;padding:11px 13px;cursor:pointer}
.pd{font-size:13.5px;color:var(--color-text-muted);min-width:34px;flex-shrink:0}
.pp{font-family:var(--font-serif);font-size:15.5px;color:var(--color-primary-strong)}
.psub{padding:0 13px 10px;font-size:12.5px;color:var(--color-accent);margin-top:-4px}
.pedit{border-top:1px solid var(--color-border);background:var(--color-surface-2);padding:12px 13px}
.pl{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--color-text-muted);margin:9px 0 5px}.pl:first-child{margin-top:0}
.pchips{display:flex;flex-wrap:wrap;gap:6px}
.pchips button{border:1px solid var(--color-border-strong);background:var(--color-surface);font-family:var(--font-sans);font-size:12.5px;color:var(--color-text-muted);padding:6px 11px;border-radius:999px;cursor:pointer}
.pchips button.on{background:var(--color-primary);border-color:var(--color-primary);color:#F4EEDF}
.pin{width:100%;border:1px solid var(--color-border-strong);border-radius:9px;padding:9px 11px;font-family:var(--font-sans);font-size:13.5px;color:var(--color-text);background:var(--color-surface)}
.pta{width:100%;border:1px solid var(--color-border-strong);border-radius:9px;padding:9px 11px;font-family:var(--font-sans);font-size:13.5px;color:var(--color-text);background:var(--color-surface);min-height:62px;resize:vertical;line-height:1.5}
.addbig{width:100%;border:1.5px solid var(--color-primary);background:rgba(46,94,67,.07);color:var(--color-primary);font-family:var(--font-sans);font-size:15px;font-weight:600;padding:12px;border-radius:12px;cursor:pointer;margin-bottom:11px}
.acard{display:flex;gap:11px;align-items:flex-start;background:var(--color-surface);border:1px solid var(--color-border);border-radius:12px;padding:11px 13px;margin-bottom:7px;cursor:pointer;width:100%;text-align:left;font-family:var(--font-sans)}
.adate{font-family:var(--font-serif);font-size:14px;color:var(--color-primary);min-width:64px;flex-shrink:0;padding-top:1px}
.aname{font-size:14.5px;font-weight:500;color:var(--color-text)}
.ameta{font-size:12.5px;color:var(--color-text-muted);margin-top:2px;line-height:1.4}
.modal-scrim{position:fixed;inset:0;background:rgba(33,42,30,.5);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.modal{background:var(--color-bg);width:100%;max-width:460px;border-radius:18px 18px 0 0;padding:18px 18px 22px;max-height:90vh;overflow-y:auto;box-shadow:0 -8px 30px rgba(0,0,0,.22)}
.modal h3{font-family:var(--font-serif);font-size:19px;color:var(--color-primary-strong);margin-bottom:6px}
/* Desktop (telefonní rám z layout.css): bottom-sheet se drží šířky rámu a plave nad okrajem */
@media (min-width:700px){
  .modal-scrim{align-items:center}
  .modal{max-width:414px;border-radius:18px;max-height:84vh}
}
.mrow2{display:flex;gap:9px}
.mbtns{display:flex;gap:9px;margin-top:16px}
.btn-primary{flex:1;background:var(--color-primary);color:#F4EEDF;border:none;font-family:var(--font-sans);font-size:15px;font-weight:600;padding:13px;border-radius:11px;cursor:pointer}
.btn-ghost{flex:1;background:transparent;color:var(--color-text-muted);border:1px solid var(--color-border-strong);font-size:15px;padding:13px;border-radius:11px;cursor:pointer;font-family:var(--font-sans)}
.btn-del{display:block;background:none;border:none;color:var(--color-danger);font-size:13.5px;font-weight:600;cursor:pointer;margin:12px auto 0;font-family:var(--font-sans)}
.filters{display:flex;gap:8px;margin-bottom:12px;overflow-x:auto;scrollbar-width:none}.filters::-webkit-scrollbar{display:none}
.filters button{flex:0 0 auto;border:1px solid var(--color-border-strong);background:var(--color-surface);font-family:var(--font-sans);font-size:13px;color:var(--color-text-muted);padding:8px 15px;border-radius:999px;cursor:pointer}
.filters button.on{background:var(--color-primary);border-color:var(--color-primary);color:#F4EEDF}
.bdg{font-size:10px;font-weight:600;padding:2px 7px;border-radius:6px;white-space:nowrap}
.bdg.pre{color:var(--color-primary);background:rgba(46,94,67,.12)}.bdg.al{color:var(--color-danger);background:rgba(176,73,47,.12)}
.pav{display:flex;justify-content:center;margin:6px 0 10px}
.pname{font-family:var(--font-serif);font-size:22px;text-align:center;color:var(--color-primary-strong)}
.pfull{text-align:center;font-size:13px;color:var(--color-text-muted);margin-bottom:16px}
.back{background:none;border:none;color:var(--color-primary);font-weight:600;font-size:14px;font-family:var(--font-sans);cursor:pointer;padding:4px 0;margin-bottom:10px}
.addbtn{margin-top:10px;width:100%;border:1px dashed var(--color-border-strong);background:transparent;color:var(--color-text-muted);font-family:var(--font-sans);font-size:13px;padding:10px;border-radius:10px;cursor:pointer}
.contact{display:flex;gap:7px;margin-top:6px}
.cbtn{flex:1;text-align:center;border:1px solid var(--color-primary);color:var(--color-primary);border-radius:9px;padding:9px;font-size:13px;font-weight:600;text-decoration:none;font-family:var(--font-sans)}
.stepper{display:flex;align-items:center;justify-content:space-between;background:var(--color-surface-2);border:1px solid var(--color-border);border-radius:12px;padding:6px 6px;margin-bottom:13px}
.stepper button{border:none;background:none;font-size:20px;color:var(--color-primary);cursor:pointer;padding:5px 16px;font-family:var(--font-serif);line-height:1}
.stepper button:disabled{color:var(--color-text-hint);cursor:default}
.stepper span{font-family:var(--font-serif);font-size:16px;color:var(--color-primary-strong)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.calh{text-align:center;font-size:11px;color:var(--color-text-muted);padding:2px 0}
table.wt td.ced{cursor:pointer;background:rgba(46,94,67,.05)}
table.wt td.ced:active{background:rgba(46,94,67,.14)}
table.wt td.pastc{opacity:.45}
.calcell{aspect-ratio:1;border:1px solid var(--color-border);border-radius:9px;background:var(--color-surface);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;position:relative}
.calcell .cnum{font-size:13px;color:var(--color-text)}
.calcell.we{background:transparent;border-color:transparent}.calcell.we .cnum{color:var(--color-text-hint)}
.calcell.today{border-color:var(--color-primary);border-width:1.5px}
.calcell.sel{background:var(--color-primary)}.calcell.sel .cnum{color:#F4EEDF}
.cdot{width:5px;height:5px;border-radius:50%;background:var(--color-accent);margin-top:2px}
.ccount{font-size:11px;font-weight:600;color:var(--color-primary);margin-top:1px}.ccount.lk{color:var(--color-text-hint)}
.calcell.sel .cdot{background:#F4EEDF}

<script>
/* SCREEN: PRUVODCE_PREHLED — dashboard: dnešek jedním pohledem, jedním klikem do docházky */
function renderPrehled(){
  const c=counts();
  // hlavička: dnešní datum + kdo slouží/otevírá (odvozeno z GUIDESHIFT jako sekce Průvodci)
  const todays=GUIDESHIFT.map((g,i)=>({g,i})).filter(x=>serving(x.g.days[TODAY]));
  const opener=todays.slice().sort((a,b)=>startMin(a.g.days[TODAY])-startMin(b.g.days[TODAY]))[0];
  const servingTxt=todays.length?todays.map(x=>`${x.g.n}${opener&&x.i===opener.i?' <b style="color:var(--color-primary)">otevírá</b>':''}`).join(' · '):'nikdo nemá službu';

  // 1) počty dětí dnes — odvozené z counts() (stejný zdroj jako docházka)
  const strip=[['Přítomno',c.pres,'rano'],['Obědy',c.pres,'rano'],['Spí',c.spi,'spi'],['Po obědě',c.poobede,'poobede'],['Nepřítomní',c.neprit,'neprit']];

  // 2) rychlý vstup do docházky
  h+=`<button class="addbig" style="margin-top:11px" onclick="go('dochazka')">Otevřít dnešní docházku →</button>`;

  // 3) kdo dnes nepřijde — jmenovitě, s důvodem (u rodičovské omluvenky čas + důvod)
  const absent=data.map((c,i)=>({c,i})).filter(x=>x.c.status!=='pritomen');
  h+=`<div class="tile"><div class="tlab">Kdo dnes nepřijde</div>`;
  if(absent.length){
    absent.forEach(({c})=>{
      const r=c.parentExcuse?parentExcuseLine(c):(c.status==='omluveno'?'omluveno':'neomluveno');
      h+=`<button class="prehl-abs" onclick="goDochTab('neprit')">${avatar(c,24)}<span class="pa-nm">${full(c)}</span><span class="pa-r">${r}</span></button>`;
    });
  }else{
    h+=`<div class="empty" style="padding:6px">Dnes dorazí všichni. Všichni jsme Vhaaji.</div>`;
  }
  h+=`</div>`;

  // 4) básnička a písnička aktuálního týdne (odvozeno z TODAYD; 3. 6. = 1. týden)
  const wk=TEMA.tydny[Math.floor((TODAYD-1)/7)];

  if(wk&&(wk.b||wk.p)){
    if(wk.b)h+=`<div class="pa-cap">Básnička</div><div class="tval">${wk.b}</div>`;
    if(wk.p)h+=`<div class="pa-cap" style="margin-top:8px">Písnička</div><div class="tval">${wk.p}</div>`;
  }else{

  }
  h+=`</button>`;

  // 5) zdravotní / provozní poznámky (děti s poznámkou od rodičů)
  const notes=data.filter(c=>c.note);
  if(notes.length){
    h+=`<div class="tile"><div class="tlab">Zdravotní a provozní poznámky</div>`;

  const akToday=[...AKCE].filter(a=>a.day<=TODAYD&&(a.dayEnd?a.dayEnd>=TODAYD:a.day===TODAYD)).sort((a,b)=>a.day-b.day);
  if(akToday.length){

    h+=`</div>`;
  }

}

  if(t==='spi')return staysPM(c)&&c.spi&&!onTrip(c);
  if(t==='poobede')return here(c)&&c.plan==='dopolední';
  if(t==='neprit')return !here(c);
};
const TABS_BEZNY=[['rano','Ráno'],['spi','Spí'],['poobede','Po obědě'],['neprit','Nepřítomní']];
const TABS_SPEC=g=>[['skolka','Školka ráno'],['vyprava',g],['obed','Oběd'],['spi','Spí'],['neprit','Nepřítomní']];

const CTX={rano:['Kdo dnes přišel',''],
  skolka:['Ráno ve školce',''],
  vyprava:['Na výpravě',''],
  obed:['Oběd — všichni',''],
  spi:['Maringotka · spáči',''],
  poobede:['Po obědě domů','Dopolední děti — odcházejí po obědě.'],
  neprit:['Nepřítomní','']};
function counts(){const o={};TABS_BY().forEach(([k])=>o[k]=data.filter(c=>inTab(c,k)).length);o.pres=data.filter(here).length;return o;}
function planPill(c){return c.plan==='celodenní'?'<span class="pill p-cel">celodenní</span>':c.plan==='dopolední'?'<span class="pill p-dop">dopolední</span>':'<span class="pill p-odp">odpolední</span>';}
function cellMark(code){if(!code)return '<span class="wc c-N">N</span>';if(code==='OM')return '<span class="bdg al" style="font-size:9px">om</span>';return `<span class="wc c-${code}">${code}</span>`;}
function codeLabel(code){const M={C:['celodenní','var(--color-primary)'],D:['dopolední','var(--color-accent)'],O:['odpolední','#3f5d72'],OM:['omluven','var(--color-danger)']};const m=M[code];return m?`<span style="color:${m[1]}">${m[0]}</span>`:'<span style="color:var(--color-text-hint)">nepřítomen</span>';}
function indicator(c){
  if(here(c)&&onTrip(c))return'<span class="ind awake" style="color:var(--color-accent)">na výpravě</span>';

}
function editPanel(c,i){

  h+=`<div class="field"><div class="l">Stav</div><div class="mini warn">${seg([['pritomen','Přítomen'],['omluveno','Omluveno'],['neomluveno','Neomluveno']],c.status,'setStatus')}</div></div>`;
  if(c.parentExcuse)h+=`<div class="field"><div class="l">Omluvenka od rodiče</div><div class="pnote">${c.parentExcuse.time} · ${c.parentExcuse.reason}</div></div>`;

}
function rosterHTML(){
  let out='',shown=0;
  const lst=data.map((c,i)=>({c,i})).sort((a,b)=>{const an=a.c.note?0:1,bn=b.c.note?0:1;if(an!==bn)return an-bn;return byAlpha(a,b);});

function renderDochazka(){

function todayRoster(){

function specialBar(d){

function dayRoster(d){

const dlegend=`<div class="legend"><span><b style="color:var(--color-primary)">C</b> celodenní</span><span><b style="color:var(--color-accent)">D</b> dopolední</span><span><b style="color:#3f5d72">O</b> odpolední</span><span><b style="color:var(--color-danger)">om</b> omluven</span><span><b style="color:var(--color-danger)">N</b> nepřítomen</span></div>`;
function renderTydenD(){

    for(let j=0;j<5;j++){const d=weekStart+j;if(d>30){h+=`<td></td>`;continue;}const code=getCode(c,d);if(code&&code!=='OM')tot[j]++;const ed=d>TODAYD,today=d===TODAYD;

window.setDView=v=>{view=v;open=-1;query='';monthDay=-1;if(v==='den')denDay=TODAYD;if(v==='tyden')weekStart=1;render();};

<script>

  h+=`</div>`;

  h+=`<div class="weekbox"><table class="wt"><thead><tr><th class="who">Průvodce</th>`+DAYS.map((d,j)=>`<th class="${j===TODAY?'today':''}">${d}</th>`).join('')+`</tr></thead><tbody>`;
  GUIDESHIFT.forEach((g,gi)=>{h+=`<tr><td class="who">${g.n}</td>`+g.days.map((d,di)=>`<td class="${di===TODAY?'today':''}">${shiftCell(d)}</td>`).join('')+`</tr>`;});

<script>

<script>
/* SCREEN: PRUVODCE_FOND */
let FONDHIST=[];
let fondFormOpen=false, odecet=null;

function spanDay(a){let d=a.day;const end=a.dayEnd||a.day;while(d<=end&&isWE(d))d++;return d;}
function presentIdx(a){const d=spanDay(a);if(isWE(d))return [];return data.map((c,i)=>i).filter(i=>{const k=getCode(data[i],d);return k&&k!=='OM';});}
function renderFond(){
  if(odecet)return renderOdecet();
  const paidAkce=[...AKCE].filter(a=>a.paid>0).sort((a,b)=>a.day-b.day);
  let h=`<div class="tile note-info">Fond je <b>per dítě</b>. Po akci se strhne jen dětem, které ten den <b>přišly</b> a <b>šly na akci</b> — ne celé třídě. Spravuje hospodářka.</div>`;

  h+=`<div class="vhead" style="margin-top:18px">Ruční čerpání (celá třída)</div>`;

  if(fondFormOpen)h+=`<div class="tile"><label class="pl">Co se čerpalo</label><input class="pin" id="f-name" placeholder="např. Výtvarný materiál"><label class="pl">Kdy</label><input class="pin" id="f-date" placeholder="např. červen 2026"><label class="pl">Částka na dítě (Kč)</label><input class="pin" id="f-amt" type="number" placeholder="0"><div class="mbtns"><button class="btn-ghost" onclick="togFond()">Zrušit</button><button class="btn-primary" onclick="addFond()">Strhnout celé třídě</button></div></div>`;
  h+=`<div class="vhead" style="margin-top:18px">Zůstatky dětí</div>`;
  h+=`<div class="rosterbox">`+data.map((c,i)=>({c,i})).sort(byAlpha).map(({c})=>`<div class="row"><div class="rmain" style="cursor:default">${avatar(c,26)}<span class="nm">${full(c)}</span><span class="ind" style="color:${c.fond<300?'var(--color-danger)':'var(--color-primary)'};font-weight:600">${c.fond.toLocaleString('cs-CZ')} Kč</span></div></div>`).join('')+`</div>`;
  if(FONDHIST.length){h+=`<div class="vhead" style="margin-top:18px">Historie čerpání</div>`;
    FONDHIST.forEach(x=>{h+=`<div class="frow"><div style="flex:1"><div class="aname">${x.name}</div><div class="ameta">${x.n}× ${x.amt} Kč = ${(x.n*x.amt).toLocaleString('cs-CZ')} Kč</div></div><button class="odbtn ghostred" onclick="stornoFond(${x.id})">Vrátit</button></div>`;});

  return h;
}
function renderOdecet(){
  const a=AKCE.find(x=>x.id===odecet.akceId), d=spanDay(a), wdi=wd(d);
  const present=isWE(d)?[]:data.map((c,i)=>({c,i})).filter(x=>{const k=getCode(x.c,d);return k&&k!=='OM';});
  let h=`<button class="back" onclick="cancelOdecet()">← Zpět na fond</button>`;

  h+=`<div class="note2" style="margin:0 2px 8px">Přítomných ${d}. 6.: <b>${present.length}</b>. Vyber, kdo se akce zúčastnil — strhne se jen jim.</div>`;
  h+=`<div class="filters">`+[['vse','Celá třída'],['pre','Jen předškoláci'],['vlastni','Vlastní výběr']].map(g=>`<button class="${odecet.group===g[0]?'on':''}" onclick="setOdGroup('${g[0]}')">${g[1]}</button>`).join('')+`</div>`;
  h+=`<input class="search" placeholder="Najít dítě…" value="${esc(odQuery)}" oninput="onOdSearch(this.value)">`;
  h+=`<div class="rosterbox">`+(present.length?present.filter(x=>!odQuery||norm(full(x.c)).includes(norm(odQuery))).sort(byAlpha).map(x=>`<div class="row"><div class="rmain" onclick="togOdChild(${x.i})"><span class="chk ${odecet.sel.has(x.i)?'on':''}">${odecet.sel.has(x.i)?'✓':''}</span>${avatar(x.c,26)}<span class="nm">${full(x.c)}</span>${x.c.predskolak?'<span class="bdg pre">předšk.</span>':''}<span class="ind" style="color:var(--color-text-muted)">${x.c.fond.toLocaleString('cs-CZ')} Kč</span></div></div>`).join('') : '<div class="empty">Ten den nikdo nepřišel.</div>')+`</div>`;
  const n=odecet.sel.size, tot=n*a.paid;
  h+=`<div class="tile" style="margin-top:11px"><div class="np"><span>Vybráno dětí</span><b>${n}</b></div><div class="np"><span>Strhne se celkem</span><b>${tot.toLocaleString('cs-CZ')} Kč</b></div></div>`;

  return h;
}
window.onOdSearch=v=>{odQuery=v;renderKeepFocus();};
window.togFond=()=>{fondFormOpen=!fondFormOpen;render();};
window.addFond=()=>{const n=document.getElementById('f-name').value.trim(),d=document.getElementById('f-date').value.trim(),amt=Number(document.getElementById('f-amt').value)||0;if(!n){showToast('Napiš, co se čerpalo');return;}const idxs=data.map((c,i)=>i);idxs.forEach(i=>{data[i].fond-=amt;data[i].fondLog.unshift({name:n,date:d||'—',amt});});FONDHIST.unshift({id:Date.now(),name:n,amt,n:idxs.length,idxs,akceId:null});fondFormOpen=false;render();showToast('Strženo celé třídě ✓');};
window.stornoFond=id=>{const k=FONDHIST.findIndex(x=>x.id===id);if(k<0)return;const x=FONDHIST[k];x.idxs.forEach(i=>{data[i].fond+=x.amt;const li=data[i].fondLog.findIndex(l=>l.name===x.name&&l.amt===x.amt);if(li>=0)data[i].fondLog.splice(li,1);});if(x.akceId){const a=AKCE.find(y=>y.id===x.akceId);if(a)a.done=false;}FONDHIST.splice(k,1);render();showToast('Čerpání vráceno ✓');};
window.startOdecet=id=>{const a=AKCE.find(x=>x.id===id);odecet={akceId:id,group:'vse',sel:new Set(presentIdx(a))};render();};
window.cancelOdecet=()=>{odecet=null;render();};
window.setOdGroup=g=>{const a=AKCE.find(x=>x.id===odecet.akceId),pres=presentIdx(a);if(g==='vse')odecet.sel=new Set(pres);else if(g==='pre')odecet.sel=new Set(pres.filter(i=>data[i].predskolak));odecet.group=g;render();};
window.togOdChild=i=>{odecet.group='vlastni';odecet.sel.has(i)?odecet.sel.delete(i):odecet.sel.add(i);render();};
window.confirmOdecet=()=>{const a=AKCE.find(x=>x.id===odecet.akceId);if(!odecet.sel.size){showToast('Nikdo nevybrán');return;}const n=odecet.sel.size;const idxs=[...odecet.sel];idxs.forEach(i=>{data[i].fond-=a.paid;data[i].fondLog.unshift({name:a.name,date:dayLbl(a),amt:a.paid});});a.done=true;FONDHIST.unshift({id:Date.now(),name:a.name,amt:a.paid,n,idxs,akceId:a.id});odecet=null;odQuery='';render();showToast('Strženo '+n+'× '+a.paid+' Kč ✓');};
</script>

  else{modal={id:null,name:'',day:8,dayEnd:'',time:'',place:'',note:'',paid:''};}
  renderModalRoot();
};
window.closeModal=()=>{modal=null;renderModalRoot();};
window.setMF=(f,v)=>{modal[f]=v;};
window.setMDate=(f,v)=>{modal[f]=v?Number(v.slice(8,10)):'';};
window.saveAkce=()=>{
  if(!modal.name.trim()){showToast('Napiš název akce');return;}
  const prev=modal.id?AKCE.find(x=>x.id===modal.id):null;
  const a={id:modal.id||('a'+(uid++)),name:modal.name.trim(),day:Number(modal.day)||1,dayEnd:modal.dayEnd?Number(modal.dayEnd):null,time:(modal.time||'').trim(),place:(modal.place||'').trim(),note:(modal.note||'').trim(),paid:modal.paid?Number(modal.paid):0,done:prev?prev.done:false};
  if(modal.id){const k=AKCE.findIndex(x=>x.id===modal.id);if(k>=0)AKCE[k]=a;}else{AKCE.push(a);}
  modal=null;renderModalRoot();render();showToast('Uloženo ✓');
};
window.delAkce=()=>{AKCE=AKCE.filter(x=>x.id!==modal.id);modal=null;renderModalRoot();render();showToast('Akce smazána');};
window.openShift=(gi,di)=>{const d=GUIDESHIFT[gi].days[di];shiftM={gi,di,on:serving(d)||!d,s:d&&d.s?d.s:'07:30',e:d&&d.e?d.e:'16:00',reason:d&&d.off?d.off:''};renderModalRoot();};
window.closeShift=()=>{shiftM=null;renderModalRoot();};
window.setShiftOn=b=>{shiftM.on=b;renderModalRoot();};
window.setShiftF=(f,v)=>{shiftM[f]=v;};
window.saveShift=()=>{const m=shiftM;GUIDESHIFT[m.gi].days[m.di]=m.on?{s:m.s,e:m.e}:(m.reason?{off:m.reason}:null);shiftM=null;renderModalRoot();render();showToast('Uloženo ✓');};
window.openAkceDetail=id=>{detailA=id;renderModalRoot();};
window.closeAkceDetail=()=>{detailA=null;renderModalRoot();};
window.editFromDetail=()=>{const id=detailA;detailA=null;openAkce(id);};
window.openCell=(ci,d)=>{if(d<=TODAYD)return;cellM={ci,d};renderModalRoot();};
window.closeCell=()=>{cellM=null;renderModalRoot();};
window.setCell=code=>{data[cellM.ci].att[cellM.d]=code;cellM=null;renderModalRoot();render();showToast('Docházka uložena ✓');};
</script>
<script>
/* CORE: PRUVODCE — stav, sekce, drawer, render(), go(), úvodní spuštění */
const SECTIONS=[
  ['prehled','Přehled','⌂'],
  ['dochazka','Docházka','✓'],
  ['plan','Plán & program','✎'],
  ['pruvodci','Docházka průvodců','◷'],
  ['kalendar','Kalendář','▦'],
  ['deti','Děti','☺'],
  ['fond','Kulturní fond','₵'],
  ['kontakty','Kontakty','✆'],
];
const TITLES=Object.fromEntries(SECTIONS.map(s=>[s[0],s[1]]));

let section='prehled', drawerOpen=false, wquery='';
let view='den', open=-1, query='', tab='rano';
let rytOpen=-1, modal=null, shiftM=null;
let detiFilter='all', detiQuery='', detiOpen=-1, odQuery='', kalSel=3, cellM=null, detailA=null, monthDay=-1, denDay=3, weekStart=1;

const RENDER={prehled:renderPrehled,dochazka:renderDochazka,plan:renderPlan,pruvodci:renderPruvodci,kalendar:renderKalendar,deti:renderDeti,fond:renderFond,kontakty:renderKontakty};

function renderDrawer(){
  const d=document.getElementById('drawer');
  d.classList.toggle('on',drawerOpen);
  document.getElementById('scrim').classList.toggle('on',drawerOpen);
  d.innerHTML=`<div class="dh">Vhaaji<small>průvodcovská appka</small></div>`+SECTIONS.map(s=>`<button class="ditem ${section===s[0]?'on':''}" onclick="go('${s[0]}')"><span class="ic">${s[2]}</span>${s[1]}</button>`).join('');
}
function render(){
  document.getElementById('ttl').textContent=TITLES[section];
  renderDrawer();
  document.getElementById('content').innerHTML=RENDER[section]();
}
window.go=s=>{section=s;drawerOpen=false;detiOpen=-1;render();};
window.openDrawer=()=>{drawerOpen=true;render();};
window.closeDrawer=()=>{drawerOpen=false;render();};

renderModalRoot();render();
</script>
</body>
