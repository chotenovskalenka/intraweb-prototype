<style>
/* Design tokens — sémantická vrstva. Hodnoty odvozené z vhaaji.cz (fáze 4.2, redesign).
   Viz docs/design-system.md. Komponenty čerpají z tokenů, nikdy natvrdo. */
:root{
  /* Povrchy / text */
  --color-bg:#EFEEE9;
  --color-surface:#F9F7F1;
  --color-surface-2:#E7E4DA;
  --color-text:#1F2A2E;
  --color-text-muted:#5C6560;
  --color-text-hint:#767B74;
  /* Značkové barvy */
  --color-primary:#2B7059;
  --color-primary-strong:#1F5344;
  --color-accent:#C8BC85;          /* okrová — výplň (tmavý text) */
  --color-accent-ink:#6F5F1C;      /* okrová jako text (AA na světlé) */
  --color-accent-soft:#C99C93;     /* tlumená růžová — dekor */
  --color-info:#496D7E;
  --color-on-primary:#F4EEDF;      /* text/prvky na primární ploše */
  /* Ohraničení / stavy */
  --color-border:rgba(31,42,46,.10);
  --color-border-strong:rgba(31,42,46,.16);
  --color-danger:#B0492F;
  --color-success:#387349;
  /* UI tinty (směr whitespace + barva) — světlé kategorie/stavy */
  --tint-green:#E3EDE7;
  --tint-rose:#F1E1DC;
  --tint-ochre:#F1EAD2;
  --tint-blue:#DEE7EA;
  /* Stavová paleta — jeden vizuální jazyk stavů napříč appkami (badge/chip/CODES).
     Každý stav má -ink (text) a -bg (světlá výplň). */
  --state-ok-ink:var(--color-success);       --state-ok-bg:rgba(56,115,73,.11);
  --state-info-ink:var(--color-info);        --state-info-bg:rgba(73,109,126,.10);
  --state-warn-ink:var(--color-accent-ink);  --state-warn-bg:rgba(200,188,133,.22);
  --state-danger-ink:var(--color-danger);    --state-danger-bg:rgba(176,73,47,.08);
  --state-neutral-ink:var(--color-text-muted);--state-neutral-bg:rgba(92,101,96,.14);
  --state-muted-ink:var(--color-text-hint);  --state-muted-bg:rgba(31,42,46,.07);
  --state-brand-ink:var(--color-primary);    --state-brand-bg:rgba(43,112,89,.12);
  --radius-md:14px;
  /* Typografie — nadpisy Bricolage Grotesque, tělo/UI Inter (univerzální pro všechny 4 školky).
     Token --font-serif drží nadpisový font (historický název; hodnota je bezpatková). */
  --font-serif:"Bricolage Grotesque",system-ui,sans-serif;
  --font-sans:"Inter",system-ui,sans-serif;
  /* spacing škála — aktivace v komponentách proběhne ve 4.3 */
  --space-xs:4px;
  --space-sm:8px;
  --space-md:12px;
  --space-lg:16px;
}
</style>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--color-bg);font-family:var(--font-sans);color:var(--color-text);-webkit-font-smoothing:antialiased;min-height:100vh;line-height:1.5}

/* Přístupnost: viditelný focus jen při klávesové navigaci (ne po kliknutí myší).
   Hlavně pro desktop/admin. */
:focus{outline:none}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,[tabindex]:focus-visible{
  outline:2px solid var(--color-primary);outline-offset:2px;border-radius:6px}

/* Přístupnost: respektuj systémové omezení pohybu (nevolnost z animací). */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;
    transition-duration:.01ms!important;scroll-behavior:auto!important}
}
</style>
<style>
.phone{width:100%;background:var(--color-bg)}
.screen{background:var(--color-bg);min-height:100vh}.scroll{padding:14px 16px 30px}
.topbar{display:flex;align-items:center;gap:12px;margin-bottom:13px}
.burger{min-width:44px;min-height:44px;display:inline-flex;align-items:center;justify-content:center;border:none;background:none;font-size:21px;line-height:1;color:var(--color-primary-strong);cursor:pointer;padding:2px 4px;margin-left:-8px}
.ttl{font-family:var(--font-serif);font-size:19px;color:var(--color-primary-strong);flex:1}
.role{font-size:11.5px;font-weight:500;color:var(--color-primary);background:rgba(43,112,89,.10);border:1px solid rgba(43,112,89,.18);padding:5px 10px;border-radius:999px;white-space:nowrap}
.scrim{position:fixed;inset:0;background:rgba(31,42,46,.42);z-index:5;display:none}.scrim.on{display:block}
.drawer{position:fixed;top:0;left:0;bottom:0;width:76%;max-width:300px;background:var(--color-bg);z-index:6;transform:translateX(-101%);transition:.22s;padding:20px 0 14px;box-shadow:6px 0 28px rgba(0,0,0,.16);overflow-y:auto}
.drawer.on{transform:none}
.dh{display:flex;align-items:center;gap:10px;font-family:var(--font-serif);font-size:17px;font-weight:700;color:var(--color-primary-strong);padding:0 20px 14px;border-bottom:1px solid var(--color-border);margin-bottom:8px}
.dh .brand-mark{width:32px;height:32px;flex:none;object-fit:contain}
.dh small{display:block;font-family:var(--font-sans);font-size:11.5px;color:var(--color-text-muted);font-weight:400}
.ditem{display:flex;align-items:center;gap:11px;min-height:44px;padding:12px 20px;font-size:15px;color:var(--color-text);cursor:pointer;border:none;background:none;width:100%;text-align:left;font-family:var(--font-sans)}
.ditem.on{background:rgba(43,112,89,.10);color:var(--color-primary);font-weight:600}
.ditem .ic{width:18px;text-align:center;opacity:.7}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--color-primary-strong);color:var(--color-on-primary);font-size:14px;font-weight:600;padding:11px 20px;border-radius:999px;opacity:0;pointer-events:none;transition:.22s;z-index:40;box-shadow:0 6px 20px rgba(0,0,0,.22)}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* Desktop (≥900px): responzivní shell — trvalý levý sidebar + obsah, který plyne
   do více sloupců (masonry). Full-width prvky (hero, akce, hlavičky sekcí, řádky
   docházky) jdou přes celou šířku. Na mobilu (<900px) zůstává drawer + jeden sloupec.
   Admin má vlastní layout-admin.css a tímto není dotčen. */
@media (min-width:900px){
  .screen{display:flex;align-items:flex-start}
  /* drawer = trvalý sidebar v toku (ne fixed overlay) */
  .drawer{position:sticky;top:0;left:auto;bottom:auto;transform:none;width:250px;max-width:250px;
    flex:none;height:100vh;border-radius:0;box-shadow:none;border-right:1px solid var(--color-border);z-index:1;padding:24px 0 16px}
  .scrim{display:none!important}
  .burger{display:none}
  .scroll{flex:1;min-width:0;max-width:1060px;margin:0 auto;padding:26px 36px 48px}
  .topbar{margin-bottom:20px}
  /* obsah do dvou vyvážených sloupců (fokus, ne rozsyp) */
  #content{column-count:2;column-gap:24px}
  #content > *{break-inside:avoid;margin-bottom:20px}
  /* karty na desktopu dostanou jemný stín pro definici (na krémovém pozadí jinak splývají) */
  #content > .tile,#content > .newsitem,#content > .newsbox,.dash3 .tile{box-shadow:0 1px 3px rgba(31,42,46,.06)}
  /* prvky přes celou šířku (přehledové hlavičky, akce, sekce, seznamy docházky) */
  #content > .dash-head,#content > .dash3,#content > .neuhr,#content > .daypicker,#content > .omluvbtn,#content > .vhead,
  #content > .switch,#content > .mini,#content > .bulktoggle,#content > .hint,#content > .note2,
  #content > .sectip,#content > .selinfo,#content > .choices,#content > .wkrow,#content > .legend,

/* Hover feedback — jen na zařízeních s myší (dotyk nezasažen). Doplněno v revizi ui-ux-pro-max. */
@media (hover:hover){
  a,button{transition:background-color .15s ease,color .15s ease,border-color .15s ease,filter .15s ease}
  /* navigace (drawer i admin sidebar) */
  .ditem:hover:not(.on),.sb-item:hover:not(.on){background:rgba(43,112,89,.07)}
  /* plné (primární) akce — jemné projasnění */
  .btn-primary:hover,.omluvbtn:hover,.addbig:hover,.savebtn:hover,.odbtn:hover,.fondbtn:hover,.btn-s.primary:hover,.omcheck:hover{filter:brightness(1.08)}
  /* ghost / outline / segment tlačítka — jemný tint */
  .cbtn:hover,.addbtn:hover,.bulktoggle:hover,.omx:hover,.filters button:hover:not(.on),.switch button:hover:not(.on),.mini button:hover:not(.on),.temanav button:hover:not(.on),.kids button:hover:not(.on),.choices button:hover{background:rgba(43,112,89,.06);border-color:var(--color-primary)}
  /* klikací karty / řádky — zvýraznění povrchu */
  button.tile:hover,.akce:hover,.newsrow:hover,.kbtn:hover,.prehl-abs:hover,.stepper button:hover:not(:disabled),.dh-step:hover{background:var(--color-surface-2)}
  /* textové odkazy */
  .clink:hover,.newsmore:hover,.cardlink:hover,.tlabbtn:hover{text-decoration:underline}
}
</style>
<style>
.specbar{background:rgba(200,188,133,.10);border:1px solid rgba(200,188,133,.3);border-radius:var(--radius-md);padding:11px 14px;margin-bottom:11px}
.spectit{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--color-accent-ink);font-weight:600;margin-bottom:6px}
.specnums{display:flex;gap:16px;font-size:13px;color:var(--color-text)}.specnums b{font-family:var(--font-serif);font-size:19px;color:var(--color-primary-strong);margin-right:4px}
.temanav{display:flex;gap:6px;margin-bottom:10px}
.temanav button{flex:1;min-height:44px;border:1px solid var(--color-border-strong);background:var(--color-surface);font-family:var(--font-sans);font-size:12.5px;font-weight:500;color:var(--color-text-muted);padding:10px 4px;border-radius:10px;cursor:pointer}
.temanav button.on{background:var(--color-primary);border-color:var(--color-primary);color:var(--color-on-primary)}
.frow{display:flex;gap:11px;align-items:center;background:var(--color-surface);border:1px solid var(--color-border);border-radius:12px;padding:11px 13px;margin-bottom:7px}
.odbtn{flex-shrink:0;min-height:44px;background:var(--color-primary);color:var(--color-on-primary);border:none;font-family:var(--font-sans);font-size:13px;font-weight:600;padding:8px 15px;border-radius:9px;cursor:pointer}
.gchips{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.gchip{display:flex;align-items:center;gap:7px;border:1px solid var(--color-border-strong);background:var(--color-surface-2);border-radius:999px;padding:5px 13px 5px 5px;font-size:13.5px;font-weight:500}
.rozh{font-size:13.5px;line-height:1.5;padding:8px 0;border-top:1px solid var(--color-border);color:var(--color-text)}.rozh:first-of-type{border-top:none}
.rozhd{font-size:11.5px;color:var(--color-primary);font-weight:600;margin-bottom:2px}
/* Docházka — desktop layout ve stylu Přehledu (hlavička + dva panely), ať to není roztáhlý mobil */
.doch-head .dh-t{margin:0 0 12px}
.doch-head .btn-primary{flex:0 0 auto;padding:12px 20px}
.doch-mealsfoot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:13px;padding-top:13px;border-top:1px solid var(--color-border)}
.doch-info .np{font-size:13.5px}
.doch-counts{display:grid;grid-template-columns:1fr 1fr;gap:8px;overflow:visible;padding:0}
.doch-counts .tab{flex:none}
/* sloučené pole: přepínač Den/Týden + listování data v jedné liště */
.dfield{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.dfield .dsw{margin:0;width:auto;flex:0 0 auto}
.dfield .dsw button{flex:0 0 auto;padding:10px 18px}
.dnav{display:flex;align-items:center;gap:2px;background:var(--color-surface-2);border:1px solid var(--color-border);border-radius:999px;padding:2px}
.dnav button{min-width:44px;min-height:44px;border:none;background:none;font-size:18px;color:var(--color-primary);cursor:pointer;font-family:var(--font-serif);line-height:1;border-radius:999px}
.dnav button:disabled{color:var(--color-text-hint);cursor:default}
.dnav span{font-family:var(--font-serif);font-size:14.5px;color:var(--color-primary-strong);padding:0 8px;white-space:nowrap}
@media (min-width:900px){
  #content > .doch{column-span:all;margin-bottom:0}
  .doch-head{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
  .doch-head .dh-t{margin:0}
  .doch-head .switch{width:auto;margin:0;flex:0 0 auto}
  .doch-den{display:grid;grid-template-columns:288px minmax(0,1fr);gap:24px;align-items:start}
  .doch-side{display:flex;flex-direction:column;gap:14px;position:sticky;top:20px}
  .doch-side>.stepper,.doch-side>.tabs,.doch-side>.tile,.doch-side>.specbar{margin-bottom:0}
  .doch-main{min-width:0}
  .doch-main>.search{margin-bottom:12px}
  .doch-main .rosterbox{max-height:none}
}
/* Přehled (dashboard) */
.prehl-abs{display:flex;align-items:center;gap:9px;min-height:44px;width:100%;text-align:left;background:none;border:none;border-top:1px solid var(--color-border);padding:9px 0;cursor:pointer;font-family:var(--font-sans)}
.prehl-abs .pa-nm{font-size:14px;font-weight:500;color:var(--color-text)}
.prehl-abs .pa-r{margin-left:auto;font-size:12px;color:var(--color-danger);text-align:right;max-width:52%;line-height:1.35}
.pa-cap{font-size:12px;color:var(--color-text-muted);margin-bottom:2px}
</style>
</head>

<script>
/* SCREEN: PRUVODCE_DOCHAZKA */
const SPECIAL={4:'hor',14:'pred',15:'pred',16:'pred'}; // v ostré verzi odvozeno z akcí v IS
let mode=SPECIAL[3]||'bezny';
const onTrip=c=>mode==='pred'?c.predskolak:mode==='hor'?c.lez:false;
const inTab=(c,t)=>{
  if(t==='rano')return here(c);
  if(t==='skolka')return here(c)&&!onTrip(c);
  if(t==='vyprava')return here(c)&&onTrip(c);
  if(t==='obed')return here(c);
  if(t==='spi')return staysPM(c)&&c.spi&&!onTrip(c);
  if(t==='poobede')return here(c)&&c.plan==='dopolední';
  if(t==='neprit')return !here(c);
};
const TABS_BEZNY=[['rano','Ráno'],['spi','Spí'],['poobede','Po obědě'],['neprit','Nepřítomní']];
const TABS_SPEC=g=>[['skolka','Školka ráno'],['vyprava',g],['obed','Oběd'],['spi','Spí'],['neprit','Nepřítomní']];
const TABS_BY=()=>mode==='bezny'?TABS_BEZNY:TABS_SPEC(mode==='pred'?'Předškoláci':'Lezci');
const CTX={rano:['Kdo dnes přišel',''],
  skolka:['Ráno ve školce',''],
  vyprava:['Na výpravě',''],
  obed:['Oběd — všichni',''],
  spi:['Maringotka · spáči',''],
  poobede:['Po obědě domů','Dopolední děti — odcházejí po obědě.'],
  neprit:['Nepřítomní','']};
function counts(){const o={};TABS_BY().forEach(([k])=>o[k]=data.filter(c=>inTab(c,k)).length);o.pres=data.filter(here).length;return o;}
function planPill(c){return c.plan==='celodenní'?'<span class="pill p-cel">celodenní</span>':c.plan==='dopolední'?'<span class="pill p-dop">dopolední</span>':'<span class="pill p-odp">odpolední</span>';}
function cellMark(code){if(!code)return '<span class="wc c-N">N</span>';if(code==='OM')return '<span class="bdg al" style="font-size:9px">om</span>';return `<span class="wc c-${code}">${code}</span>`;}
function codeLabel(code){const M={C:['celodenní',CODES.C[1]],D:['dopolední',CODES.D[1]],O:['odpolední',CODES.O[1]],OM:['omluven',CODES.OM[1]]};const m=M[code];return m?`<span style="color:${m[1]}">${m[0]}</span>`:'<span style="color:var(--color-text-hint)">nepřítomen</span>';}
function indicator(c){
  if(here(c)&&onTrip(c))return'<span class="ind awake" style="color:var(--color-accent-ink)">na výpravě</span>';
  if(c.status==='omluveno')return'<span class="ind off">omluveno</span>';
  if(c.status==='neomluveno')return'<span class="ind off">neomluveno</span>';
  if(c.plan==='dopolední')return'<span class="ind">po obědě domů</span>';
  return c.spi?'<span class="ind sleep">spí</span>':'<span class="ind awake">nespí</span>';
}
function editPanel(c,i){
  const seg=(arr,cur,fn)=>arr.map(o=>`<button class="${cur===o[0]?'on':''}" onclick="${fn}(${i},'${o[0]}')">${o[1]}</button>`).join('');
  let h=`<div class="field"><div class="l">Docházka</div><div class="mini">${seg([['dopolední','Dopol.'],['odpolední','Odpol.'],['celodenní','Celodenní']],c.plan,'setPlan')}</div></div>`;
  h+=`<div class="field"><div class="l">Stav</div><div class="mini warn">${seg([['pritomen','Přítomen'],['omluveno','Omluveno'],['neomluveno','Neomluveno']],c.status,'setStatus')}</div></div>`;
  if(c.parentExcuse)h+=`<div class="field"><div class="l">Omluvenka od rodiče</div><div class="pnote">${c.parentExcuse.time} · ${c.parentExcuse.reason}</div></div>`;
  if(c.note)h+=`<div class="field"><div class="l">Poznámka od rodiče</div><div class="pnote">${c.note}</div></div>`;
  if(staysPM(c))h+=`<div class="field"><div class="l">Odpoledne</div><div class="mini">${seg([[true,'Spí'],[false,'Nespí']],c.spi,'setSpi')}</div></div>`;
  return h;
}
function rosterHTML(){
  let out='',shown=0;
  const lst=data.map((c,i)=>({c,i})).sort((a,b)=>{const an=a.c.note?0:1,bn=b.c.note?0:1;if(an!==bn)return an-bn;return byAlpha(a,b);});
  lst.forEach(({c,i})=>{
    const match=query?norm(full(c)).includes(norm(query)):inTab(c,tab);
    if(!match)return;shown++;
    const noteLine=c.note?`<div class="rnote">✉️ ${c.note}</div>`:'';
    out+=`<div class="row${c.status!=='pritomen'?' absent':''}${open===i?' open':''}"><div class="rmain" onclick="toggle(${i})">`+
      `${avatar(c,30)}<span class="nm">${full(c)}</span>${planPill(c)}${indicator(c)}`+

function renderDochazka(){

// Sloučené pole: přepínač Den/Týden + listování data (den nebo týdenní rozsah) v jednom.
function renderDochNav(){

function renderDen(){return denDay===TODAYD?todayRoster():dayRoster(denDay);}
function todayRoster(){

function specialBar(d){

function dayRoster(d){

const dlegend=`<div class="legend"><span><b style="color:${CODES.C[1]}">C</b> celodenní</span><span><b style="color:${CODES.D[1]}">D</b> dopolední</span><span><b style="color:${CODES.O[1]}">O</b> odpolední</span><span><b style="color:${CODES.OM[1]}">om</b> omluven</span><span><b style="color:${CODES.NE[1]}">N</b> nepřítomen</span></div>`;
function renderTydenD(){

  data.forEach((c,ci)=>{if(wquery&&!norm(full(c)).includes(norm(wquery)))return;h+=`<tr><td class="who">${avatar(c,18)}${full(c)}</td>`;
    for(let j=0;j<5;j++){const d=weekStart+j;if(d>30){h+=`<td></td>`;continue;}const code=getCode(c,d);if(code&&code!=='OM')tot[j]++;const ed=d>=TODAYD,today=d===TODAYD;

  h+=`</tbody><tfoot><tr><td class="who">Přítomno</td>`+tot.map((n,j)=>{const d=weekStart+j;return `<td class="${d===TODAYD?'today':''}">${d>30?'':n}</td>`;}).join('')+`</tr></tfoot></table></div>`;

function renderDenRoster(d){

    return `<div class="row"><div class="rmain" ${locked?'style="cursor:default"':`onclick="openCell(${ci},${d})"`}>${avatar(c,30)}<span class="nm">${full(c)}</span><span class="ind" style="margin-left:auto;font-weight:500">${codeLabel(code)}</span></div></div>`;}).join('')+`</div>`;

function renderPruvodci(){

  const opener=todays.slice().sort((a,b)=>startMin(a.g.days[TODAY])-startMin(b.g.days[TODAY]))[0];
  if(todays.length&&!todays.some(x=>x.i===uspavaToday))uspavaToday=todays[0].i;
  let h='';
  h+=`<div class="tile"><div class="tlab">Dnes ve školce · středa</div>`;
  h+= todays.length? todays.map(x=>{const d=x.g.days[TODAY];return `<div class="np"><span>${x.g.n}${opener&&x.i===opener.i?' · <b style="color:var(--color-primary)">otevírá</b>':''}</span><b>${fmt(d.s)}–${fmt(d.e)}</b></div>`;}).join('') : '<div class="empty">Dnes nikdo nemá službu.</div>';
  if(todays.length)h+=`<div class="np" style="border-top:1px solid var(--color-border);margin-top:6px;padding-top:9px"><span>Dnes uspává</span><select class="selin" onchange="setUspava(this.value)">`+todays.map(x=>`<option value="${x.i}" ${x.i===uspavaToday?'selected':''}>${x.g.n}</option>`).join('')+`</select></div>`;
  h+=`</div>`;

  h+=`<div class="weekbox"><table class="wt"><thead><tr><th class="who">Průvodce</th>`+DAYS.map((d,j)=>`<th class="${j===TODAY?'today':''}">${d}</th>`).join('')+`</tr></thead><tbody>`;
  GUIDESHIFT.forEach((g,gi)=>{h+=`<tr><td class="who">${g.n}</td>`+g.days.map((d,di)=>`<td class="${di===TODAY?'today':''}">${shiftCell(d)}</td>`).join('')+`</tr>`;});

<script>

  else if(!isWE(kalSel))h+=`<div class="np"><span>Program</span><b>${RYTMUS[wd(kalSel)].prog}</b></div>`;

     `<div class="np"><span>Narozeniny</span><b>${c.nar}</b></div>`+

  if(c.note)h+=`<div class="tile"><div class="tlab">Aktuální poznámka</div><div class="tval">${c.note}</div></div>`;

  const ps=parentsFor(c);

  const rz=rozhovoryFor(i);
  h+=`<div class="tile"><div class="tlab">Rozhovory s rodiči (${rz.length})</div>`+rz.map(r=>`<div class="rozh"><div class="rozhd">${r.date}</div>${r.note}</div>`).join('')+`<label class="pl" style="margin-top:10px">Nový záznam</label><textarea class="pta" id="rozh-new" placeholder="zápis z rozhovoru, doporučení na doma…"></textarea><button class="btn-primary" style="width:100%;margin-top:9px" onclick="addRozhovor(${i})">Přidat záznam</button></div>`;
  h+=`<div class="tile"><div class="tlab">Fotky prací dítěte</div>`+(w?`<div class="works">`+Array.from({length:w}).map(()=>`<div class="work" style="background:#E3D9C6">práce</div>`).join('')+`</div>`:`<div class="note2" style="margin:0">Zatím žádné práce.</div>`)+`<button class="addbtn" onclick="addWork(${i})">+ Nahrát práci dítěte</button></div>`;

window.addRozhovor=i=>{const t=document.getElementById('rozh-new');const v=t?t.value.trim():'';if(!v){showToast('Napiš záznam');return;}rozhovoryFor(i).unshift({date:'27. 6. 2026',note:v});render();showToast('Záznam uložen ✓');};

<script>
/* SCREEN: PRUVODCE_FOND */
let FONDHIST=[];
let fondFormOpen=false, odecet=null;

function spanDay(a){let d=a.day;const end=a.dayEnd||a.day;while(d<=end&&isWE(d))d++;return d;}
function presentIdx(a){const d=spanDay(a);if(isWE(d))return [];return data.map((c,i)=>i).filter(i=>{const k=getCode(data[i],d);return k&&k!=='OM';});}
function renderFond(){
  if(odecet)return renderOdecet();
  const paidAkce=[...AKCE].filter(a=>a.paid>0).sort((a,b)=>a.day-b.day);
  let h=`<div class="tile note-info">Fond je <b>per dítě</b>. Po akci se strhne jen dětem, které ten den <b>přišly</b> a <b>šly na akci</b> — ne celé třídě. Spravuje hospodářka.</div>`;
  h+=`<div class="vhead">Placené akce</div>`;
  h+= paidAkce.length? paidAkce.map(a=>`<div class="frow"><span class="adate">${dayLbl(a)}</span><div style="flex:1"><div class="aname">${a.name}</div><div class="ameta">${a.paid} Kč/dítě</div></div>${a.done?'<span class="bdg pre" style="padding:6px 10px">odečteno ✓</span>':`<button class="odbtn" onclick="startOdecet('${a.id}')">Odečíst</button>`}</div>`).join('') : `<div class="empty">Žádné placené akce. Cenu nastavíš u akce v Plán &amp; program.</div>`;
  h+=`<div class="vhead" style="margin-top:18px">Ruční čerpání (celá třída)</div>`;
  h+=`<button class="addbig" onclick="togFond()">+ Přidat čerpání (např. materiál)</button>`;
  if(fondFormOpen)h+=`<div class="tile"><label class="pl">Co se čerpalo</label><input class="pin" id="f-name" placeholder="např. Výtvarný materiál"><label class="pl">Kdy</label><input class="pin" id="f-date" placeholder="např. červen 2026"><label class="pl">Částka na dítě (Kč)</label><input class="pin" id="f-amt" type="number" placeholder="0"><div class="mbtns"><button class="btn-ghost" onclick="togFond()">Zrušit</button><button class="btn-primary" onclick="addFond()">Strhnout celé třídě</button></div></div>`;
  h+=`<div class="vhead" style="margin-top:18px">Zůstatky dětí</div>`;
  h+=`<div class="rosterbox">`+data.map((c,i)=>({c,i})).sort(byAlpha).map(({c})=>`<div class="row"><div class="rmain" style="cursor:default">${avatar(c,26)}<span class="nm">${full(c)}</span><span class="ind" style="color:${c.fond<300?'var(--color-danger)':'var(--color-primary)'};font-weight:600">${c.fond.toLocaleString('cs-CZ')} Kč</span></div></div>`).join('')+`</div>`;
  if(FONDHIST.length){h+=`<div class="vhead" style="margin-top:18px">Historie čerpání</div>`;
    FONDHIST.forEach(x=>{h+=`<div class="frow"><div style="flex:1"><div class="aname">${x.name}</div><div class="ameta">${x.n}× ${x.amt} Kč = ${(x.n*x.amt).toLocaleString('cs-CZ')} Kč</div></div><button class="odbtn ghostred" onclick="stornoFond(${x.id})">Vrátit</button></div>`;});
    h+=`<div class="note2">Spletl/a ses? „Vrátit" čerpání stornuje — částka se dětem přičte zpět.</div>`;}
  return h;
}
function renderOdecet(){
  const a=AKCE.find(x=>x.id===odecet.akceId), d=spanDay(a), wdi=wd(d);
  const present=isWE(d)?[]:data.map((c,i)=>({c,i})).filter(x=>{const k=getCode(x.c,d);return k&&k!=='OM';});
  let h=`<button class="back" onclick="cancelOdecet()">← Zpět na fond</button>`;
  h+=`<div class="tile"><div class="tlab">Odečet po akci</div><div style="font-family:var(--font-serif);font-size:17px;color:var(--color-primary-strong)">${a.name}</div><div class="ameta">${dayLbl(a)} · ${a.paid} Kč/dítě</div></div>`;
  h+=`<div class="note2" style="margin:0 2px 8px">Přítomných ${d}. 6.: <b>${present.length}</b>. Vyber, kdo se akce zúčastnil — strhne se jen jim.</div>`;
  h+=`<div class="filters">`+[['vse','Celá třída'],['pre','Jen předškoláci'],['vlastni','Vlastní výběr']].map(g=>`<button class="${odecet.group===g[0]?'on':''}" onclick="setOdGroup('${g[0]}')">${g[1]}</button>`).join('')+`</div>`;
  h+=`<input class="search" placeholder="Najít dítě…" value="${esc(odQuery)}" oninput="onOdSearch(this.value)">`;
  h+=`<div class="rosterbox">`+(present.length?present.filter(x=>!odQuery||norm(full(x.c)).includes(norm(odQuery))).sort(byAlpha).map(x=>`<div class="row"><div class="rmain" onclick="togOdChild(${x.i})"><span class="chk ${odecet.sel.has(x.i)?'on':''}">${odecet.sel.has(x.i)?'✓':''}</span>${avatar(x.c,26)}<span class="nm">${full(x.c)}</span>${x.c.predskolak?'<span class="bdg pre">předšk.</span>':''}<span class="ind" style="color:var(--color-text-muted)">${x.c.fond.toLocaleString('cs-CZ')} Kč</span></div></div>`).join('') : '<div class="empty">Ten den nikdo nepřišel.</div>')+`</div>`;
  const n=odecet.sel.size, tot=n*a.paid;
  h+=`<div class="tile" style="margin-top:11px"><div class="np"><span>Vybráno dětí</span><b>${n}</b></div><div class="np"><span>Strhne se celkem</span><b>${tot.toLocaleString('cs-CZ')} Kč</b></div></div>`;
  h+=`<button class="btn-primary" style="width:100%" onclick="confirmOdecet()">Strhnout z fondu</button>`;
  return h;
}
window.onOdSearch=v=>{odQuery=v;renderKeepFocus();};
window.togFond=()=>{fondFormOpen=!fondFormOpen;render();};
window.addFond=()=>{const n=document.getElementById('f-name').value.trim(),d=document.getElementById('f-date').value.trim(),amt=Number(document.getElementById('f-amt').value)||0;if(!n){showToast('Napiš, co se čerpalo');return;}const idxs=data.map((c,i)=>i);idxs.forEach(i=>{data[i].fond-=amt;data[i].fondLog.unshift({name:n,date:d||'—',amt});});FONDHIST.unshift({id:Date.now(),name:n,amt,n:idxs.length,idxs,akceId:null});fondFormOpen=false;render();showToast('Strženo celé třídě ✓');};
window.stornoFond=id=>{const k=FONDHIST.findIndex(x=>x.id===id);if(k<0)return;const x=FONDHIST[k];x.idxs.forEach(i=>{data[i].fond+=x.amt;const li=data[i].fondLog.findIndex(l=>l.name===x.name&&l.amt===x.amt);if(li>=0)data[i].fondLog.splice(li,1);});if(x.akceId){const a=AKCE.find(y=>y.id===x.akceId);if(a)a.done=false;}FONDHIST.splice(k,1);render();showToast('Čerpání vráceno ✓');};
window.startOdecet=id=>{const a=AKCE.find(x=>x.id===id);odecet={akceId:id,group:'vse',sel:new Set(presentIdx(a))};render();};
window.cancelOdecet=()=>{odecet=null;render();};
window.setOdGroup=g=>{const a=AKCE.find(x=>x.id===odecet.akceId),pres=presentIdx(a);if(g==='vse')odecet.sel=new Set(pres);else if(g==='pre')odecet.sel=new Set(pres.filter(i=>data[i].predskolak));odecet.group=g;render();};
window.togOdChild=i=>{odecet.group='vlastni';odecet.sel.has(i)?odecet.sel.delete(i):odecet.sel.add(i);render();};
window.confirmOdecet=()=>{const a=AKCE.find(x=>x.id===odecet.akceId);if(!odecet.sel.size){showToast('Nikdo nevybrán');return;}const n=odecet.sel.size;const idxs=[...odecet.sel];idxs.forEach(i=>{data[i].fond-=a.paid;data[i].fondLog.unshift({name:a.name,date:dayLbl(a),amt:a.paid});});a.done=true;FONDHIST.unshift({id:Date.now(),name:a.name,amt:a.paid,n,idxs,akceId:a.id});odecet=null;odQuery='';render();showToast('Strženo '+n+'× '+a.paid+' Kč ✓');};
</script>

<script>
/* MODALS: PRUVODCE — renderModalRoot + HTML modálů a jejich handlery */
function d2date(day){return day?`2026-06-${String(day).padStart(2,'0')}`:'';}
function renderModalRoot(){
  const r=document.getElementById('modalRoot');
  if(modal){r.innerHTML=akceModalHTML();return;}
  if(shiftM){r.innerHTML=shiftModalHTML();return;}
  if(cellM){r.innerHTML=cellModalHTML();return;}

  const a=AKCE.find(x=>x.id===detailA);if(!a)return '';
  const rows=[['Datum',dayLbl(a)],['Čas',a.time],['Místo',a.place],['Cena z fondu',a.paid?`${a.paid} Kč/dítě`:''],['Poznámka',a.note]].filter(r=>r[1]);

function cellModalHTML(){
  const c=data[cellM.ci],d=cellM.d,today=d===TODAYD;
  // dnešek se řídí stavem (přítomen/omluven/neomluven); budoucí dny plánovaným kódem docházky
  const opts=today?[['pritomen','Přítomen'],['omluveno','Omluven'],['neomluveno','Neomluven']]
    :[['C','Celodenní'],['D','Dopolední'],['O','Odpolední'],['OM','Omluven'],['','Nepřítomen']];

    <div class="mbtns"><button class="btn-ghost" onclick="closeCell()">Zavřít</button></div>

}
function akceModalHTML(){
  return `<div class="modal-scrim" onclick="if(event.target===this)closeModal()"><div class="modal">
    <h3>${modal.id?'Upravit akci':'Nová akce'}</h3>
    <label class="pl">Název akce</label><input class="pin" value="${esc(modal.name)}" oninput="setMF('name',this.value)" placeholder="napiš název akce…">
    <label class="pl">Datum (od – do)</label><div class="mrow2"><input class="pin" type="date" min="2026-06-01" max="2026-06-30" value="${d2date(modal.day)}" oninput="setMDate('day',this.value)"><input class="pin" type="date" min="2026-06-01" max="2026-06-30" value="${d2date(modal.dayEnd)}" oninput="setMDate('dayEnd',this.value)"></div>
    <label class="pl">Čas</label><input class="pin" value="${esc(modal.time)}" oninput="setMF('time',this.value)" placeholder="nepovinné, např. 15:30">
    <label class="pl">Místo</label><input class="pin" value="${esc(modal.place)}" oninput="setMF('place',this.value)" placeholder="nepovinné">
    <label class="pl">Cena z fondu (Kč/dítě)</label><input class="pin" type="number" min="0" value="${modal.paid||''}" oninput="setMF('paid',this.value)" placeholder="nepovinné — když je akce placená">
    <label class="pl">Poznámka</label><textarea class="pta" oninput="setMF('note',this.value)" placeholder="nepovinné">${escTa(modal.note)}</textarea>
    <div class="mbtns"><button class="btn-ghost" onclick="closeModal()">Zrušit</button><button class="btn-primary" onclick="saveAkce()">Uložit</button></div>
    ${modal.id?`<button class="btn-del" onclick="delAkce()">Smazat akci</button>`:''}
  </div></div>`;
}
function shiftModalHTML(){
  const m=shiftM,g=GUIDESHIFT[m.gi];
  return `<div class="modal-scrim" onclick="if(event.target===this)closeShift()"><div class="modal">
    <h3>Služba — ${g.n}, ${DOW[m.di]}</h3>
    <div class="mini" style="margin-bottom:6px"><button class="${m.on?'on':''}" onclick="setShiftOn(true)">Slouží</button><button class="${!m.on?'on':''}" onclick="setShiftOn(false)">Neslouží</button></div>
    ${m.on?`<label class="pl">Příchod</label><input class="pin" type="time" value="${m.s}" oninput="setShiftF('s',this.value)"><label class="pl">Odchod</label><input class="pin" type="time" value="${m.e}" oninput="setShiftF('e',this.value)">`
    :`<label class="pl">Důvod (nepovinné)</label><select class="selin" style="width:100%" onchange="setShiftF('reason',this.value)"><option value="">—</option>${OFFREASONS.map(o=>`<option value="${o}" ${m.reason===o?'selected':''}>${o}</option>`).join('')}</select>`}
    <div class="mbtns"><button class="btn-ghost" onclick="closeShift()">Zrušit</button><button class="btn-primary" onclick="saveShift()">Uložit</button></div>
  </div></div>`;
}
window.openAkce=id=>{
  if(id){const a=AKCE.find(x=>x.id===id);modal={id:a.id,name:a.name,day:a.day,dayEnd:a.dayEnd||'',time:a.time||'',place:a.place||'',note:a.note||'',paid:a.paid||''};}
  else{modal={id:null,name:'',day:8,dayEnd:'',time:'',place:'',note:'',paid:''};}
  renderModalRoot();
};
window.closeModal=()=>{modal=null;renderModalRoot();};
window.setMF=(f,v)=>{modal[f]=v;};
window.setMDate=(f,v)=>{modal[f]=v?Number(v.slice(8,10)):'';};
window.saveAkce=()=>{
  if(!modal.name.trim()){showToast('Napiš název akce');return;}
  const prev=modal.id?AKCE.find(x=>x.id===modal.id):null;
  const a={id:modal.id||('a'+(uid++)),name:modal.name.trim(),day:Number(modal.day)||1,dayEnd:modal.dayEnd?Number(modal.dayEnd):null,time:(modal.time||'').trim(),place:(modal.place||'').trim(),note:(modal.note||'').trim(),paid:modal.paid?Number(modal.paid):0,done:prev?prev.done:false};
  if(modal.id){const k=AKCE.findIndex(x=>x.id===modal.id);if(k>=0)AKCE[k]=a;}else{AKCE.push(a);}
  modal=null;renderModalRoot();render();showToast('Uloženo ✓');
};
window.delAkce=()=>{AKCE=AKCE.filter(x=>x.id!==modal.id);modal=null;renderModalRoot();render();showToast('Akce smazána');};
window.openShift=(gi,di)=>{const d=GUIDESHIFT[gi].days[di];shiftM={gi,di,on:serving(d)||!d,s:d&&d.s?d.s:'07:30',e:d&&d.e?d.e:'16:00',reason:d&&d.off?d.off:''};renderModalRoot();};
window.closeShift=()=>{shiftM=null;renderModalRoot();};
window.setShiftOn=b=>{shiftM.on=b;renderModalRoot();};
window.setShiftF=(f,v)=>{shiftM[f]=v;};
window.saveShift=()=>{const m=shiftM;GUIDESHIFT[m.gi].days[m.di]=m.on?{s:m.s,e:m.e}:(m.reason?{off:m.reason}:null);shiftM=null;renderModalRoot();render();showToast('Uloženo ✓');};
window.openAkceDetail=id=>{detailA=id;renderModalRoot();};
window.closeAkceDetail=()=>{detailA=null;renderModalRoot();};
window.editFromDetail=()=>{const id=detailA;detailA=null;openAkce(id);};
window.openCell=(ci,d)=>{if(d<TODAYD)return;cellM={ci,d};renderModalRoot();};
window.closeCell=()=>{cellM=null;renderModalRoot();};
window.setCell=code=>{const d=cellM.d;if(d===TODAYD)data[cellM.ci].status=code;else data[cellM.ci].att[d]=code;cellM=null;renderModalRoot();render();showToast('Docházka uložena ✓');};
</script>
<script>
/* CORE: PRUVODCE — stav, sekce, drawer, render(), go(), úvodní spuštění */
const SECTIONS=[
  ['prehled','Přehled','⌂'],
  ['dochazka','Docházka','✓'],
  ['novinky','Novinky','✉'],
  ['plan','Plán & program','✎'],
  ['pruvodci','Docházka průvodců','◷'],
  ['kalendar','Kalendář','▦'],
  ['deti','Děti','☺'],
  ['fond','Kulturní fond','₵'],
  ['kontakty','Kontakty','✆'],
];
const TITLES=Object.fromEntries(SECTIONS.map(s=>[s[0],s[1]]));

let section='prehled', drawerOpen=false, wquery='';
let view='den', open=-1, query='', tab='rano';
let rytOpen=-1, modal=null, shiftM=null;
let detiFilter='all', detiQuery='', detiOpen=-1, odQuery='', kalSel=3, cellM=null, detailA=null, monthDay=-1, denDay=3, weekStart=1;

const RENDER={prehled:renderPrehled,dochazka:renderDochazka,novinky:renderNovinky,plan:renderPlan,pruvodci:renderPruvodci,kalendar:renderKalendar,deti:renderDeti,fond:renderFond,kontakty:renderKontakty};

function renderDrawer(){
  const d=document.getElementById('drawer');
  d.classList.toggle('on',drawerOpen);
  document.getElementById('scrim').classList.toggle('on',drawerOpen);
  d.innerHTML=`<div class="dh"><img class="brand-mark" src="${VHAAJI_LOGO}" alt=""><span class="brand-txt">Vhaaji<small>průvodcovská appka</small></span></div>`+SECTIONS.map(s=>`<button class="ditem ${section===s[0]?'on':''}" onclick="go('${s[0]}')"><span class="ic">${s[2]}</span>${s[1]}</button>`).join('');
}
function render(){
  document.getElementById('ttl').textContent=(section==='prehled'||section==='dochazka'||section==='novinky')?'':TITLES[section];
  renderDrawer();
  document.getElementById('content').innerHTML=RENDER[section]();
}
window.go=s=>{section=s;drawerOpen=false;detiOpen=-1;render();};
window.openDrawer=()=>{drawerOpen=true;render();};
window.closeDrawer=()=>{drawerOpen=false;render();};

renderModalRoot();render();
</script>
</body>
