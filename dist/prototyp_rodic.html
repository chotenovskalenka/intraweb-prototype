<style>
/* Design tokens — sémantická vrstva. Hodnoty odvozené z vhaaji.cz (fáze 4.2, redesign).
   Viz docs/design-system.md. Komponenty čerpají z tokenů, nikdy natvrdo. */
:root{
  /* Povrchy / text */
  --color-bg:#EFEEE9;
  --color-surface:#F9F7F1;
  --color-surface-2:#E7E4DA;
  --color-text:#1F2A2E;
  --color-text-muted:#5C6560;
  --color-text-hint:#767B74;
  /* Značkové barvy */
  --color-primary:#2B7059;
  --color-primary-strong:#1F5344;
  --color-accent:#C8BC85;          /* okrová — výplň (tmavý text) */
  --color-accent-ink:#6F5F1C;      /* okrová jako text (AA na světlé) */
  --color-accent-soft:#C99C93;     /* tlumená růžová — dekor */
  --color-info:#496D7E;
  --color-on-primary:#F4EEDF;      /* text/prvky na primární ploše */
  /* Ohraničení / stavy */
  --color-border:rgba(31,42,46,.10);
  --color-border-strong:rgba(31,42,46,.16);
  --color-danger:#B0492F;
  --color-success:#387349;
  /* UI tinty (směr whitespace + barva) — světlé kategorie/stavy */
  --tint-green:#E3EDE7;
  --tint-rose:#F1E1DC;
  --tint-ochre:#F1EAD2;
  --tint-blue:#DEE7EA;
  /* Stavová paleta — jeden vizuální jazyk stavů napříč appkami (badge/chip/CODES).
     Každý stav má -ink (text) a -bg (světlá výplň). */
  --state-ok-ink:var(--color-success);       --state-ok-bg:rgba(56,115,73,.11);
  --state-info-ink:var(--color-info);        --state-info-bg:rgba(73,109,126,.10);
  --state-warn-ink:var(--color-accent-ink);  --state-warn-bg:rgba(200,188,133,.22);
  --state-danger-ink:var(--color-danger);    --state-danger-bg:rgba(176,73,47,.08);
  --state-neutral-ink:var(--color-text-muted);--state-neutral-bg:rgba(92,101,96,.14);
  --state-muted-ink:var(--color-text-hint);  --state-muted-bg:rgba(31,42,46,.07);
  --state-brand-ink:var(--color-primary);    --state-brand-bg:rgba(43,112,89,.12);
  --radius-md:14px;
  /* Typografie — nadpisy Bricolage Grotesque, tělo/UI Inter (univerzální pro všechny 4 školky).
     Token --font-serif drží nadpisový font (historický název; hodnota je bezpatková). */
  --font-serif:"Bricolage Grotesque",system-ui,sans-serif;
  --font-sans:"Inter",system-ui,sans-serif;
  /* spacing škála — aktivace v komponentách proběhne ve 4.3 */
  --space-xs:4px;
  --space-sm:8px;
  --space-md:12px;
  --space-lg:16px;
}
</style>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--color-bg);font-family:var(--font-sans);color:var(--color-text);-webkit-font-smoothing:antialiased;min-height:100vh;line-height:1.5}

/* Přístupnost: viditelný focus jen při klávesové navigaci (ne po kliknutí myší).
   Hlavně pro desktop/admin. */
:focus{outline:none}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,[tabindex]:focus-visible{
  outline:2px solid var(--color-primary);outline-offset:2px;border-radius:6px}

/* Přístupnost: respektuj systémové omezení pohybu (nevolnost z animací). */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;
    transition-duration:.01ms!important;scroll-behavior:auto!important}
}
</style>
<style>
.phone{width:100%;background:var(--color-bg)}
.screen{background:var(--color-bg);min-height:100vh}.scroll{padding:14px 16px 30px}
.topbar{display:flex;align-items:center;gap:12px;margin-bottom:13px}
.burger{min-width:44px;min-height:44px;display:inline-flex;align-items:center;justify-content:center;border:none;background:none;font-size:21px;line-height:1;color:var(--color-primary-strong);cursor:pointer;padding:2px 4px;margin-left:-8px}
.ttl{font-family:var(--font-serif);font-size:19px;color:var(--color-primary-strong);flex:1}
.role{font-size:11.5px;font-weight:500;color:var(--color-primary);background:rgba(43,112,89,.10);border:1px solid rgba(43,112,89,.18);padding:5px 10px;border-radius:999px;white-space:nowrap}
.scrim{position:fixed;inset:0;background:rgba(31,42,46,.42);z-index:5;display:none}.scrim.on{display:block}
.drawer{position:fixed;top:0;left:0;bottom:0;width:76%;max-width:300px;background:var(--color-bg);z-index:6;transform:translateX(-101%);transition:.22s;padding:20px 0 14px;box-shadow:6px 0 28px rgba(0,0,0,.16);overflow-y:auto}
.drawer.on{transform:none}
.dh{display:flex;align-items:center;gap:10px;font-family:var(--font-serif);font-size:17px;font-weight:700;color:var(--color-primary-strong);padding:0 20px 14px;border-bottom:1px solid var(--color-border);margin-bottom:8px}
.dh .brand-mark{width:32px;height:32px;flex:none;object-fit:contain}
.dh small{display:block;font-family:var(--font-sans);font-size:11.5px;color:var(--color-text-muted);font-weight:400}
.ditem{display:flex;align-items:center;gap:11px;min-height:44px;padding:12px 20px;font-size:15px;color:var(--color-text);cursor:pointer;border:none;background:none;width:100%;text-align:left;font-family:var(--font-sans)}
.ditem.on{background:rgba(43,112,89,.10);color:var(--color-primary);font-weight:600}
.ditem .ic{width:18px;text-align:center;opacity:.7}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--color-primary-strong);color:var(--color-on-primary);font-size:14px;font-weight:600;padding:11px 20px;border-radius:999px;opacity:0;pointer-events:none;transition:.22s;z-index:40;box-shadow:0 6px 20px rgba(0,0,0,.22)}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* Desktop (≥900px): responzivní shell — trvalý levý sidebar + obsah, který plyne
   do více sloupců (masonry). Full-width prvky (hero, akce, hlavičky sekcí, řádky
   docházky) jdou přes celou šířku. Na mobilu (<900px) zůstává drawer + jeden sloupec.
   Admin má vlastní layout-admin.css a tímto není dotčen. */
@media (min-width:900px){
  .screen{display:flex;align-items:flex-start}
  /* drawer = trvalý sidebar v toku (ne fixed overlay) */
  .drawer{position:sticky;top:0;left:auto;bottom:auto;transform:none;width:250px;max-width:250px;
    flex:none;height:100vh;border-radius:0;box-shadow:none;border-right:1px solid var(--color-border);z-index:1;padding:24px 0 16px}
  .scrim{display:none!important}
  .burger{display:none}
  .scroll{flex:1;min-width:0;max-width:1060px;margin:0 auto;padding:26px 36px 48px}
  .topbar{margin-bottom:20px}
  /* obsah do dvou vyvážených sloupců (fokus, ne rozsyp) */
  #content{column-count:2;column-gap:24px}
  #content > *{break-inside:avoid;margin-bottom:20px}
  /* karty na desktopu dostanou jemný stín pro definici (na krémovém pozadí jinak splývají) */
  #content > .tile,#content > .newsitem,#content > .newsbox,.dash3 .tile{box-shadow:0 1px 3px rgba(31,42,46,.06)}
  /* prvky přes celou šířku (přehledové hlavičky, akce, sekce, seznamy docházky) */
  #content > .dash-head,#content > .dash3,#content > .neuhr,#content > .daypicker,#content > .omluvbtn,#content > .vhead,
  #content > .switch,#content > .mini,#content > .bulktoggle,#content > .hint,#content > .note2,
  #content > .sectip,#content > .selinfo,#content > .choices,#content > .wkrow,#content > .legend,

.gbars{display:flex;flex-direction:column;gap:2px;width:100%;padding:2px 4px 0;align-items:stretch}
.gbar{height:3px;border-radius:2px}
.gbar.akce,.gvbar.akce{background:#33b679}
.gbar.naro,.gvbar.naro{background:#e67c73}
.gbar.rozvrh,.gvbar.rozvrh{background:#039be5}
.gbar.org,.gvbar.org{background:#8e24aa}
.gday{font-size:14px;font-weight:600;color:#3c4043;margin:14px 4px 8px}
.gev{display:flex;align-items:center;gap:11px;padding:9px 4px;font-size:13.5px;color:#3c4043;border-top:1px solid #f1f3f4}
.gev:first-of-type{border-top:none}
.gvbar{width:4px;height:18px;border-radius:2px;flex-shrink:0}
.gevt{margin-left:auto;color:#70757a;font-size:11px}
.gnone{font-size:12.5px;color:#9aa0a6;font-style:italic;padding:8px 4px}
.gcalnav{display:flex;justify-content:space-between;align-items:center;margin:0 2px 12px}
.gstep{display:flex;align-items:center;gap:2px}
.gstep button{border:none;background:none;color:#5f6368;font-size:18px;cursor:pointer;padding:2px 8px;line-height:1}
.gstep .gmo{font-size:16px;font-weight:600;color:#3c4043;min-width:64px;text-align:center;text-transform:capitalize}
.gstep .gyr{font-size:16px;font-weight:600;color:#3c4043;min-width:42px;text-align:center}
.gcell.gempty{cursor:default;background:transparent}
.doch-sleep{font-size:13px;color:var(--color-text-muted);margin:-6px 0 10px}
.doch-sleep b{color:var(--color-text)}
.doch-pozn{background:var(--tint-ochre);border-radius:9px;padding:8px 11px;font-size:13px;line-height:1.45;margin:0 0 10px}
.glist{display:flex;flex-wrap:wrap;gap:8px}
.bp{padding:8px 0 4px}
.bp+.bp{border-top:1px solid var(--color-border);margin-top:4px}
.bp-k{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--color-text-muted);margin-bottom:3px}
.bp-t{font-size:13.5px;line-height:1.5}
.bp-link{display:inline-flex;align-items:center;min-height:44px;color:var(--color-primary);font-weight:600;font-size:12.5px;text-decoration:none}
/* Modal: nahlásit dnešní absenci */
.omluvbtn.danger{background:var(--color-danger)}
.abs-sub{font-size:12.5px;color:var(--color-text-muted);margin:-2px 0 10px}
.abs-warn{background:var(--state-danger-bg);border:1px solid rgba(176,73,47,.25);color:var(--color-danger);border-radius:9px;padding:9px 12px;font-size:13px;line-height:1.45;margin-bottom:10px}
.abs-menu{background:var(--color-surface-2);border-radius:9px;padding:6px 11px;margin-bottom:8px}
.abs-hint{font-size:12px;color:var(--color-text-hint);margin:6px 0 2px}
</style>
</head>

<script>
/* SCREEN: RODIC_PLATBY */
function fakeQR(seed,px){
  const n=25,m=px/n,f=[[0,0],[0,18],[18,0]];
  const inF=(r,c)=>f.some(p=>r>=p[0]&&r<p[0]+7&&c>=p[1]&&c<p[1]+7);
  let s=`<rect width="${px}" height="${px}" fill="#fff"/>`;
  f.forEach(p=>{const x=p[1]*m,y=p[0]*m;s+=`<rect x="${x}" y="${y}" width="${7*m}" height="${7*m}" fill="#111"/><rect x="${x+m}" y="${y+m}" width="${5*m}" height="${5*m}" fill="#fff"/><rect x="${x+2*m}" y="${y+2*m}" width="${3*m}" height="${3*m}" fill="#111"/>`;});
  let h=seed||1;
  for(let r=0;r<n;r++)for(let c=0;c<n;c++){if(inF(r,c))continue;h=(h*1103515245+12345)&0x7fffffff;if((h>>9)&1)s+=`<rect x="${c*m}" y="${r*m}" width="${m}" height="${m}" fill="#111"/>`;}
  return `<svg viewBox="0 0 ${px} ${px}" width="${px}" height="${px}">${s}</svg>`;
}
function renderPlatby(){
  const c=cur(), f=c.fond, zb=f.rocni-f.cerpano, due=c.faktury.find(x=>!x.paid);

  }else{

  }
  h+=`<button class="tile fondbtn" onclick="openFond()"><div class="ftop"><span class="tlab" style="margin:0">Kulturní fond</span><span class="more">Detail ›</span></div><div class="np" style="margin-top:6px"><span>Zbývá</span><b style="color:var(--color-primary)">${kc(zb)} Kč</b></div></button>`;

  return h;

  let h=`<button class="back" onclick="closeOverlay()">← Zpět</button><div class="pname">Kulturní fond</div><div class="pfull">${c.n}</div>`;
  h+=`<div class="tile"><div class="np"><span>Roční příspěvek</span><b>${kc(f.rocni)} Kč</b></div><div class="np"><span>Vyčerpáno</span><b>${kc(f.cerpano)} Kč</b></div><div class="np" style="border-top:1px solid var(--color-border);margin-top:4px;padding-top:8px"><span>Zbývá</span><b style="color:var(--color-primary)">${kc(zb)} Kč</b></div></div>`;
  h+=`<div class="tile"><div class="tlab">Z čeho se čerpalo</div>`+FONDLOG.map(x=>`<div class="frow"><div class="fL"><div class="fo">${x[0]}</div><div class="fv">${x[1]}</div></div><div class="fa">${kc(x[2])} Kč</div></div>`).join('')+`</div>`;
  h+=`<div class="note2">Kulturní fond pokrývá divadla, výlety, výtvarný materiál apod. Položky jsou demo.</div>`;
  return h;
}
function renderMenuDetail(){
  let h=`<button class="back" onclick="closeOverlay()">← Zpět</button><div class="pname">Jídelníček</div><div class="pfull">tento týden</div>`;
  for(let d=1;d<=5;d++){
    h+=`<div class="tile"><div class="tlab">${DOW[wd(d)]} ${d}. 6.${d===TODAY?' · dnes':''}</div>`+MENUS[wd(d)].map(it=>`<div class="mrow"><span class="mk2">${it[0]}</span><span class="mv">${it[1]}</span>${it[2]?`<span class="alerg">${it[2]}</span>`:''}</div>`).join('')+`</div>`;
  }
  h+=`<div class="tile"><div class="tlab">Stravné</div><div class="np"><span>Dopolední svačina</span><b>20 Kč</b></div><div class="np"><span>Oběd</span><b>80 Kč</b></div><div class="np"><span>Odpolední svačina</span><b>15 Kč</b></div></div>`;
  h+=`<div class="note2">Alergeny jsou uvedené čísly dle přílohy vyhlášky. Jídelníček dodává Mamafood. Při omluvě do 20:00 předchozího dne se stravné nepočítá.</div>`;
  return h;
}
function renderGuide(i){const g=guides[i];
  return `<button class="back" onclick="closeOverlay()">← Zpět</button><div class="pav">${avatar(g,76)}</div><div class="pname">${g.n}${g.uspava?' ☾':''}</div><div class="pfull">průvodce${g.uspava?' · dnes uspává':''}</div>
   <div class="tile"><div class="tlab">Kdy je ve školce</div><div class="tval">${g.schedule}</div></div>
   <div class="tile"><div class="tlab">Kontakt</div><div class="contact"><a class="cbtn" href="tel:${telnum(g.phone)}">Zavolat</a><a class="cbtn" href="sms:${telnum(g.phone)}">Napsat</a><a class="cbtn" href="mailto:${g.email}">E-mail</a></div><div class="cinfo">${g.phone} · ${g.email}</div></div>`;
}
function renderAkceDetail(i){const a=akce[i];
  return `<button class="back" onclick="closeOverlay()">← Zpět</button><div class="pname">${a.title}</div><div class="pfull">${a.date}</div>
   <div class="tile"><div class="np"><span>Kdy</span><b>${a.time}</b></div><div class="np"><span>Kde</span><b>${a.place}</b></div></div>
   <div class="tile"><div class="tlab">Info</div><div class="tval">${a.note}</div></div>`;
}
window.openGuide=i=>{overlay={type:'guide',idx:i};render();};
window.openAkce=i=>{overlay={type:'akce',idx:i};render();};
window.openFond=()=>{overlay={type:'fond'};render();};
window.openMenu=()=>{overlay={type:'menu'};render();};
window.closeOverlay=()=>{overlay=null;render();};

/* --- OMLUVENKA (Flow 2) --- overlay řízený stavem omDraft */
let omDraft=null;
const omDays=()=>{const a=[];for(let d=omDraft.od;d<=omDraft.do;d++)if(!isWE(d))a.push(d);return a;};
function omGrid(which){
  let h=`<div class="dpcal">`;['P','Ú','S','Č','P','S','N'].forEach(x=>h+=`<div class="dph">${x}</div>`);
  for(let d=1;d<=30;d++){
    if(isWE(d)||d<=NOW.d){h+=`<div class="dpcell we">${d}</div>`;continue;}
    const sel=omDraft[which]===d, rng=d>=omDraft.od&&d<=omDraft.do;
    h+=`<div class="dpcell${sel?' sel':rng?' rng':''}${d===TODAY?' today':''}" onclick="omPick('${which}',${d})">${d}</div>`;
  }
  return h+`</div>`;
}
function omDeadline(){
  const days=omDays(), timely=days.filter(beforeDeadline), late=days.filter(d=>!beforeDeadline(d));
  let h=`<div class="tile note-info"><div class="tlab" style="color:var(--color-primary);margin-bottom:5px">Než odešleš</div>`;
  h+=`<div class="omdrow">Omluvit lze do <b>20:00 předchozího dne</b>.</div>`;
  if(timely.length)h+=`<div class="omdrow ok">✓ Vznikne <b>${timely.length} ${nplural(timely.length)}</b> (za ${timely.length} včas omluvený ${plural(timely.length)}).</div>`;
  if(late.length)h+=`<div class="omdrow bad">⚠ Omluva na ${late.map(d=>d+'. 6.').join(', ')} je po deadlinu — <b>náhrada nevznikne</b>. Dítě je omluvené.</div>`;
  return h+`</div>`;
}
function renderOmluvenka(){
  const c=cur();
  let h=`<button class="back" onclick="closeOverlay()">← Zpět</button><div class="pname">Omluvit ${c.ak}</div>`;
  if(omDraft.step==='done')return h+renderOmluvenkaDone(c);
  h+=`<div class="pfull">Vyberte dny, kdy ${c.n} nebude ve školce</div>`;
  h+=`<div class="tile"><div class="tlab">Od</div>${omGrid('od')}</div>`;
  h+=`<div class="tile"><div class="tlab">Do</div>${omGrid('do')}</div>`;
  h+=`<div class="tile"><div class="tlab">Důvod</div><div class="pchips">`+[['nemoc','Nemoc'],['rodinné důvody','Rodinné důvody'],['jiné','Jiné']].map(([k,l])=>`<button class="${omDraft.duvod===k?'on':''}" onclick="omReason('${k}')">${l}</button>`).join('')+`</div>`;
  h+=`<textarea class="note" placeholder="Poznámka pro průvodce (nepovinné)" oninput="omNote(this.value)">${escTa(omDraft.pozn)}</textarea></div>`;
  h+=omDeadline();
  h+=`<button class="omluvbtn" onclick="omSubmit()">Odeslat omluvenku</button>`;
  return h;
}
function renderOmluvenkaDone(c){
  const r=omDraft.result;
  let h=`<div class="tile omdone"><div class="omcheck">✓</div><div class="omdt">Omluvenka odeslána</div><div class="omsub">${c.n} · ${fmtRange(omDraft.od,omDraft.do)} · ${DUVODLAB[omDraft.duvod]}</div>`;
  if(r.timely)h+=`<div class="omres ok">Vznikl${r.timely===1?'a':'y'} <b>${r.timely} ${nplural(r.timely)}</b> — najdeš ${r.timely===1?'ji':'je'} níže v Docházce a náhradách.</div>`;
  if(r.late)h+=`<div class="omres bad">Za ${r.late} ${plural(r.late)} po deadlinu <b>náhrada nevznikla</b>.</div>`;
  h+=`<div class="omnext">Průvodci teď vidí, že ${c.n} nebude ve školce. ${r.timely?'Včas omluvené dny jsme označili jako omluvené (OM).':''}${r.late?' Dny po deadlinu jsou neomluvené (NE).':''}</div></div>`;
  h+=`<button class="omluvbtn" onclick="go('dochazka')">Zobrazit náhrady</button>`;
  h+=`<button class="omdonebtn" onclick="closeOverlay()">Hotovo</button>`;
  return h;
}
/* Volitelný prefill dne (z dashboardu: dnešek = pozdní omluva, budoucí den = včasná).
   Bez argumentu (sekce Docházka) předvyplní nejbližší omluvitelný den. */
window.openOmluvenka=day=>{let t;if(day>NOW.d&&day<=30&&!isWE(day)){t=day;}else{t=NOW.d+1;while(t<=30&&isWE(t))t++;}omDraft={od:t,do:t,duvod:'nemoc',pozn:'',step:'form',result:null};overlay={type:'omluvenka'};render();};
window.omPick=(which,d)=>{omDraft[which]=d;if(which==='od'&&omDraft.do<d)omDraft.do=d;if(which==='do'&&d<omDraft.od)omDraft.od=d;render();};
window.omReason=k=>{omDraft.duvod=k;render();};
window.omNote=v=>{omDraft.pozn=v;};
window.omSubmit=()=>{
  const c=cur(), days=omDays(); if(!days.length)return;
  const timely=days.filter(beforeDeadline), late=days.filter(d=>!beforeDeadline(d));
  const om={id:uid(),od:omDraft.od,do:omDraft.do,duvod:omDraft.duvod,pozn:omDraft.pozn,
    stav:beforeDeadline(omDraft.od)?'vcas':'po-deadlinu',nahradaIds:[]};
  timely.forEach(d=>{c.att[d]='OM';});late.forEach(d=>{c.att[d]='NE';});
  days.forEach(d=>{if(omDraft.pozn)c.notes[d]=omDraft.pozn;});
  timely.forEach(d=>{const n=nahFrom(juneDate(d),'dostupna',{den:d,omId:om.id});c.nahrady.push(n);om.nahradaIds.push(n.id);});
  late.forEach(d=>{const n=nahFrom(juneDate(d),'nevznikla',{den:d,omId:om.id,exp:'—',expT:Infinity});c.nahrady.push(n);om.nahradaIds.push(n.id);});
  c.omluvenky.unshift(om);
  omDraft.step='done';omDraft.result={timely:timely.length,late:late.length};
  render();
};
window.omCancel=id=>{
  const c=cur(), om=c.omluvenky.find(o=>o.id===id); if(!om)return;
  om.stav='zrusena';
  for(let d=om.od;d<=om.do;d++){if(c.att[d]==='OM')delete c.att[d];}
  c.nahrady=c.nahrady.filter(n=>!(om.nahradaIds||[]).includes(n.id));
  render();showToast('Omluvenka zrušena, náhrady odečteny');
};

/* --- Modal: Nahlásit dnešní absenci (po deadlinu → neomluveno, bez náhrady) --- */
let absModal=null;
window.openAbsDnes=()=>{absModal={obed:null,pozn:''};render();};
window.absObed=v=>{absModal.obed=v;render();};
window.absPozn=v=>{absModal.pozn=v;};
window.absClose=()=>{absModal=null;render();};
window.absSubmit=()=>{
  const c=cur();
  c.att[TODAY]='NE'; if(absModal.pozn)c.notes[TODAY]=absModal.pozn;
  c.obed=c.obed||{}; c.obed[TODAY]=absModal.obed===true;
  const om={id:uid(),od:TODAY,do:TODAY,duvod:'jiné',pozn:absModal.pozn,stav:'po-deadlinu',nahradaIds:[]};
  const n=nahFrom(juneDate(TODAY),'nevznikla',{den:TODAY,omId:om.id,exp:'—',expT:Infinity});
  c.nahrady.push(n); om.nahradaIds.push(n.id); c.omluvenky.unshift(om);
  absModal=null; showToast('Absence nahlášena'); render();
};
function renderAbsModal(){
  const c=cur(), menu=MENUS[wd(TODAY)];
  const obedy=menu.filter(it=>/pol|hlavn/i.test(it[0]));
  let h=`<div class="modal-scrim" onclick="absClose()"><div class="modal" onclick="event.stopPropagation()">`;
  h+=`<h3>Nahlásit dnešní absenci</h3><div class="abs-sub">${c.n} · středa 3. 6.</div>`;
  h+=`<div class="abs-warn">⚠ Je po deadlinu (20:00 včera). Den bude <b>neomluvený</b> a náhrada nevznikne.</div>`;
  h+=`<div class="notelab">Důvod absence — nepovinné</div><textarea class="note" placeholder="např. nemoc, rodinný důvod…" oninput="absPozn(this.value)">${escTa(absModal.pozn)}</textarea>`;
  h+=`<div class="notelab">Vyzvednete si oběd?</div>`;
  h+=`<div class="abs-menu">`+obedy.map(it=>`<div class="mrow"><span class="mk2">${it[0]}</span><span class="mv">${it[1]}</span></div>`).join('')+`</div>`;
  h+=`<div class="choices"><button class="${absModal.obed===true?'on':''}" onclick="absObed(true)">Ano, vyzvedneme</button><button class="${absModal.obed===false?'on':''}" onclick="absObed(false)">Ne</button></div>`;
  h+=`<div class="abs-hint">Nevyzvednutý oběd propadá.</div>`;
  h+=`<div class="mbtns"><button class="btn-ghost" onclick="absClose()">Zrušit</button><button class="omluvbtn danger" style="margin:0" onclick="absSubmit()">Nahlásit neomluvenou absenci</button></div>`;
  return h+`</div></div>`;
}
</script>
<script>
/* CORE: RODIC — stav, sekce, drawer/hlavička, render(), go(), toast, úvodní spuštění */
const SECTIONS=[['prehled','Přehled','◆'],['aktuality','Aktuality','▲'],['dochazka','Docházka a náhrady','✓'],['profil','Profil dítěte','☺'],['platby','Platby','₵'],
  ['kalendar','Kalendář','▦'],['plan','Tématický plán','✎'],['fotky','Fotky','▢'],['kontakty','Kontakty','✆']];
const TITLES=Object.fromEntries(SECTIONS.map(s=>[s[0],s[1]]));
const PERCHILD=['prehled','dochazka','profil','platby','fotky'];

let ci=0, section='prehled', view='tyden', sel=-1, bulk=false, selSet=new Set(), overlay=null, drawerOpen=false, dashDay=TODAY, kalSel=TODAY;
let kalY=2026, kalM=5;
let kidMenuOpen=false;
let dashEdit=false;
let draft={};   // {den: {code, note}}
let dashPickerOpen=false;

const RENDER={prehled:renderDashboard,aktuality:renderAktuality,dochazka:renderDochazka,profil:renderProfil,platby:renderPlatby,kalendar:renderKalendar,plan:renderPlan,fotky:renderFotky,kontakty:renderKontakty};

function renderDrawer(){
  const d=document.getElementById('drawer');
  d.classList.toggle('on',drawerOpen);
  document.getElementById('scrim').classList.toggle('on',drawerOpen);
  d.innerHTML=`<div class="dh"><img class="brand-mark" src="${VHAAJI_LOGO}" alt=""><span class="brand-txt">Vhaaji<small>rodičovská appka</small></span></div>`+SECTIONS.map(s=>`<button class="ditem ${section===s[0]?'on':''}" onclick="go('${s[0]}')"><span class="ic">${s[2]}</span>${s[1]}</button>`).join('');
}
function renderHead(){
  const el=document.getElementById('kidsel');
  if(!PERCHILD.includes(section)||overlay){el.style.display='none';return;}
  el.style.display='block';
  const c=cur();
  let h=`<button class="kbtn" onclick="toggleKidMenu(event)">${avatar(c,24)}<span>${c.n}</span><span class="kcaret">▾</span></button>`;
  if(kidMenuOpen){h+=`<div class="kmenu">`+children.map((k,i)=>`<button class="kitem${i===ci?' on':''}" onclick="pickKid(${i})">${avatar(k,24)}<span>${k.n}</span>${i===ci?'<span class="kchk">✓</span>':''}</button>`).join('')+`</div>`;}
  el.innerHTML=h;
}
function render(){
  document.getElementById('ttl').textContent=overlay?(overlay.type==='guide'?'Průvodce':overlay.type==='fond'?'Kulturní fond':overlay.type==='menu'?'Jídelníček':overlay.type==='omluvenka'?'Omluvenka':'Akce'):TITLES[section];
  renderHead();renderDrawer();
  document.getElementById('modalRoot').innerHTML = (typeof absModal!=='undefined'&&absModal)?renderAbsModal():'';
  document.getElementById('content').innerHTML = overlay?(overlay.type==='guide'?renderGuide(overlay.idx):overlay.type==='fond'?renderFond():overlay.type==='menu'?renderMenuDetail():overlay.type==='omluvenka'?renderOmluvenka():renderAkceDetail(overlay.idx)):RENDER[section]();
}
window.go=s=>{section=s;overlay=null;drawerOpen=false;if(!PERCHILD.includes(s)){} render();};
window.openDrawer=()=>{drawerOpen=true;render();};
window.toggleKidMenu=e=>{e.stopPropagation();kidMenuOpen=!kidMenuOpen;render();};
window.pickKid=i=>{ci=i;kidMenuOpen=false;render();};
window.closeDrawer=()=>{drawerOpen=false;render();};
document.addEventListener('click',()=>{if(kidMenuOpen){kidMenuOpen=false;render();}});

render();
</script>
</body>
