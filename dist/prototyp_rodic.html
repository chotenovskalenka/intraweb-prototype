<style>
/* Design tokens — sémantická vrstva. Hodnoty odvozené z vhaaji.cz (fáze 4.2, redesign).
   Viz docs/design-system.md. Komponenty čerpají z tokenů, nikdy natvrdo. */
:root{
  /* Povrchy / text */
  --color-bg:#EFEEE9;
  --color-surface:#F9F7F1;
  --color-surface-2:#E7E4DA;
  --color-text:#1F2A2E;
  --color-text-muted:#5C6560;
  --color-text-hint:#767B74;
  /* Značkové barvy */
  --color-primary:#2B7059;
  --color-primary-strong:#1F5344;
  --color-accent:#C8BC85;          /* okrová — výplň (tmavý text) */
  --color-accent-ink:#6F5F1C;      /* okrová jako text (AA na světlé) */
  --color-accent-soft:#C99C93;     /* tlumená růžová — dekor */
  --color-info:#496D7E;
  --color-on-primary:#F4EEDF;      /* text/prvky na primární ploše */
  /* Ohraničení / stavy */
  --color-border:rgba(31,42,46,.10);
  --color-border-strong:rgba(31,42,46,.16);
  --color-danger:#B0492F;
  --color-success:#387349;
  /* UI tinty (směr whitespace + barva) — světlé kategorie/stavy */
  --tint-green:#E3EDE7;
  --tint-rose:#F1E1DC;
  --tint-ochre:#F1EAD2;
  --tint-blue:#DEE7EA;
  /* Placeholdery fotek (galerie, úvodní fotky novinek) — v ostré verzi je nahradí reálné snímky.
     Tlumené odstíny z akvarelové palety, aby prototyp nepůsobil jako rozbitý obrázek. */
  --photo-1:#E3D9C6;
  --photo-2:#DCE3D6;
  --photo-3:#D8E0E4;
  --photo-4:#E8DCD2;
  --photo-5:#E7E0CE;
  /* Stavová paleta — jeden vizuální jazyk stavů napříč appkami (badge/chip/CODES).
     Každý stav má -ink (text) a -bg (světlá výplň). */
  --state-ok-ink:var(--color-success);       --state-ok-bg:rgba(56,115,73,.11);
  --state-info-ink:var(--color-info);        --state-info-bg:rgba(73,109,126,.10);
  --state-warn-ink:var(--color-accent-ink);  --state-warn-bg:rgba(200,188,133,.22);
  --state-danger-ink:var(--color-danger);    --state-danger-bg:rgba(176,73,47,.08);
  --state-neutral-ink:var(--color-text-muted);--state-neutral-bg:rgba(92,101,96,.14);
  --state-muted-ink:var(--color-text-hint);  --state-muted-bg:rgba(31,42,46,.07);
  --state-brand-ink:var(--color-primary);    --state-brand-bg:rgba(43,112,89,.12);
  --radius-md:14px;
  /* Typografie — nadpisy Bricolage Grotesque, tělo/UI Inter (univerzální pro všechny 4 školky).
     Token --font-serif drží nadpisový font (historický název; hodnota je bezpatková). */
  --font-serif:"Bricolage Grotesque",system-ui,sans-serif;
  --font-sans:"Inter",system-ui,sans-serif;
  /* spacing škála — aktivace v komponentách proběhne ve 4.3 */
  --space-xs:4px;
  --space-sm:8px;
  --space-md:12px;
  --space-lg:16px;
}
</style>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--color-bg);font-family:var(--font-sans);color:var(--color-text);-webkit-font-smoothing:antialiased;min-height:100vh;line-height:1.5}

/* Přístupnost: viditelný focus jen při klávesové navigaci (ne po kliknutí myší).
   Hlavně pro desktop/admin. */
:focus{outline:none}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,[tabindex]:focus-visible{
  outline:2px solid var(--color-primary);outline-offset:2px;border-radius:6px}

/* Přístupnost: respektuj systémové omezení pohybu (nevolnost z animací). */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;
    transition-duration:.01ms!important;scroll-behavior:auto!important}
}
</style>
<style>
.phone{width:100%;background:var(--color-bg)}
.screen{background:var(--color-bg);min-height:100vh}.scroll{padding:14px 16px 30px}
.topbar{display:flex;align-items:center;gap:12px;margin-bottom:13px}
.burger{min-width:44px;min-height:44px;display:inline-flex;align-items:center;justify-content:center;border:none;background:none;font-size:21px;line-height:1;color:var(--color-primary-strong);cursor:pointer;padding:2px 4px;margin-left:-8px}
.ttl{font-family:var(--font-serif);font-size:19px;color:var(--color-primary-strong);flex:1}
.role{font-size:11.5px;font-weight:500;color:var(--color-primary);background:rgba(43,112,89,.10);border:1px solid rgba(43,112,89,.18);padding:5px 10px;border-radius:999px;white-space:nowrap}
.scrim{position:fixed;inset:0;background:rgba(31,42,46,.42);z-index:5;display:none}.scrim.on{display:block}
.drawer{position:fixed;top:0;left:0;bottom:0;width:76%;max-width:300px;background:var(--color-surface);z-index:6;transform:translateX(-101%);transition:.22s;padding:20px 0 14px;box-shadow:6px 0 28px rgba(0,0,0,.16);overflow-y:auto}
.drawer.on{transform:none}
.dh{display:flex;align-items:center;gap:10px;font-family:var(--font-serif);font-size:17px;font-weight:700;color:var(--color-primary-strong);padding:0 20px 14px;border-bottom:1px solid var(--color-border);margin-bottom:8px}
.dh .brand-mark{width:32px;height:32px;flex:none;object-fit:contain}
.dh small{display:block;font-family:var(--font-sans);font-size:11.5px;color:var(--color-text-muted);font-weight:400}
.ditem{display:flex;align-items:center;gap:11px;min-height:44px;padding:12px 20px;font-size:15px;color:var(--color-text);cursor:pointer;border:none;background:none;width:100%;text-align:left;font-family:var(--font-sans)}
.ditem.on{background:rgba(43,112,89,.10);color:var(--color-primary);font-weight:600}
.ditem .ic{width:18px;text-align:center;opacity:.7}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--color-primary-strong);color:var(--color-on-primary);font-size:14px;font-weight:600;padding:11px 20px;border-radius:999px;opacity:0;pointer-events:none;transition:.22s;z-index:40;box-shadow:0 6px 20px rgba(0,0,0,.22)}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* Desktop (≥900px): responzivní shell — trvalý levý sidebar + obsah, který plyne
   do více sloupců (masonry). Full-width prvky (hero, akce, hlavičky sekcí, řádky
   docházky) jdou přes celou šířku. Na mobilu (<900px) zůstává drawer + jeden sloupec.
   Admin má vlastní layout-admin.css a tímto není dotčen. */
@media (min-width:900px){
  .screen{display:flex;align-items:flex-start}
  /* drawer = trvalý sidebar v toku (ne fixed overlay) */
  .drawer{position:sticky;top:0;left:auto;bottom:auto;transform:none;width:250px;max-width:250px;
    flex:none;height:100vh;border-radius:0;box-shadow:none;border-right:1px solid var(--color-border);z-index:1;padding:24px 0 16px}
  .scrim{display:none!important}
  .burger{display:none}
  .scroll{flex:1;min-width:0;max-width:1060px;margin:0 auto;padding:26px 36px 48px}
  .topbar{margin-bottom:20px}
  /* obsah do dvou vyvážených sloupců (fokus, ne rozsyp) */
  #content{column-count:2;column-gap:24px}
  #content > *{break-inside:avoid;margin-bottom:20px}
  /* karty na desktopu dostanou jemný stín pro definici (na krémovém pozadí jinak splývají) */
  #content > .tile,#content > .newsitem,#content > .newsbox,.dash3 .tile{box-shadow:0 1px 3px rgba(31,42,46,.06)}

/* === brand blok === */
/* rodič + průvodce: .drawer .dh */
.drawer{padding-top:0}
.drawer .dh{
  background:linear-gradient(rgba(239,238,233,.48),rgba(239,238,233,.7)),var(--wc-brand) center/cover no-repeat;
  padding:18px 20px;border-bottom:none;margin-bottom:10px;
}
.drawer .brand-mark{width:56px;height:56px}
.drawer .brand-txt{color:#141414;font-size:24px;font-weight:800;line-height:1.05}
/* admin: .sidebar .sb-brand */
.sidebar{padding-top:0}
.sidebar .sb-brand{
  background:linear-gradient(rgba(239,238,233,.48),rgba(239,238,233,.7)),var(--wc-brand) center/cover no-repeat;
  padding:18px 22px;border-bottom:none;margin-bottom:10px;
}
.sidebar .brand-mark{width:56px;height:56px}
.sidebar .brand-txt{color:#141414;font-size:24px;font-weight:800;line-height:1.05}

/* === jemný wash u patičky (odspoda nahoru) === */
/* rodič + průvodce */
.scroll{position:relative}
.scroll::after{content:"";position:absolute;left:0;right:0;bottom:0;height:210px;

function avHash(s){let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0;return h;}
function avatar(c,size){
  // profilová fotka podle jména (PHOTOS z photos.js — jen mobilní appky); jinak generovaný SVG
  var ph=(typeof PHOTOS!=='undefined')&&c&&PHOTOS[c.photo||c.n];
  if(ph)return '<span class="av" style="width:'+size+'px;height:'+size+'px"><img src="'+ph+'" alt=""></span>';
  var SKIN=['#F2C9A0','#E8B07D','#C98A5E','#A56A40','#8A5A3B','#F5D6B8'],HAIR=['#3B2A20','#6B4423','#A6702E','#1F1B17','#C9A24B','#7A4A2A'],BG=['#E7E4DA','#E3EDE7','#F1EAD2','#DEE7EA','#F1E1DC'];
  var h=avHash(c.n+(c.sur||'')),skin=SKIN[h%6],hair=HAIR[(h>>3)%6],bg=BG[(h>>6)%5],st=h%4;
  var hcy=[53,50,54,56][st],hr=[30,31,30,29][st],bun=st===2?'<circle cx="50" cy="26" r="7" fill="'+hair+'"/>':'';
  var svg='<svg viewBox="0 0 100 100" width="100%" height="100%" preserveAspectRatio="xMidYMid slice"><rect width="100" height="100" fill="'+bg+'"/>'+bun+'<circle cx="50" cy="'+hcy+'" r="'+hr+'" fill="'+hair+'"/><circle cx="50" cy="62" r="24" fill="'+skin+'"/><circle cx="42" cy="60" r="2.6" fill="#3a2f28"/><circle cx="58" cy="60" r="2.6" fill="#3a2f28"/><path d="M43 69 Q50 75 57 69" stroke="#3a2f28" stroke-width="2.4" fill="none" stroke-linecap="round"/></svg>';
  return '<span class="av" style="width:'+size+'px;height:'+size+'px">'+svg+'</span>';
}
function renderKeepFocus(){const a=document.activeElement;const pos=a&&a.selectionStart;render();const inp=document.querySelector('#content .search');if(inp){inp.focus();try{inp.setSelectionRange(pos,pos);}catch(e){}}}
function showToast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');clearTimeout(window._tt);window._tt=setTimeout(()=>t.classList.remove('on'),1500);}

/* Patičkový SOS modal (nahlášení chyby na IS) — statické markup v *.html, přepínané přes .on */
window.openSos=()=>{const s=document.getElementById('sosScrim');if(s)s.classList.add('on');};
window.closeSos=()=>{const s=document.getElementById('sosScrim');if(s)s.classList.remove('on');};

/* Lightbox (zvětšení + stažení obrázku, např. plakát tématického plánu) — statický #lbScrim */
window.openLightbox=(src,name)=>{const s=document.getElementById('lbScrim');if(!s)return;
  s.querySelector('#lbImg').src=src;const d=s.querySelector('#lbDl');d.href=src;d.download=name||'obrazek.jpg';s.classList.add('on');};
window.closeLightbox=()=>{const s=document.getElementById('lbScrim');if(s)s.classList.remove('on');};
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeSos();closeLightbox();}});

/* --- Stažení souboru vygenerovaného v prohlížeči (demo dokumenty a faktury) --- */
function downloadBlob(name,data,mime){
  const b=new Blob([data],{type:mime}),u=URL.createObjectURL(b),a=document.createElement('a');
  a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(u),1500);
}
const dlName=t=>t.replace(/[\/\\:*?"<>|]/g,'-');
// text pro PDF stream musí být čisté ASCII — Helvetica nezná diakritiku a hlavně:
// byte-offsety v xref se počítají z délky řetězce, takže vícebajtový znak by je rozhodil.
const pdfAscii=s=>(s||'').replace(/[    ]/g,' ').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^\x20-\x7e]/g,'-').replace(/[()\\]/g,' ');
function makePDF(title,lines){
  const body=[[title,22]].concat((lines||['Demo dokument - Lesni skolka Vhaaji']).map(l=>[l,12]));
  let stream='BT 60 780 Td';
  body.forEach(([txt,sz],i)=>{stream+=` /F1 ${sz} Tf${i?' 0 -28 Td':''} (${pdfAscii(txt)}) Tj`;});
  stream+=' ET';
  const objs=[
    '<</Type/Catalog/Pages 2 0 R>>',
    '<</Type/Pages/Kids[3 0 R]/Count 1>>',
    '<</Type/Page/Parent 2 0 R/MediaBox[0 0 595 842]/Resources<</Font<</F1 5 0 R>>>>/Contents 4 0 R>>',
    `<</Length ${stream.length}>>\nstream\n${stream}\nendstream`,
    '<</Type/Font/Subtype/Type1/BaseFont/Helvetica>>',
  ];
  let pdf='%PDF-1.4\n';const off=[];
  objs.forEach((o,i)=>{off.push(pdf.length);pdf+=`${i+1} 0 obj\n${o}\nendobj\n`;});
  const xref=pdf.length;
  pdf+=`xref\n0 ${objs.length+1}\n0000000000 65535 f \n`;
  off.forEach(o=>{pdf+=String(o).padStart(10,'0')+' 00000 n \n';});
  pdf+=`trailer\n<</Size ${objs.length+1}/Root 1 0 R>>\nstartxref\n${xref}\n%%EOF`;
  return pdf;
}

<script>

function renderDashboard(){

  let h='';

    const lbl=unpaid.length===1?`Faktura po splatnosti · ${unpaid[0].obdobi}`:`${unpaid.length} ${unpaid.length<5?'faktury':'faktur'} po splatnosti`;

  }

  h+=`<div class="dcol"><div class="tile"><div class="ch">Docházka</div>`;

  if(!absent){const us=guides.find(g=>g.uspava);
    h+=`<div class="doch-sleep">${c.spi?`☾ Spinká${us?` · uspává <b>${us.n}</b>`:''}`:'Nespinká'}</div>`;}
  if(c.notes[dashDay])h+=`<div class="doch-pozn">Poznámka: ${escTa(c.notes[dashDay])}</div>`;
  if(c.obed&&c.obed[dashDay]!==undefined&&absent)h+=`<div class="doch-sleep">Oběd: ${c.obed[dashDay]?'vyzvednete si':'propadá'}</div>`;
  if(today&&td!=='NE')h+=`<button class="omluvbtn" onclick="openAbsDnes()">Nahlásit dnešní absenci</button>`;

  else if(!today&&!editable(dashDay))h+=`<div class="edlock">Proběhlý den — jen ke čtení</div>`;

  h+=`<button class="cardlink" onclick="go('dochazka')">Docházka a náhrady ›</button></div>`;
  h+=`<div class="tile"><div class="ch">Průvodci dnes</div><div class="glist">`+GUIDES_TODAY.map(i=>{const g=guides[i];return `<button class="grow" onclick="go('kontakty')">${avatar(g,30)}<span class="grow-n">${g.n}${g.uspava?' <span class="moon">☾</span>':''}</span><span class="grow-h">${g.h||''}</span></button>`;}).join('')+`</div>`;

  h+=`</div>`;
  // Aktuality školky — sloupec 1, pod Průvodci (na desktopu pod nimi; na mobilu ve stohu hned za Průvodci)
  {const nws=NEWS.filter(n=>TODAY<=n.until).slice(0,5);
   if(nws.length){h+=`<div class="tile newsbox"><div class="ch"><button class="tlabbtn" onclick="go('aktuality')">Novinky ze školky<span class="tarr">›</span></button></div>`;
     nws.forEach(n=>{h+=`<button class="newsrow" onclick="go('aktuality')"><span class="newsdate">${n.date}</span><span class="newsline">${n.t}</span><span class="newsarr">›</span></button>`;});
     h+=`<button class="newsmore" onclick="go('aktuality')">Všechny novinky ›</button></div>`;}}
  h+=`</div>`;
  // 3) Sloupec 2 — dnešek: program, jídlo, básnička+písnička
  h+=`<div class="dcol">`;

  if(ev){h+=`<div class="ev"><div class="evt">${ev.title}</div><div class="evd">Sraz: <b>${ev.place}</b> · ${ev.time}</div><div class="evd">${ev.note}</div>`;
    if(ev.map)h+=`<a class="maplink" href="${ev.map}" target="_blank" rel="noopener">Otevřít mapu</a>`;
    if(ev.gps)h+=`<div class="gps">${ev.gps}</div>`;if(ev.sbalit)h+=`<div class="sbalit">🎒 Nezapomeňte sbalit: <b>${ev.sbalit}</b></div>`;h+=`</div>`;}
  h+=`</div>`;
  h+=`<div class="tile"><div class="ch">Co bude ${c.n} jíst</div>`+menu.map(it=>`<div class="mrow"><span class="mk2">${it[0]}</span><span class="mv">${it[1]}</span>${it[2]?`<span class="alerg">${it[2]}</span>`:''}</div>`).join('')+`</div>`;
  h+=`<div class="tile"><div class="ch">Básnička a písnička týdne</div>

  h+=`</div>`;
  // 4) Sloupec 3 — výhled: měsíční program (bez narozenin) + aktuality školky
  h+=`<div class="dcol">`;
  {const rows=[];Object.keys(EVMAP).map(Number).sort((a,b)=>a-b).forEach(d=>{EVMAP[d].forEach(e=>{if(e.type!=='naro')rows.push([d,e.t]);});});
   // řádek: datum · čas · název aktuality (čas se odděluje z názvu, pokud v něm je „ · HH:MM")
   h+=`<div class="tile"><div class="ch"><button class="tlabbtn" onclick="go('kalendar')">Měsíční program<span class="tarr">›</span></button></div>`
     +rows.map(([d,t])=>{const m=t.match(/^(.*?) · (\d{1,2}:\d{2})$/);const nm=m?m[1]:t,tm=m?m[2]:'';return `<button class="newsrow" onclick="go('kalendar')"><span class="newsdate">${d}. 6.</span><span class="newsline">${tm?`<b>${tm}</b> · `:''}${nm}</span><span class="newsarr">›</span></button>`;}).join('')+`</div>`;}
  h+=`</div></div>`;
  return h;
}
// Hlavička dashboardu v topbaru (na úrovni přepínače dětí): avatar + jméno/datum + listování ‹ ▾ ›.
function renderDashHead(){

    +(today?`<span class="dh-today">dnes</span>`:'')
    +(dashPickerOpen?renderDayPicker():'')+`</div>`;
}
// ▾ otevře kompaktní kalendář-dropdown pod šipkami (u datumového nadpisu).
function renderDayPicker(){
  // Šipky měsíců: prototyp má data jen pro červen 2026 → posun dá toast (stejně jako v Docházce).
  let h=`<div class="daypicker" onclick="event.stopPropagation()"><div class="dp-head"><button class="dp-nav" onclick="stepPickMonth(-1)" aria-label="Předchozí měsíc">‹</button><div class="dp-title">červen 2026</div><button class="dp-nav" onclick="stepPickMonth(1)" aria-label="Další měsíc">›</button></div><div class="dpcal">`;

}
window.stepDay=dir=>{let d=dashDay+dir;while(d>=1&&d<=30&&isWE(d))d+=dir;if(d>=1&&d<=30)dashDay=d;render();};

<script>
/* SCREEN: RODIC_AKTUALITY — Novinky ze školky.
   Seznam = karty s úvodní fotkou a proklikem na celou novinku (overlay detail
   s celým textem + fotkami). Rodič nevidí autora (jméno průvodce jen v průvodcovské appce).
   Desktop: mřížka karet (.news-grid), mobil: stoh. */
function novinkaExcerpt(n){const p=(n.full||n.t).split('\n')[0];return p.length>140?p.slice(0,140)+'…':p;}
function renderAktuality(){
  let h=`<div class="doch">`;
  h+=`<div class="news-grid">`;
  NEWS.filter(n=>TODAY<=n.until).forEach(n=>{
    h+=`<button class="newscard${n.urgent?' urgent':''}" onclick="openNovinka('${n.id}')">`;
    if(n.img)h+=`<div class="nc-hero" style="background:${n.img}">foto</div>`;
    h+=`<div class="nc-body">${n.urgent?'<span class="newsurg">Důležité</span>':''}<div class="nc-t">${n.t}</div>`;
    h+=`<div class="newsmeta" style="margin-top:3px">${n.date} · platí do ${n.until}. 6.</div>`;
    h+=`<div class="nc-x">${novinkaExcerpt(n)}</div>`;
    h+=`<div class="nc-foot">Celá novinka ›</div></div></button>`;
  });
  h+=`</div>`;
  h+=`<div class="note2">Novinky píší průvodci; důležité mohou zároveň sdílet do WhatsAppu. Po datu platnosti novinka ze seznamu zmizí.</div>`;
  return h+`</div>`;
}
// Detail novinky — overlay do #content jako „článek": omezená čtecí šířka, hero → titulek →
// datum → vlasová linka → text → fotky. Bez boxů (prostor a linky, ne rámečky).
function renderNovinka(){
  const n=NEWS.find(x=>x.id===overlay.id);if(!n)return '';
  let h=`<div class="novdet"><button class="back" onclick="closeOverlay()">← Zpět na novinky</button>`;
  if(n.img)h+=`<div class="nd-hero" style="background:${n.img}">foto</div>`;
  h+=`${n.urgent?'<span class="newsurg">Důležité</span>':''}`;
  h+=`<h1 class="nd-t">${n.t}</h1>`;
  h+=`<div class="newsmeta" style="margin-top:4px">${n.date} · platí do ${n.until}. 6.</div>`;
  h+=`<div class="nd-body">`+(n.full||'').split('\n\n').map(p=>`<p class="nd-p">${p}</p>`).join('')+`</div>`;
  if(n.imgs&&n.imgs.length)h+=`<div class="nd-gal"><div class="ch">Fotky</div><div class="gal">`+n.imgs.map(c=>`<div class="ph" style="background:${c}">foto</div>`).join('')+`</div></div>`;
  return h+`</div>`;
}
window.openNovinka=id=>{overlay={type:'novinka',id};render();};

function renderDen(){const c=cur();return `<div class="vhead">Denní přehled</div><button class="daycard daycard-btn" onclick="pick(${TODAY})"><div class="dt"><span class="wd">Středa 3. června</span>${chip(code(c,TODAY))}</div><div class="dm-open">Upravit docházku / omluvit ›</div></button>`;}

<script>
/* SCREEN: RODIC_PLATBY — faktury (filtr rok/stav, PDF, neuhrazené rovnou rozevřené s QR) + kulturní fond s QR.
   Desktop: vlevo faktury, vpravo kulturní fond. Faktury i fond jsou per dítě (data.js).
   Žádná samostatná karta „K úhradě" — QR se ukazuje přímo u neuhrazených faktur v seznamu. */
function fakeQR(seed,px){
  const n=25,m=px/n,f=[[0,0],[0,18],[18,0]];
  const inF=(r,c)=>f.some(p=>r>=p[0]&&r<p[0]+7&&c>=p[1]&&c<p[1]+7);
  let s=`<rect width="${px}" height="${px}" fill="#fff"/>`;
  f.forEach(p=>{const x=p[1]*m,y=p[0]*m;s+=`<rect x="${x}" y="${y}" width="${7*m}" height="${7*m}" fill="#111"/><rect x="${x+m}" y="${y+m}" width="${5*m}" height="${5*m}" fill="#fff"/><rect x="${x+2*m}" y="${y+2*m}" width="${3*m}" height="${3*m}" fill="#111"/>`;});
  let h=seed||1;
  for(let r=0;r<n;r++)for(let c=0;c<n;c++){if(inF(r,c))continue;h=(h*1103515245+12345)&0x7fffffff;if((h>>9)&1)s+=`<rect x="${c*m}" y="${r*m}" width="${m}" height="${m}" fill="#111"/>`;}
  return `<svg viewBox="0 0 ${px} ${px}" width="${px}" height="${px}">${s}</svg>`;
}
const faktCena=x=>x.cena-x.sleva;
const vsFmt=v=>String(v).replace(/(\d{4})(\d{2})(\d{2})/,'$1 $2 $3');
const fplural=n=>n===1?'neuhrazená faktura':(n>=2&&n<=4?'neuhrazené faktury':'neuhrazených faktur');

function renderPlatby(){
  const c=cur();
  const unpaid=c.faktury.filter(x=>!x.paid).sort((a,b)=>a.t-b.t);
  const dluh=unpaid.reduce((s,x)=>s+faktCena(x),0);
  const cerpano=fondCerpano(c), zb=c.fond.rocni-cerpano;
  const fondVS=`4920${String(ci+1).padStart(2,'0')}00`;

  let h=`<div class="doch"><div class="page-2col">`;

  /* --- Faktury: filtr rok + stav; neuhrazené rovnou rozevřené s QR --- */
  const roky=[...new Set(c.faktury.map(x=>x.rok))];          // newest-first (pořadí z generátoru)
  if(!roky.includes(faktRok))faktRok=roky[0];
  const list=c.faktury.filter(x=>x.rok===faktRok&&(faktStav==='vse'||(faktStav==='ne'?!x.paid:x.paid)));
  h+=`<div class="tile"><div class="ch">Faktury</div>`;
  if(unpaid.length)h+=`<div class="fakt-due">K úhradě: ${unpaid.length} ${fplural(unpaid.length)} · celkem <b>${kc(dluh)} Kč</b></div>`;
  h+=`<div class="fakt-filter"><select class="pf-in fakt-rok" onchange="setFaktRok(this.value)">${roky.map(r=>`<option${r===faktRok?' selected':''}>${r}</option>`).join('')}</select>`;
  h+=`<div class="filters">${[['vse','Vše',''],['ne','Neuhrazené','danger'],['ano','Uhrazené','']].map(([k,l,cls])=>`<button class="${cls}${faktStav===k?' on':''}" onclick="setFaktStav('${k}')">${l}</button>`).join('')}</div></div>`;
  if(list.length){
    h+=list.map(x=>{
      let r=`<div class="frow${x.paid?'':' frow-due'}"><div class="fL"><div class="fo">Školné · ${x.obdobi}</div><div class="fv">Vystaveno ${x.vystaveno}${x.paid?'':' · splatnost '+x.splatnost}</div></div><div class="fa">${kc(faktCena(x))} Kč</div><span class="ubadge ${x.paid?'ano':'ne'}">${x.paid?'Uhrazeno':'Neuhrazeno'}</span><button class="fbtn" onclick="downloadFaktura('${x.id}')">PDF ↓</button></div>`;
      if(!x.paid){

    ${c.fondlog.map(x=>`<div class="frow"><div class="fL"><div class="fo">${x[0]}</div><div class="fv">${x[1]}</div></div><div class="fa">${kc(x[2])} Kč</div></div>`).join('')}
    <div class="fondlab">Přispět do fondu</div>

    <div class="note2" style="margin-top:12px">Kulturní fond pokrývá divadla, výlety, výtvarný materiál apod. Odečítá se jen za akce, kterých se dítě účastní. Položky jsou demo.</div></div>`;

  return h+`</div></div>`;
}

<script>
/* SCREEN: RODIC_KALENDAR */
function renderKalendar(){
  const dim=daysInMonth(kalY,kalM), off=firstOffset(kalY,kalM), isJune=(kalY===2026&&kalM===5);
  if(kalSel>dim)kalSel=1;
  // Desktop: mřížka vlevo, vybraný den vpravo (uvnitř bílého .gcalwrap — Google vzhled zůstává).
  let h=`<div class="doch"><div class="gcalwrap kal-wrap"><div class="kal-main">`;
  h+=`<div class="gcalnav"><div class="gstep"><button onclick="kalStep(-1,0)">‹</button><span class="gmo">${MONTHS[kalM]}</span><button onclick="kalStep(1,0)">›</button></div><div class="gstep"><button onclick="kalStep(0,-1)">‹</button><span class="gyr">${kalY}</span><button onclick="kalStep(0,1)">›</button></div></div>`;
  h+=`<div class="gcal">`;
  ['P','Ú','S','Č','P','S','N'].forEach(x=>h+=`<div class="gh">${x}</div>`);
  for(let i=0;i<off;i++)h+=`<div class="gcell gempty"></div>`;
  for(let d=1;d<=dim;d++){const evs=isJune?(EVMAP[d]||[]):[];
    const bars=evs.slice(0,3).map(e=>`<span class="gbar g-${e.type}"></span>`).join('');
    const we=wdLocal(kalY,kalM,d)>=5, today=isJune&&d===3;
    h+=`<div class="gcell${today?' gtoday':''}${d===kalSel?' gsel':''}${we?' gwe':''}" onclick="kalPick(${d})"><span class="gn">${d}</span><span class="gbars">${bars}</span></div>`;}
  h+=`</div></div><div class="kal-side">`;
  const sevs=isJune?(EVMAP[kalSel]||[]):[];
  h+=`<div class="gday">${DOW[wdLocal(kalY,kalM,kalSel)]} ${kalSel}. ${MONTHS[kalM]}</div>`;
  h+= sevs.length? sevs.map(e=>`<div class="gev"><span class="gvbar g-${e.type}"></span><span>${e.t}</span><span class="gevt">${TYPELAB[e.type]}</span></div>`).join('') : `<div class="gnone">Žádná událost.</div>`;
  h+=`</div></div><div class="note2">Sdílený Google Kalendář školky — akce, rozvrh, narozeniny a organizace školního roku. (Simulace; v ostré verzi napojený kalendář školky.)</div>`;
  return h+`</div>`;
}
window.kalPick=d=>{kalSel=d;render();};
window.kalStep=(dm,dy)=>{kalM+=dm;if(kalM>11){kalM=0;kalY++;}if(kalM<0){kalM=11;kalY--;}kalY+=dy;render();};

<script>
/* SCREEN: RODIC_PLAN — tématický plán: navigace po měsících (jen aktuální školní rok),
   plný obsah (plakát + písničky) má v prototypu jen červen; plakát lze zvětšit i stáhnout.

function renderPlan(){

  // stepper měsíců (Září 2025 → Červen 2026), plná šířka
  let h=`<div class="doch"><div class="dh-nav planstep"><button class="dh-step" onclick="stepPlan(-1)" ${planIdx<=0?'disabled':''} aria-label="Předchozí měsíc">‹</button><span class="dh-lbl">${cap} ${t.y}</span><button class="dh-step" onclick="stepPlan(1)" ${planIdx>=TEMA_MESICE.length-1?'disabled':''} aria-label="Další měsíc">›</button></div>`;
  h+=`<div class="page-2col"><div class="pcol">`;
  h+=`<div class="tile"><div class="ch">Téma měsíce · ${t.hodnota}</div>${t.full?`<div class="tval">${t.intro}</div>`:`<div class="note2" style="margin:0">Hodnota měsíce: <b>${t.hodnota}</b>.</div>`}</div>`;

  if(t.full){
    h+=`<div class="tile"><div class="ch">Písničky a básničky</div><div class="note2" style="margin:0 0 8px">Klepnutím na „Poslech" se přehraje na YouTube — můžete si je zazpívat i doma.</div>${PISNE_CERVEN.map(song).join('')}</div>`;
    h+=`</div><div class="pcol">`;
    h+=`<div class="tile"><div class="ch">Plán měsíce · nástěnka</div><div class="note2" style="margin:0 0 10px">Tak, jak ho průvodci vyrábějí a věší ve školce. Klepnutím plakát zvětšíte nebo stáhnete.</div>`+TEMA_POSTERS.map((p,i)=>`<button class="poster-btn" onclick="openPoster(${i})" aria-label="Zvětšit plakát"><img class="tema-poster" src="${p}" alt="Tématický plán ${cap}" loading="lazy"><span class="poster-zoom">⤢</span></button>`).join('')+`</div>`;
  }else{
    h+=`</div><div class="pcol">`;
    h+=`<div class="tile"><div class="ch">Plán měsíce · nástěnka</div><div class="empty" style="margin:0">Plakát a písničky pro ${mName} ${t.y} nejsou v prototypu k dispozici — ukázku najdete na červnu.</div></div>`;
  }
  h+=`</div></div></div>`;
  return h;
}
window.stepPlan=d=>{planIdx=Math.max(0,Math.min(TEMA_MESICE.length-1,planIdx+d));render();};

<script>
/* SCREEN: RODIC_FOTKY — fotky žijí na Google Drive (mimo IS), sem se jen odkazuje.
   Jedno album = jeden časový úsek (nepravidelně týden až měsíc), FOTO_ALBA v data.js. Nejnovější první. */
function fmtAlbum(a){
  const [d1,m1,y1]=a.od,[d2,m2,y2]=a.do;
  if(m1===m2&&y1===y2)return `${d1}.–${d2}. ${m1}. ${y1}`;
  if(y1===y2)return `${d1}. ${m1}. – ${d2}. ${m2}. ${y1}`;
  return `${d1}. ${m1}. ${y1} – ${d2}. ${m2}. ${y2}`;
}
function renderFotky(){
  let h=`<div class="doch"><div class="tile">`;
  h+=FOTO_ALBA.map(a=>`<a class="doc doc-dl" href="${a.url}" target="_blank" rel="noopener"><span>${a.nazev}<span class="dt2"> · ${fmtAlbum(a)}</span></span><span class="drivelink">Otevřít na Drive ↗</span></a>`).join('');
  h+=`</div><div class="note2">Fotky ze školky jsou v albech na Google Drive. Alba zakládají průvodci; odkaz je viditelný pro všechny rodiče.</div>`;
  return h+`</div>`;
}

<script>
/* MODALS: RODIC — překryvné obrazovky (overlay) a jejich handlery.
   Kulturní fond už není overlay — vypisuje se rovnou na kartě v sekci Platby (viz platby.js). */
function renderMenuDetail(){

  }
  h+=`<div class="tile"><div class="tlab">Stravné</div><div class="np"><span>Dopolední svačina</span><b>20 Kč</b></div><div class="np"><span>Oběd</span><b>80 Kč</b></div><div class="np"><span>Odpolední svačina</span><b>15 Kč</b></div></div>`;
  h+=`<div class="note2">Alergeny jsou uvedené čísly dle přílohy vyhlášky. Jídelníček dodává Mamafood. Při omluvě do 20:00 předchozího dne se stravné nepočítá.</div>`;

}
function renderAkceDetail(i){const a=akce[i];
  return `<button class="back" onclick="closeOverlay()">← Zpět</button><div class="pname">${a.title}</div><div class="pfull">${a.date}</div>
   <div class="tile"><div class="np"><span>Kdy</span><b>${a.time}</b></div><div class="np"><span>Kde</span><b>${a.place}</b></div></div>
   <div class="tile"><div class="tlab">Info</div><div class="tval">${a.note}</div></div>`;

window.openAkce=i=>{overlay={type:'akce',idx:i};render();};
window.openMenu=()=>{overlay={type:'menu'};render();};
window.closeOverlay=()=>{overlay=null;render();};

/* --- OMLUVENKA (Flow 2) --- overlay řízený stavem omDraft */
let omDraft=null;
const omDays=()=>{const a=[];for(let d=omDraft.od;d<=omDraft.do;d++)if(!isWE(d))a.push(d);return a;};
function omGrid(which){
  let h=`<div class="dpcal">`;['P','Ú','S','Č','P','S','N'].forEach(x=>h+=`<div class="dph">${x}</div>`);
  for(let d=1;d<=30;d++){
    if(isWE(d)||d<=NOW.d){h+=`<div class="dpcell we">${d}</div>`;continue;}
    const sel=omDraft[which]===d, rng=d>=omDraft.od&&d<=omDraft.do;
    h+=`<div class="dpcell${sel?' sel':rng?' rng':''}${d===TODAY?' today':''}" onclick="omPick('${which}',${d})">${d}</div>`;
  }
  return h+`</div>`;
}
function omDeadline(){
  const days=omDays(), timely=days.filter(beforeDeadline), late=days.filter(d=>!beforeDeadline(d));
  let h=`<div class="tile note-info"><div class="tlab" style="color:var(--color-primary);margin-bottom:5px">Než odešleš</div>`;
  h+=`<div class="omdrow">Omluvit lze do <b>20:00 předchozího dne</b>.</div>`;
  if(timely.length)h+=`<div class="omdrow ok">✓ Vznikne <b>${timely.length} ${nplural(timely.length)}</b> (za ${timely.length} včas omluvený ${plural(timely.length)}).</div>`;
  if(late.length)h+=`<div class="omdrow bad">⚠ Omluva na ${late.map(d=>d+'. 6.').join(', ')} je po deadlinu — <b>náhrada nevznikne</b>. Dítě je omluvené.</div>`;
  return h+`</div>`;
}
function renderOmluvenka(){
  const c=cur();
  let h=`<button class="back" onclick="closeOverlay()">← Zpět</button><div class="pname">Omluvit ${c.ak}</div>`;
  if(omDraft.step==='done')return h+renderOmluvenkaDone(c);
  h+=`<div class="pfull">Vyberte dny, kdy ${c.n} nebude ve školce</div>`;
  h+=`<div class="tile"><div class="tlab">Od</div>${omGrid('od')}</div>`;
  h+=`<div class="tile"><div class="tlab">Do</div>${omGrid('do')}</div>`;
  h+=`<div class="tile"><div class="tlab">Důvod</div><div class="pchips">`+[['nemoc','Nemoc'],['rodinné důvody','Rodinné důvody'],['jiné','Jiné']].map(([k,l])=>`<button class="${omDraft.duvod===k?'on':''}" onclick="omReason('${k}')">${l}</button>`).join('')+`</div>`;
  h+=`<textarea class="note" placeholder="Poznámka pro průvodce (nepovinné)" oninput="omNote(this.value)">${escTa(omDraft.pozn)}</textarea></div>`;
  h+=omDeadline();
  h+=`<button class="omluvbtn" onclick="omSubmit()">Odeslat omluvenku</button>`;
  return h;
}
function renderOmluvenkaDone(c){
  const r=omDraft.result;
  let h=`<div class="tile omdone"><div class="omcheck">✓</div><div class="omdt">Omluvenka odeslána</div><div class="omsub">${c.n} · ${fmtRange(omDraft.od,omDraft.do)} · ${DUVODLAB[omDraft.duvod]}</div>`;
  if(r.timely)h+=`<div class="omres ok">Vznikl${r.timely===1?'a':'y'} <b>${r.timely} ${nplural(r.timely)}</b> — najdeš ${r.timely===1?'ji':'je'} níže v Docházce a náhradách.</div>`;
  if(r.late)h+=`<div class="omres bad">Za ${r.late} ${plural(r.late)} po deadlinu <b>náhrada nevznikla</b>.</div>`;
  h+=`<div class="omnext">Průvodci teď vidí, že ${c.n} nebude ve školce. ${r.timely?'Včas omluvené dny jsme označili jako omluvené (OM).':''}${r.late?' Dny po deadlinu jsou neomluvené (NE).':''}</div></div>`;
  h+=`<button class="omluvbtn" onclick="go('dochazka')">Zobrazit náhrady</button>`;
  h+=`<button class="omdonebtn" onclick="closeOverlay()">Hotovo</button>`;
  return h;
}
/* Volitelný prefill dne (z dashboardu: dnešek = pozdní omluva, budoucí den = včasná).
   Bez argumentu (sekce Docházka) předvyplní nejbližší omluvitelný den. */
window.openOmluvenka=day=>{let t;if(day>NOW.d&&day<=30&&!isWE(day)){t=day;}else{t=NOW.d+1;while(t<=30&&isWE(t))t++;}omDraft={od:t,do:t,duvod:'nemoc',pozn:'',step:'form',result:null};overlay={type:'omluvenka'};render();};
window.omPick=(which,d)=>{omDraft[which]=d;if(which==='od'&&omDraft.do<d)omDraft.do=d;if(which==='do'&&d<omDraft.od)omDraft.od=d;render();};
window.omReason=k=>{omDraft.duvod=k;render();};
window.omNote=v=>{omDraft.pozn=v;};
window.omSubmit=()=>{
  const c=cur(), days=omDays(); if(!days.length)return;
  const timely=days.filter(beforeDeadline), late=days.filter(d=>!beforeDeadline(d));
  const om={id:uid(),od:omDraft.od,do:omDraft.do,duvod:omDraft.duvod,pozn:omDraft.pozn,
    stav:beforeDeadline(omDraft.od)?'vcas':'po-deadlinu',nahradaIds:[]};
  timely.forEach(d=>{c.att[d]='OM';});late.forEach(d=>{c.att[d]='NE';});
  days.forEach(d=>{if(omDraft.pozn)c.notes[d]=omDraft.pozn;});
  timely.forEach(d=>{const n=nahFrom(juneDate(d),'dostupna',{den:d,omId:om.id});c.nahrady.push(n);om.nahradaIds.push(n.id);});
  late.forEach(d=>{const n=nahFrom(juneDate(d),'nevznikla',{den:d,omId:om.id,exp:'—',expT:Infinity});c.nahrady.push(n);om.nahradaIds.push(n.id);});
  c.omluvenky.unshift(om);
  omDraft.step='done';omDraft.result={timely:timely.length,late:late.length};
  render();
};
window.omCancel=id=>{
  const c=cur(), om=c.omluvenky.find(o=>o.id===id); if(!om)return;
  om.stav='zrusena';
  for(let d=om.od;d<=om.do;d++){if(c.att[d]==='OM')delete c.att[d];}
  c.nahrady=c.nahrady.filter(n=>!(om.nahradaIds||[]).includes(n.id));
  render();showToast('Omluvenka zrušena, náhrady odečteny');
};

/* --- Modal: Nahlásit dnešní absenci (po deadlinu → neomluveno, bez náhrady) --- */
let absModal=null;
window.openAbsDnes=()=>{absModal={obed:null,pozn:''};render();};
window.absObed=v=>{absModal.obed=v;render();};
window.absPozn=v=>{absModal.pozn=v;};
window.absClose=()=>{absModal=null;render();};
window.absSubmit=()=>{
  const c=cur();
  c.att[TODAY]='NE'; if(absModal.pozn)c.notes[TODAY]=absModal.pozn;
  c.obed=c.obed||{}; c.obed[TODAY]=absModal.obed===true;
  const om={id:uid(),od:TODAY,do:TODAY,duvod:'jiné',pozn:absModal.pozn,stav:'po-deadlinu',nahradaIds:[]};
  const n=nahFrom(juneDate(TODAY),'nevznikla',{den:TODAY,omId:om.id,exp:'—',expT:Infinity});
  c.nahrady.push(n); om.nahradaIds.push(n.id); c.omluvenky.unshift(om);
  absModal=null; showToast('Absence nahlášena'); render();
};
function renderAbsModal(){
  const c=cur(), menu=MENUS[wd(TODAY)];
  const obedy=menu.filter(it=>/pol|hlavn/i.test(it[0]));
  let h=`<div class="modal-scrim" onclick="absClose()"><div class="modal" onclick="event.stopPropagation()">`;
  h+=`<h3>Nahlásit dnešní absenci</h3><div class="abs-sub">${c.n} · středa 3. 6.</div>`;
  h+=`<div class="abs-warn">⚠ Je po deadlinu (20:00 včera). Den bude <b>neomluvený</b> a náhrada nevznikne.</div>`;
  h+=`<div class="notelab">Důvod absence — nepovinné</div><textarea class="note" placeholder="např. nemoc, rodinný důvod…" oninput="absPozn(this.value)">${escTa(absModal.pozn)}</textarea>`;
  h+=`<div class="notelab">Vyzvednete si oběd?</div>`;
  h+=`<div class="abs-menu">`+obedy.map(it=>`<div class="mrow"><span class="mk2">${it[0]}</span><span class="mv">${it[1]}</span></div>`).join('')+`</div>`;
  h+=`<div class="choices"><button class="${absModal.obed===true?'on':''}" onclick="absObed(true)">Ano, vyzvedneme</button><button class="${absModal.obed===false?'on':''}" onclick="absObed(false)">Ne</button></div>`;
  h+=`<div class="abs-hint">Nevyzvednutý oběd propadá.</div>`;
  h+=`<div class="mbtns"><button class="btn-ghost" onclick="absClose()">Zrušit</button><button class="omluvbtn danger" style="margin:0" onclick="absSubmit()">Nahlásit neomluvenou absenci</button></div>`;
  return h+`</div></div>`;
}
</script>
<script>
/* CORE: RODIC — stav, sekce, drawer/hlavička, render(), go(), toast, úvodní spuštění */
const SECTIONS=[['prehled','Přehled','◆'],['aktuality','Novinky','▲'],['dochazka','Docházka a náhrady','✓'],['profil','Profil dítěte','☺'],['platby','Platby','₵'],
  ['kalendar','Kalendář','▦'],['plan','Tématický plán','✎'],['fotky','Fotky','▢'],['kontakty','Kontakty','✆']];
const TITLES=Object.fromEntries(SECTIONS.map(s=>[s[0],s[1]]));
const PERCHILD=['prehled','dochazka','profil','platby','fotky'];

let ci=0, section='prehled', view='tyden', sel=-1, bulk=false, selSet=new Set(), overlay=null, drawerOpen=false, dashDay=TODAY, kalSel=TODAY, weekStart=1;
let kalY=2026, kalM=5;
let kidMenuOpen=false;
let dashEdit=false;
let draft={};   // {den: {code, note}}
let dashPickerOpen=false;
let pfEdit=null;   // rozpracovaná editace profilu (overlay 'profedit')
let faktRok='2025/26', faktStav='vse';   // filtr faktur (rok/stav)
let planIdx=9;   // vybraný měsíc v tématickém plánu (index do TEMA_MESICE; 9 = červen)

const RENDER={prehled:renderDashboard,aktuality:renderAktuality,dochazka:renderDochazka,profil:renderProfil,platby:renderPlatby,kalendar:renderKalendar,plan:renderPlan,fotky:renderFotky,kontakty:renderKontakty};

function renderDrawer(){
  const d=document.getElementById('drawer');
  d.classList.toggle('on',drawerOpen);
  document.getElementById('scrim').classList.toggle('on',drawerOpen);
  d.innerHTML=`<div class="dh"><img class="brand-mark" src="${VHAAJI_LOGO}" alt=""><span class="brand-txt">IS Vhaaji</span></div>`+SECTIONS.map(s=>`<button class="ditem ${section===s[0]?'on':''}" onclick="go('${s[0]}')"><span class="ic">${icon(s[0])||s[2]}</span>${s[1]}</button>`).join('');
}
/* Nadpis sekce (H1) se renderuje do topbaru (v řádku s přepínačem dítěte), ne do obsahu. */
const PAGEH={dochazka:'Docházka a náhrady',platby:'Platby',kalendar:'Kalendář',plan:'Tématický plán',fotky:'Fotky',aktuality:'Novinky ze školky',kontakty:'Kontakty'};
function renderHead(){
  const dh=document.getElementById('dashhead');
  dh.innerHTML = overlay ? ''
    : section==='prehled' ? renderDashHead()
    : section==='profil'  ? `<h1 class="dh-t">Profil dítěte</h1><button class="dh-edit" onclick="openProfEdit()">Upravit údaje</button>`
    : `<h1 class="dh-t">${PAGEH[section]||''}</h1>`;
  const el=document.getElementById('kidsel');
  if(!PERCHILD.includes(section)||overlay){el.style.display='none';return;}
  el.style.display='block';
  const c=cur();
  let h=`<button class="kbtn" onclick="toggleKidMenu(event)">${avatar(c,24)}<span>${c.n}</span><span class="kcaret">▾</span></button>`;
  if(kidMenuOpen){h+=`<div class="kmenu">`+children.map((k,i)=>`<button class="kitem${i===ci?' on':''}" onclick="pickKid(${i})">${avatar(k,24)}<span>${k.n}</span>${i===ci?'<span class="kchk">✓</span>':''}</button>`).join('')+`</div>`;}
  el.innerHTML=h;
}
function render(){
  /* Každá sekce má vlastní velký nadpis (h1.dh-t) → v topbaru ho neopakujeme.
     Titulek zůstává jen u overlayů, které vlastní nadpis nemají. */
  document.getElementById('ttl').textContent=overlay?(overlay.type==='menu'?'Jídelníček':overlay.type==='omluvenka'?'Omluvenka':overlay.type==='novinka'?'Novinka':overlay.type==='profedit'?'':'Akce'):'';
  renderHead();renderDrawer();
  document.getElementById('modalRoot').innerHTML = (typeof absModal!=='undefined'&&absModal)?renderAbsModal():((typeof dayModal!=='undefined'&&dayModal!=null)?renderDayModal():'');
  document.getElementById('content').innerHTML = overlay?(overlay.type==='menu'?renderMenuDetail():overlay.type==='omluvenka'?renderOmluvenka():overlay.type==='novinka'?renderNovinka():overlay.type==='profedit'?renderProfEdit():renderAkceDetail(overlay.idx)):RENDER[section]();
}
window.go=s=>{section=s;overlay=null;drawerOpen=false;if(!PERCHILD.includes(s)){} render();};
window.openDrawer=()=>{drawerOpen=true;render();};
window.toggleKidMenu=e=>{e.stopPropagation();kidMenuOpen=!kidMenuOpen;render();};
window.pickKid=i=>{ci=i;kidMenuOpen=false;render();};
window.closeDrawer=()=>{drawerOpen=false;render();};
document.addEventListener('click',()=>{if(kidMenuOpen||dashPickerOpen){kidMenuOpen=false;dashPickerOpen=false;render();}});

render();
</script>
</body>
</html>
