<style>
/* Design tokens — sémantická vrstva. Hodnoty odvozené z vhaaji.cz (fáze 4.2, redesign).
   Viz docs/design-system.md. Komponenty čerpají z tokenů, nikdy natvrdo. */
:root{
  /* Povrchy / text */
  --color-bg:#EFEEE9;
  --color-surface:#F9F7F1;
  --color-surface-2:#E7E4DA;
  --color-text:#1F2A2E;
  --color-text-muted:#5C6560;
  --color-text-hint:#767B74;
  /* Značkové barvy */
  --color-primary:#2B7059;
  --color-primary-strong:#1F5344;
  --color-accent:#C8BC85;          /* okrová — výplň (tmavý text) */
  --color-accent-ink:#6F5F1C;      /* okrová jako text (AA na světlé) */
  --color-accent-soft:#C99C93;     /* tlumená růžová — dekor */
  --color-info:#496D7E;
  --color-on-primary:#F4EEDF;      /* text/prvky na primární ploše */
  /* Ohraničení / stavy */
  --color-border:rgba(31,42,46,.10);
  --color-border-strong:rgba(31,42,46,.16);
  --color-danger:#B0492F;
  --color-success:#387349;
  /* UI tinty (směr whitespace + barva) — světlé kategorie/stavy */
  --tint-green:#E3EDE7;
  --tint-rose:#F1E1DC;
  --tint-ochre:#F1EAD2;
  --tint-blue:#DEE7EA;
  /* Stavová paleta — jeden vizuální jazyk stavů napříč appkami (badge/chip/CODES).
     Každý stav má -ink (text) a -bg (světlá výplň). */
  --state-ok-ink:var(--color-success);       --state-ok-bg:rgba(56,115,73,.13);
  --state-info-ink:var(--color-info);        --state-info-bg:rgba(73,109,126,.15);
  --state-warn-ink:var(--color-accent-ink);  --state-warn-bg:rgba(200,188,133,.22);
  --state-danger-ink:var(--color-danger);    --state-danger-bg:rgba(176,73,47,.12);
  --state-neutral-ink:var(--color-text-muted);--state-neutral-bg:rgba(92,101,96,.14);
  --state-muted-ink:var(--color-text-hint);  --state-muted-bg:rgba(31,42,46,.07);
  --state-brand-ink:var(--color-primary);    --state-brand-bg:rgba(43,112,89,.12);
  --radius-md:14px;
  /* Typografie — nadpisy Bricolage Grotesque, tělo/UI Inter (univerzální pro všechny 4 školky).
     Token --font-serif drží nadpisový font (historický název; hodnota je bezpatková). */
  --font-serif:"Bricolage Grotesque",system-ui,sans-serif;
  --font-sans:"Inter",system-ui,sans-serif;
  /* spacing škála — aktivace v komponentách proběhne ve 4.3 */
  --space-xs:4px;
  --space-sm:8px;
  --space-md:12px;
  --space-lg:16px;
}
</style>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--color-bg);font-family:var(--font-sans);color:var(--color-text);-webkit-font-smoothing:antialiased;min-height:100vh;line-height:1.5}

/* Přístupnost: viditelný focus jen při klávesové navigaci (ne po kliknutí myší).
   Hlavně pro desktop/admin. */
:focus{outline:none}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,[tabindex]:focus-visible{
  outline:2px solid var(--color-primary);outline-offset:2px;border-radius:6px}
</style>
<style>
/* LAYOUT: ADMIN — desktopový shell (stálý levý sidebar + obsah s max šířkou ~980 px).
   Skládá se ze stejných tokenů jako mobilní appky; mobil jen „nerozbité". */
.admin{display:flex;min-height:100vh;background:var(--color-bg)}
.sidebar{width:236px;flex-shrink:0;background:var(--color-bg);border-right:1px solid var(--color-border);padding:22px 0 16px;position:sticky;top:0;height:100vh;overflow-y:auto}
.sb-brand{display:flex;align-items:center;gap:11px;font-family:var(--font-serif);font-size:20px;font-weight:700;color:var(--color-primary-strong);padding:0 22px 10px;border-bottom:1px solid var(--color-border);margin-bottom:8px}
.sb-brand .brand-mark{width:36px;height:36px;flex:none;object-fit:contain}
.sb-brand small{display:block;font-family:var(--font-sans);font-size:11.5px;color:var(--color-text-muted);font-weight:400;margin-top:2px}
.sb-item{display:flex;align-items:center;gap:11px;padding:11px 22px;font-size:14.5px;color:var(--color-text);cursor:pointer;border:none;background:none;width:100%;text-align:left;font-family:var(--font-sans)}
.sb-item.on{background:rgba(43,112,89,.10);color:var(--color-primary);font-weight:600;box-shadow:inset 3px 0 0 var(--color-primary)}
.sb-item .ic{width:18px;text-align:center;opacity:.7}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar-a{display:flex;align-items:center;gap:12px;padding:18px 32px;border-bottom:1px solid var(--color-border)}
.ttl-a{font-family:var(--font-serif);font-size:22px;color:var(--color-primary-strong);flex:1}
.role-a{font-size:11.5px;font-weight:500;color:var(--color-primary);background:rgba(43,112,89,.10);border:1px solid rgba(43,112,89,.18);padding:5px 12px;border-radius:999px;white-space:nowrap}
.content-wrap{padding:24px 32px 48px}
.content-wrap #content{max-width:980px;margin:0 auto}

/* Mobil: shell se nerozbije — sidebar nahoře jako vodorovná lišta. */
@media(max-width:720px){
  .admin{flex-direction:column}
  .sidebar{width:auto;height:auto;position:static;border-right:none;border-bottom:1px solid var(--color-border);padding:12px 0}
  .sb-brand{padding:0 16px 8px}
  .sb-nav{display:flex;overflow-x:auto;scrollbar-width:none}
  .sb-nav::-webkit-scrollbar{display:none}
  .sb-item{display:inline-flex;width:auto;flex:0 0 auto;white-space:nowrap;padding:9px 14px}
  .sb-item.on{box-shadow:inset 0 -3px 0 var(--color-primary)}
  .topbar-a{padding:14px 16px}
  .content-wrap{padding:16px}
}
</style>
<style>
.tile{background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-md);padding:13px 15px;margin-bottom:11px}
.tlab{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--color-text-muted);margin-bottom:7px}
.tval{font-size:14.5px;color:var(--color-text);line-height:1.5}
.vhead{font-family:var(--font-serif);font-size:16px;color:var(--color-primary-strong);margin:4px 2px 9px}
.note2{font-size:12px;color:var(--color-text-hint);margin-top:10px;line-height:1.5}
.note-info{background:rgba(43,112,89,.06);border-color:rgba(43,112,89,.18);font-size:13.5px;color:var(--color-text);line-height:1.5}
.note-info b{color:var(--color-primary);font-weight:600}
.np{display:flex;justify-content:space-between;align-items:center;font-size:14px;padding:5px 0}.np b{font-weight:600}
.switch{display:flex;gap:6px;background:var(--color-surface-2);padding:var(--space-xs);border-radius:999px;margin-bottom:14px}
.switch button{flex:1;min-height:44px;border:none;background:transparent;font-family:var(--font-sans);font-size:13.5px;font-weight:500;color:var(--color-text-muted);padding:12px 4px;border-radius:999px;cursor:pointer}
.switch button.on{background:var(--color-primary);color:var(--color-on-primary)}
.selin{border:1px solid var(--color-border-strong);border-radius:8px;padding:6px 9px;font-family:var(--font-sans);font-size:13.5px;background:var(--color-surface);color:var(--color-text)}
.tabs{display:flex;gap:var(--space-sm);overflow-x:auto;padding:2px 0 4px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}

.rec-sk{margin-bottom:11px}
.rec-sk:last-child{margin-bottom:0}
.rec-nm{font-size:13.5px;font-weight:600;color:var(--color-primary-strong);margin-bottom:6px}
.rec-fam{font-weight:400;color:var(--color-text-muted);font-size:11.5px}
.ak-preview{margin-top:4px}
.ak-preview b{color:var(--color-primary)}
.ak-warn{font-size:13px;color:var(--color-danger);background:rgba(176,73,47,.08);border:1px solid rgba(176,73,47,.20);border-radius:10px;padding:10px 12px;line-height:1.45}
.btn-primary:disabled{opacity:.45;cursor:not-allowed}

/* porady — štítek chip */
.stitek{display:inline-block;font-size:11px;font-weight:500;color:var(--color-text-muted);background:var(--color-surface-2);border:1px solid var(--color-border);padding:2px 9px;border-radius:999px;margin:0 5px 5px 0}
.stitek.hi{color:var(--color-primary);background:rgba(43,112,89,.12);border-color:rgba(43,112,89,.22);font-weight:600}
.za-tags{margin-top:9px}

/* porady — seznam zápisů */
.za-item{display:block;width:100%;text-align:left;cursor:pointer;font-family:var(--font-sans)}
.za-sk{font-size:12.5px;color:var(--color-text-muted)}
.za-nz{font-family:var(--font-serif);font-size:16px;color:var(--color-primary-strong);margin-top:8px}
.za-nz-lg{font-size:20px}
.za-ucast{font-size:12.5px;color:var(--color-text-muted);margin-top:4px}

/* porady — detail odstavce */
.odst{border-top:1px solid var(--color-border);padding:13px 0}
.odst:first-of-type{border-top:none;margin-top:10px}
.odst-tx{font-size:14.5px;color:var(--color-text);line-height:1.55}
.odst-chips{margin-top:9px}
.odst-chips button{font-size:11.5px;padding:5px 10px}

/* porady — filtrovaný výpis */
.vypis-head{margin:2px 2px 12px}
.vh-t{font-family:var(--font-serif);font-size:18px;color:var(--color-primary-strong)}
.vh-s{font-size:12.5px;color:var(--color-text-muted);margin-top:2px}
.vy-item .vy-nz{font-family:var(--font-serif);font-size:14.5px;color:var(--color-primary);margin:6px 0 6px}
.vy-link{background:none;border:none;color:var(--color-primary);font-weight:600;font-size:12.5px;font-family:var(--font-sans);cursor:pointer;padding:8px 0 0}

.print-only{display:none}

@media(max-width:720px){
  .caps,.nh-grid{grid-template-columns:1fr}
}

/* tisk / PDF export výpisu — skryje shell a ovládací prvky, nechá jen obsah */
@media print{
  .sidebar,.topbar-a,.switch,.no-print,.toast{display:none!important}
  .print-only{display:block}
  .admin{display:block}
  .main{display:block}
  .content-wrap{padding:0}
  .content-wrap #content{max-width:100%}
  .tile{border-color:#ccc;box-shadow:none;break-inside:avoid}
  .vypis-head{margin-bottom:16px}
  body{background:#fff}
}
</style>
</head>
<body>
<div class="admin">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <div class="topbar-a"><span class="ttl-a" id="ttl">Přehled</span><span class="role-a">Vedení</span></div>
    <div class="content-wrap"><div id="content"></div></div>
  </div>
</div>
<div id="toast" class="toast"></div>

<script>
/* SCREEN: ADMIN_PREHLED — dashboard vedení (BRIEF kap. 1):
   kapacity školek, chybějící platby, systémová upozornění, souhrn náhrad,
   provozní úkoly, poslední porady/evaluace. */
function renderPrehled(){
  let h=`<div class="dash-head">${DOW[wd(TODAYD)]} ${TODAYD}. června 2026 · přehled všech školek</div>`;

  // (a) kapacity školek — obsazeno / kapacita, vizuální pruh; u jednoskupinové školky
  // se rozpis tříd neduplikuje
  h+=`<div class="tile"><div class="tlab">Kapacity školek</div><div class="caps">`;
  SKOLKY.forEach(s=>{
    const obs=obsazeno(s), pct=Math.round(obs/s.kapacita*100), full=obs>=s.kapacita;
    const tridy=s.tridy.length>1?s.tridy.map(t=>`${t.n} ${t.obs}/${t.kap}`).join(' · '):'';
    h+=`<div class="cap">`
      +`<div class="cap-top"><span class="cap-nm">${s.nazev}</span><span class="cap-n ${full?'is-full':''}">${obs}/${s.kapacita}${full?' · plno':''}</span></div>`
      +`<div class="cap-bar"><span class="cap-fill ${full?'is-full':''}" style="width:${pct}%"></span></div>`
      +(tridy?`<div class="cap-sub">${tridy}</div>`:'')
      +`</div>`;
  });
  h+=`</div></div>`;

  // (b) chybějící platby — kdo, částka, po splatnosti (badge stavů); řeší se mimo appku
  h+=`<div class="tile"><div class="tlab">Chybějící platby</div>`;
  PLATBY.forEach(p=>{
    const st=PLATBASTAVY[p.stav];
    const dodat=p.stav==='po-splatnosti'?`po splatnosti ${p.poDnu} dní`
      :p.stav==='castecne'?`uhrazeno ${kc(p.uhrazeno)} z ${kc(p.castka)} Kč`
      :p.stav==='ceka'?'platba přišla, čeká na spárování':`splatnost prošla před ${p.poDnu} dny`;
    h+=`<div class="pay-row"><div class="pay-main"><div class="pay-nm">${p.dite} <span class="pay-sk">· ${p.skolka}</span></div>`
      +`<div class="pay-sub">${p.obdobi} — ${dodat}</div></div>`
      +`<div class="pay-right"><span class="pay-amt">${kc(p.castka)} Kč</span><span class="bdg ${st.cls}">${st.lab}</span></div></div>`;
  });
  h+=`<div class="note2">Fakturaci školka řeší mimo appku — zde jen přehled.</div></div>`;

  // (c) systémová upozornění vč. chybějících dat
  h+=`<div class="tile"><div class="tlab">Systémová upozornění</div>`;
  UPOZORNENI.forEach(u=>{
    const ic=u.typ==='data'?'⚠':u.typ==='provoz'?'●':'✓';
    h+=`<div class="al-row al-${u.typ}"><span class="al-ic">${ic}</span><span class="al-tx">${u.text}${u.skolka?` <span class="al-sk">· ${u.skolka}</span>`:''}</span></div>`;
  });
  h+=`</div>`;

  // (d) souhrn náhrad — dostupné celkem, kolik brzy expiruje, naplánované
  h+=`<button class="tile dash-link" onclick="go('nahrady')"><div class="tlab" style="margin:0">Náhrady <span class="dl-arr">›</span></div>`
    +`<div class="nh-grid">`
    +`<div class="nh-cell"><div class="nh-num">${NAHRADY_SUM.dostupne}</div><div class="nh-lab">dostupných</div></div>`
    +`<div class="nh-cell"><div class="nh-num warn">${NAHRADY_SUM.expiruje}</div><div class="nh-lab">propadne 30. 6. (konec šk. roku)</div></div>`
    +`<div class="nh-cell"><div class="nh-num">${NAHRADY_SUM.naplanovane}</div><div class="nh-lab">naplánovaných</div></div>`
    +`</div></button>`;

  // (e) provozní úkoly — checklist, odškrtávání v paměti
  const hotovo=UKOLY.filter(u=>u.done).length;
  h+=`<div class="tile"><div class="tlab">Provozní úkoly <span class="tl-count">${hotovo}/${UKOLY.length}</span></div>`;
  UKOLY.forEach((u,i)=>{
    h+=`<button class="task ${u.done?'done':''}" onclick="toggleUkol(${i})"><span class="task-box">${u.done?'✓':''}</span><span class="task-t">${u.t}</span></button>`;
  });
  h+=`</div>`;

  // (f) poslední porady / evaluace — titulky (odvozené ze ZAPISY), proklik do sekce porad
  h+=`<button class="tile dash-link" onclick="go('porady')"><div class="tlab" style="margin:0">Poslední porady a evaluace <span class="dl-arr">›</span></div>`;
  ZAPISY.slice().sort((a,b)=>b.dt-a.dt).slice(0,3).forEach(p=>{
    h+=`<div class="por-row"><span class="por-d">${p.datum}</span><span class="por-t">${p.nazev}<span class="por-sk"> · ${p.skolka}</span></span><span class="por-typ ${p.typ}">${p.typ==='porada'?'porada':'evaluace'}</span></div>`;
  });
  h+=`</button>`;

  return h;
}
const kc=n=>String(n).replace(/\B(?=(\d{3})+(?!\d))/g,' ');
window.toggleUkol=i=>{UKOLY[i].done=!UKOLY[i].done;render();};
</script>

    h+=`<div class="tile ak-item">`;
    h+=`<div class="ak-top"><span class="bdg ${st.cls}">${st.lab}</span>`
      +(a.urgent?`<span class="bdg al">Důležité</span>`:``)
      +(a.datum?`<span class="ak-date">${a.datum}</span>`:``)+`</div>`;
    h+=`<div class="ak-txt">${escTa(a.text)||'<span class="ak-empty">(bez textu)</span>'}</div>`;
    // příjemci
    const rec=recipText(a.recip);
    if(rec.length){
      h+=`<div class="ak-rec"><span class="ak-rlab">Příjemci:</span> ${rec.map(escTa).join(' · ')}</div>`;
    }else if(a.stav==='koncept'){
      h+=`<div class="ak-rec ak-norec">Bez určených příjemců — před odesláním je nutné je vybrat.</div>`;
    }
    // akce dle stavu
    h+=`<div class="ak-acts">`;
    if(a.stav==='koncept'){
      h+=`<button class="btn-s" onclick="akEdit('${a.id}')">Upravit</button>`;
      h+=hasRecip(a.recip)
        ? `<button class="btn-s primary" onclick="akSendId('${a.id}')">Odeslat</button>`
        : `<button class="btn-s primary" disabled title="Nejdřív vyberte příjemce">Odeslat</button>`;
    }else if(a.stav==='odeslana'){
      h+=`<button class="btn-s" onclick="akArchive('${a.id}')">Archivovat</button>`;
    }else if(a.stav==='naplanovana'){
      h+=`<span class="ak-hint">Odešle se automaticky v naplánovaný čas.</span>`;
    }
    h+=`</div></div>`;
  });
  return h;
}

function renderAkForm(){
  const f=formA, recip=f.recip;
  const rec=recipText(recip), ok=hasRecip(recip), textOk=f.text.trim().length>0;
  let h=`<button class="back" onclick="akCancel()">‹ Zpět na seznam</button>`;
  h+=`<div class="tile">`;
  h+=`<div class="field"><div class="l">Text aktuality</div>`
    +`<textarea class="pta" id="akText" placeholder="Co chcete rodičům oznámit?">${escTa(f.text)}</textarea></div>`;
  // důležité
  h+=`<div class="field"><div class="l">Označení</div><div class="pchips">`
    +`<button class="${f.urgent?'on':''}" onclick="akToggleUrgent()">Důležité (urgentní)</button></div></div>`;
  // příjemci — povinné
  h+=`<div class="field"><div class="l">Příjemci · povinné</div>`;
  SKOLKY.forEach(s=>{
    const r=recip[s.id]||{all:false,tridy:[]};
    h+=`<div class="rec-sk"><div class="rec-nm">${s.nazev} <span class="rec-fam">${obsazeno(s)} rodin</span></div><div class="pchips">`;
    h+=`<button class="${r.all?'on':''}" onclick="akToggleAll('${s.id}')">Celá školka</button>`;
    // u školky s jedinou skupinou by chip třídy jen dubloval „Celá školka"
    if(s.tridy.length>1)s.tridy.forEach(t=>{
      const on=!r.all&&r.tridy.indexOf(t.n)>=0;
      h+=`<button class="${on?'on':''}" onclick="akToggleTrida('${s.id}','${t.n}')">${t.n} <span class="rec-fam">${t.obs}</span></button>`;
    });
    h+=`</div></div>`;
  });
  h+=`</div>`;
  // náhled příjemců
  if(ok){
    h+=`<div class="tile note-info ak-preview"><b>Odešle se rodičům:</b><br>${rec.map(escTa).join('<br>')}</div>`;
  }else{
    h+=`<div class="ak-warn">⚠ Bez určených příjemců nelze aktualitu odeslat — vyberte alespoň jednu školku nebo třídu.</div>`;
  }
  // tlačítka
  h+=`<div class="mbtns">`;
  h+=`<button class="btn-ghost" onclick="akSaveDraft()">Uložit koncept</button>`;
  const canSend=ok&&textOk;
  h+=canSend
    ? `<button class="btn-primary" onclick="akSend()">Odeslat</button>`
    : `<button class="btn-primary" disabled>Odeslat</button>`;
  h+=`</div>`;
  if(ok&&!textOk)h+=`<div class="ak-warn" style="margin-top:8px">Doplňte text aktuality.</div>`;
  h+=`</div>`;
  return h;
}

// před každou akcí, která překreslí, uložíme rozepsaný text (render zničí textarea)
function akSyncText(){const el=document.getElementById('akText');if(el&&formA)formA.text=el.value;}

window.akNew=()=>{formA={text:'',urgent:false,recip:{}};akEditId=null;akView='new';render();};
window.akEdit=id=>{const a=AKTUALITY.find(x=>x.id===id);formA={text:a.text,urgent:a.urgent,recip:JSON.parse(JSON.stringify(a.recip||{}))};akEditId=id;akView='new';render();};
window.akCancel=()=>{akView='list';formA=null;akEditId=null;render();};

window.akToggleUrgent=()=>{akSyncText();formA.urgent=!formA.urgent;render();};
window.akToggleAll=sid=>{akSyncText();const r=formA.recip[sid]||(formA.recip[sid]={all:false,tridy:[]});r.all=!r.all;r.tridy=[];if(!r.all)delete formA.recip[sid];render();};
window.akToggleTrida=(sid,tn)=>{akSyncText();const r=formA.recip[sid]||(formA.recip[sid]={all:false,tridy:[]});r.all=false;const i=r.tridy.indexOf(tn);if(i>=0)r.tridy.splice(i,1);else r.tridy.push(tn);if(!r.tridy.length)delete formA.recip[sid];render();};

function akCommit(stav){
  const dt=`${TODAYD}. 6. 2026`;
  if(akEditId){
    const a=AKTUALITY.find(x=>x.id===akEditId);
    a.text=formA.text;a.urgent=formA.urgent;a.recip=formA.recip;a.stav=stav;
    if(stav==='odeslana')a.datum=dt;
  }else{
    AKTUALITY.unshift({id:'ak'+(akUid++),text:formA.text,urgent:formA.urgent,stav,datum:stav==='odeslana'?dt:'',recip:formA.recip});
  }
}
window.akSaveDraft=()=>{akSyncText();akCommit('koncept');akView='list';formA=null;akEditId=null;showToast('Koncept uložen');render();};
window.akSend=()=>{akSyncText();if(!hasRecip(formA.recip)||!formA.text.trim())return;akCommit('odeslana');akView='list';formA=null;akEditId=null;showToast('Aktualita odeslána');render();};

// odeslání přímo ze seznamu (koncept s vybranými příjemci)
window.akSendId=id=>{const a=AKTUALITY.find(x=>x.id===id);if(!hasRecip(a.recip)||!a.text.trim())return;a.stav='odeslana';a.datum=`${TODAYD}. 6. 2026`;showToast('Aktualita odeslána');render();};
window.akArchive=id=>{const a=AKTUALITY.find(x=>x.id===id);a.stav='archivovana';showToast('Aktualita archivována');render();};
</script>
<script>
/* SCREEN: ADMIN_PORADY — Flow 5: vedení hledá podklady pro inspekci.
   Seznam zápisů (filtr školka/typ) · detail se štítky u odstavců ·
   filtrovaný výpis (štítek + období) napříč zápisy · export do tisku. */

let poView='zapisy';   // 'zapisy' | 'vypis'
let poOpen=null;       // id otevřeného zápisu (detail), null = seznam
let poNew=false;       // formulář nového zápisu
let fSkolka='vse', fTyp='vse';         // filtry seznamu
let vStitek='hygiena', vObdobi='vse';  // filtry výpisu
let newZ=null;         // {nazev,typ,skolka,text,stitky:[]}

function renderPorady(){
  if(poNew)return renderPoForm();
  if(poOpen)return renderPoDetail();
  let h=`<div class="switch">`
    +`<button class="${poView==='zapisy'?'on':''}" onclick="poGo('zapisy')">Zápisy</button>`
    +`<button class="${poView==='vypis'?'on':''}" onclick="poGo('vypis')">Výpis podle štítku</button></div>`;
  h+=poView==='vypis'?renderPoVypis():renderPoList();
  return h;
}

/* ---- seznam zápisů ---- */
function renderPoList(){
  let h=`<button class="addbig no-print" onclick="poNewZ()">+ Nový zápis</button>`;
  // filtry
  h+=`<div class="filters no-print">`
    +chip('fSkolka','vse','Všechny školky',fSkolka)
    +SKOLKY.map(s=>chip('fSkolka',s.nazev,s.nazev,fSkolka)).join('')
    +`</div>`;
  h+=`<div class="filters no-print">`
    +chip('fTyp','vse','Vše',fTyp)+chip('fTyp','porada','Porady',fTyp)+chip('fTyp','evaluace','Evaluace',fTyp)
    +`</div>`;
  const list=ZAPISY.slice().sort((a,b)=>b.dt-a.dt)
    .filter(z=>(fSkolka==='vse'||z.skolka===fSkolka)&&(fTyp==='vse'||z.typ===fTyp));
  if(!list.length)h+=`<div class="tile"><div class="ph-d">Žádné zápisy pro zvolený filtr.</div></div>`;
  list.forEach(z=>{
    const tags=[...new Set(z.odstavce.flatMap(o=>o.stitky))];
    h+=`<button class="tile za-item" onclick="poShow('${z.id}')">`
      +`<div class="ak-top"><span class="por-typ ${z.typ}">${z.typ}</span><span class="za-sk">${z.skolka}</span><span class="ak-date">${z.datum}</span></div>`
      +`<div class="za-nz">${escTa(z.nazev)}</div>`
      +`<div class="za-tags">${tags.map(t=>`<span class="stitek">${t}</span>`).join('')}</div>`
      +`</button>`;
  });
  return h;
}

/* ---- detail zápisu ---- */
function renderPoDetail(){
  const z=ZAPISY.find(x=>x.id===poOpen);
  let h=`<button class="back no-print" onclick="poBack()">‹ Zpět na seznam</button>`;
  h+=`<div class="tile">`
    +`<div class="ak-top"><span class="por-typ ${z.typ}">${z.typ}</span><span class="za-sk">${z.skolka}</span><span class="ak-date">${z.datum}</span></div>`
    +`<div class="za-nz za-nz-lg">${escTa(z.nazev)}</div>`
    +`<div class="za-ucast">Účastníci: ${z.ucastnici.join(', ')}</div>`;
  z.odstavce.forEach((o,i)=>{
    h+=`<div class="odst"><div class="odst-tx">${escTa(o.text)}</div>`
      +`<div class="pchips odst-chips no-print">`
      +STITKY.map(t=>`<button class="${o.stitky.indexOf(t)>=0?'on':''}" onclick="poToggleStitek('${z.id}',${i},'${t}')">${t}</button>`).join('')
      +`</div>`
      // v tisku se místo přepínačů ukážou jen aktivní štítky
      +`<div class="za-tags print-only">${o.stitky.map(t=>`<span class="stitek">${t}</span>`).join('')}</div>`
      +`</div>`;
  });
  h+=`<div class="note2 no-print">Štítek u odstavce přidáte/odeberete klepnutím — takto se odstavce zpřístupní filtrovanému výpisu.</div>`;
  h+=`</div>`;
  return h;
}

/* ---- filtrovaný výpis (jádro Flow 5) ---- */
function renderPoVypis(){
  const ob=OBDOBI.find(o=>o.k===vObdobi);
  // posbírej odstavce s vybraným štítkem v období, napříč zápisy
  const hits=[];
  ZAPISY.slice().sort((a,b)=>b.dt-a.dt).forEach(z=>{
    if(z.dt<ob.from||z.dt>ob.to)return;
    z.odstavce.forEach(o=>{if(o.stitky.indexOf(vStitek)>=0)hits.push({z,o});});
  });
  let h=`<div class="filters no-print">`
    +STITKY.map(t=>chip('vStitek',t,t,vStitek)).join('')+`</div>`;
  h+=`<div class="filters no-print">`
    +OBDOBI.map(o=>chip('vObdobi',o.k,o.label,vObdobi)).join('')+`</div>`;
  // hlavička výpisu (užitečná i na papíře)
  h+=`<div class="vypis-head"><div class="vh-t">Výpis zápisů — štítek „${vStitek}"</div>`
    +`<div class="vh-s">${ob.label} · ${hits.length} ${hits.length===1?'odstavec':(hits.length>=2&&hits.length<=4?'odstavce':'odstavců')}</div></div>`;
  h+=`<button class="btn-s primary no-print" style="margin-bottom:12px" onclick="window.print()">Exportovat výpis (tisk / PDF)</button>`;
  if(!hits.length){
    h+=`<div class="tile"><div class="ph-d">Pro tento štítek a období nejsou žádné odstavce.</div></div>`;
    return h;
  }
  hits.forEach(({z,o})=>{
    h+=`<div class="tile vy-item"><div class="ak-top"><span class="por-typ ${z.typ}">${z.typ}</span><span class="za-sk">${z.skolka}</span><span class="ak-date">${z.datum}</span></div>`
      +`<div class="vy-nz">${escTa(z.nazev)}</div>`
      +`<div class="odst-tx">${escTa(o.text)}</div>`
      +`<div class="za-tags">${o.stitky.map(t=>`<span class="stitek ${t===vStitek?'hi':''}">${t}</span>`).join('')}</div>`
      +`<button class="vy-link no-print" onclick="poShow('${z.id}')">→ celý zápis</button></div>`;
  });
  return h;
}

/* ---- nový zápis (minimální: titulek + text + štítky) ---- */
function renderPoForm(){
  const f=newZ;
  let h=`<button class="back" onclick="poCancel()">‹ Zpět na seznam</button>`;
  h+=`<div class="tile">`
    +`<div class="field"><div class="l">Název zápisu</div><input class="pin" id="nzNazev" value="${esc(f.nazev)}" placeholder="Např. Provozní porada — červen"></div>`;
  h+=`<div class="field"><div class="l">Typ</div><div class="pchips">`
    +`<button class="${f.typ==='porada'?'on':''}" onclick="poFType('porada')">Porada</button>`
    +`<button class="${f.typ==='evaluace'?'on':''}" onclick="poFType('evaluace')">Evaluace</button></div></div>`;
  h+=`<div class="field"><div class="l">Školka</div><div class="pchips">`
    +SKOLKY.map(s=>`<button class="${f.skolka===s.nazev?'on':''}" onclick="poFSkolka('${s.nazev}')">${s.nazev}</button>`).join('')+`</div></div>`;
  h+=`<div class="field"><div class="l">Text</div><textarea class="pta" id="nzText" placeholder="Zápis z porady…">${escTa(f.text)}</textarea></div>`;
  h+=`<div class="field"><div class="l">Štítky</div><div class="pchips">`
    +STITKY.map(t=>`<button class="${f.stitky.indexOf(t)>=0?'on':''}" onclick="poFStitek('${t}')">${t}</button>`).join('')+`</div></div>`;
  const ok=f.nazev.trim()&&f.text.trim();
  h+=`<div class="mbtns"><button class="btn-ghost" onclick="poCancel()">Zrušit</button>`
    +(ok?`<button class="btn-primary" onclick="poSave()">Uložit zápis</button>`:`<button class="btn-primary" disabled>Uložit zápis</button>`)+`</div>`;
  if(!ok)h+=`<div class="note2">Vyplňte název a text zápisu.</div>`;
  h+=`</div>`;
  return h;
}

/* ---- helpery / handlery ---- */
function chip(varName,val,label,cur){return `<button class="${cur===val?'on':''}" onclick="poFilter('${varName}','${val}')">${label}</button>`;}

window.poGo=v=>{poView=v;render();};
window.poShow=id=>{poOpen=id;poNew=false;render();};
window.poBack=()=>{poOpen=null;render();};
window.poFilter=(v,val)=>{if(v==='fSkolka')fSkolka=val;else if(v==='fTyp')fTyp=val;else if(v==='vStitek')vStitek=val;else if(v==='vObdobi')vObdobi=val;render();};

// přidání/odebrání štítku odstavci v detailu
window.poToggleStitek=(zid,i,t)=>{const o=ZAPISY.find(z=>z.id===zid).odstavce[i];const k=o.stitky.indexOf(t);if(k>=0)o.stitky.splice(k,1);else o.stitky.push(t);render();};

// nový zápis
window.poNewZ=()=>{newZ={nazev:'',typ:'porada',skolka:SKOLKY[0].nazev,text:'',stitky:[]};poNew=true;render();};
function nzSync(){const n=document.getElementById('nzNazev'),t=document.getElementById('nzText');if(newZ){if(n)newZ.nazev=n.value;if(t)newZ.text=t.value;}}
window.poFType=v=>{nzSync();newZ.typ=v;render();};
window.poFSkolka=v=>{nzSync();newZ.skolka=v;render();};
window.poFStitek=t=>{nzSync();const k=newZ.stitky.indexOf(t);if(k>=0)newZ.stitky.splice(k,1);else newZ.stitky.push(t);render();};
window.poCancel=()=>{poNew=false;newZ=null;render();};
window.poSave=()=>{nzSync();if(!newZ.nazev.trim()||!newZ.text.trim())return;
  const d=TODAYD, dt=20260600+d, datum=`${d}. 6. 2026`;
  ZAPISY.unshift({id:'z'+(zapisUid++),dt,datum,typ:newZ.typ,skolka:newZ.skolka,nazev:newZ.nazev.trim(),ucastnici:['vedení'],odstavce:[{text:newZ.text.trim(),stitky:newZ.stitky.slice()}]});
  poNew=false;newZ=null;showToast('Zápis uložen');render();};
</script>
<script>
/* CORE: ADMIN — stav, sekce, sidebar, render(), go(), úvodní spuštění.
   Desktopový shell: stálý levý sidebar místo mobilního draweru. */
const SECTIONS=[
  ['prehled','Přehled','⌂'],
  ['aktuality','Aktuality','✉'],
  ['porady','Porady a evaluace','▤'],
  ['platby','Platby','₵'],
  ['nahrady','Náhrady','↻'],
];
const TITLES=Object.fromEntries(SECTIONS.map(s=>[s[0],s[1]]));

let section='prehled';

// Sekce mimo 3.1 zatím renderují decentní placeholder (navigace nevede do prázdna).
function renderPlaceholder(){
  return `<div class="tile ph-tile"><div class="ph-ic">🌿</div><div class="ph-t">${TITLES[section]}</div>`
    +`<div class="ph-d">Tato sekce se připravuje v další fázi prototypu.</div></div>`;
}
const RENDER={prehled:renderPrehled,aktuality:renderAktuality,porady:renderPorady,platby:renderPlaceholder,nahrady:renderPlaceholder};

function renderSidebar(){
  const el=document.getElementById('sidebar');
  el.innerHTML=`<div class="sb-brand"><img class="brand-mark" src="${VHAAJI_LOGO}" alt=""><span class="brand-txt">Vhaaji<small>vedení a administrativa</small></span></div>`
    +`<div class="sb-nav">`+SECTIONS.map(s=>`<button class="sb-item ${section===s[0]?'on':''}" onclick="go('${s[0]}')"><span class="ic">${s[2]}</span>${s[1]}</button>`).join('')+`</div>`;
}
function render(){
  document.getElementById('ttl').textContent=TITLES[section];
  renderSidebar();
  document.getElementById('content').innerHTML=RENDER[section]();
}
window.go=s=>{section=s;if(s!=='aktuality')akView='list';if(s!=='porady'){poOpen=null;poNew=false;}render();};

render();
</script>
