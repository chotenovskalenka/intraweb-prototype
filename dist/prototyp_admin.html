<style>
/* Design tokens – sémantická vrstva. Hodnoty odvozené z vhaaji.cz (fáze 4.2, redesign).
   Viz docs/design-system.md. Komponenty čerpají z tokenů, nikdy natvrdo. */
:root{
  /* Povrchy / text */
  --color-bg:#EFEEE9;
  --color-surface:#F9F7F1;
  --color-surface-2:#E7E4DA;
  --color-text:#1F2A2E;
  --color-text-muted:#5C6560;
  --color-text-hint:#767B74;
  /* Značkové barvy */
  --color-primary:#2B7059;
  --color-primary-strong:#1F5344;
  --color-accent:#C8BC85;          /* okrová – výplň (tmavý text) */
  --color-accent-ink:#6F5F1C;      /* okrová jako text (AA na světlé) */
  --color-accent-soft:#C99C93;     /* tlumená růžová – dekor */
  --color-info:#496D7E;
  --color-on-primary:#F4EEDF;      /* text/prvky na primární ploše */
  /* Ohraničení / stavy */
  --color-border:rgba(31,42,46,.10);
  --color-border-strong:rgba(31,42,46,.16);
  --color-danger:#B0492F;
  --color-success:#387349;
  /* Poloprůhledné výplně a ohraničení značkových barev (4.7). Dřív žilo v CSS deset různých
     alf jedné zelené, osm rezavé a osm okrové – bez pravidla, kdy použít kterou.
     wash = sotva znatelný podklad · soft = běžná výplň, aktivní stav · edge = ohraničení. */
  --wash-primary:rgba(43,112,89,.07);
  --soft-primary:rgba(43,112,89,.12);
  --edge-primary:rgba(43,112,89,.20);
  --wash-danger:rgba(176,73,47,.08);
  --soft-danger:rgba(176,73,47,.12);
  --edge-danger:rgba(176,73,47,.28);
  --wash-accent:rgba(200,188,133,.10);
  --soft-accent:rgba(200,188,133,.14);
  --edge-accent:rgba(200,188,133,.30);
  /* UI tinty (směr whitespace + barva) – světlé kategorie/stavy */
  --tint-green:#E3EDE7;
  --tint-rose:#F1E1DC;
  --tint-ochre:#F1EAD2;
  --tint-blue:#DEE7EA;
  /* Placeholdery fotek (galerie, úvodní fotky novinek) – v ostré verzi je nahradí reálné snímky.
     Tlumené odstíny z akvarelové palety, aby prototyp nepůsobil jako rozbitý obrázek. */
  --photo-1:#E3D9C6;
  --photo-2:#DCE3D6;
  --photo-3:#D8E0E4;
  --photo-4:#E8DCD2;
  --photo-5:#E7E0CE;
  /* Stavová paleta – jeden vizuální jazyk stavů napříč appkami (badge/chip/CODES).
     Každý stav má -ink (text) a -bg (světlá výplň). */
  --state-ok-ink:var(--color-success);       --state-ok-bg:rgba(56,115,73,.11);
  --state-info-ink:var(--color-info);        --state-info-bg:rgba(73,109,126,.10);
  --state-warn-ink:var(--color-accent-ink);  --state-warn-bg:rgba(200,188,133,.22);
  --state-danger-ink:var(--color-danger);    --state-danger-bg:rgba(176,73,47,.08);
  --state-neutral-ink:var(--color-text-muted);--state-neutral-bg:rgba(92,101,96,.14);
  --state-muted-ink:var(--color-text-hint);  --state-muted-bg:rgba(31,42,46,.07);
  --state-brand-ink:var(--color-primary);    --state-brand-bg:rgba(43,112,89,.12);
  /* Škála rádiusů (4.7). Dřív žilo v CSS osm různých hodnot a čtyři z nich (8/9/10/11 px)
     dělaly tutéž práci — zaoblení malých ovládacích prvků. Nové zaoblení ber odsud.
     Kruhy (avatary, 50 %) sem nepatří, ty zůstávají procentuální. */
  --radius-xs:6px;      /* odznáčky, chipy, drobné značky */
  --radius-sm:9px;      /* formulářová pole, malá tlačítka */
  --radius-md:12px;     /* ovládací prvky, řádky seznamů, karty v seznamu */
  --radius-lg:14px;     /* hlavní plochy – .tile, .newscard */
  --radius-full:999px;  /* pilulky, přepínače */
  /* Typografie – nadpisy Bricolage Grotesque, tělo/UI Inter (univerzální pro všechny 4 školky).
     Token --font-serif drží nadpisový font (historický název; hodnota je bezpatková). */
  --font-serif:"Bricolage Grotesque",system-ui,sans-serif;
  --font-sans:"Inter",system-ui,sans-serif;
  /* Typografická škála (4.7). Dřív žilo v CSS 27 různých velikostí písma a čtyři z nich
     (12 / 12,5 / 13 / 13,5 px) nesly tělový text ve 146 deklaracích. Každý token má roli
     a odpovídá jednomu textovému stylu ve Figma knihovně. */
  --text-chip:10px;        /* odznáčky, chipy, drobné značky */
  --text-micro:11px;       /* popisky formulářových polí (.pl) */
  --text-note:12px;        /* poznámky, mikropopisky karet (.note2, .tlab) */
  --text-meta:12.5px;      /* meta řádek pod názvem (.ameta) */
  --text-small:13.5px;     /* sekundární text */
  --text-body:14px;        /* běžný text v kartě */
  --text-action:15px;      /* popisek tlačítka */
  --text-heading:16px;     /* nadpis karty a sekce (.ch, .vhead) */
  --text-title:19px;       /* nadpis modalu, program dne */
  --text-display:25px;     /* nadpis stránky (.dh-t) */
  --text-number:28px;      /* velká čísla v dlaždicích (.tab .num) */
  --text-number-lg:34px;   /* největší čísla (zůstatek fondu) */
  /* Řádkování – čtyři kroky místo dřívějších třinácti hodnot mezi 1,05 a 1,65. */
  --leading-tight:1.15;    /* nadpisy, velká čísla */
  --leading-snug:1.3;      /* krátké popisky */
  --leading-normal:1.45;   /* běžný text */
  --leading-relaxed:1.6;   /* delší odstavce */
  /* Škála mezer (4.7). Pravidla použití viz design-system.md „Mezery".
     Před zavedením škály žilo v CSS 27 různých px hodnot pro margin/padding/gap –
     proto se pořád zapomínalo na odsazení a psalo se inline. Nové mezery ber odsud. */
  --space-xs:4px;    /* uvnitř řádku, mezi ikonou a textem */
  --space-sm:8px;    /* mezi řádky uvnitř karty */
  --space-md:12px;   /* mezi kartami; nad tlačítkem v kartě */
  --space-lg:16px;   /* hlavička → obsah */
  --space-xl:24px;   /* mezi sekcemi stránky */
  --space-2xl:32px;  /* velké předěly, patička */
  --space-3xl:48px;  /* spodní vzduch stránky */
}
</style>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--color-bg);font-family:var(--font-sans);color:var(--color-text);-webkit-font-smoothing:antialiased;min-height:100vh;line-height:var(--leading-normal)}

/* Přístupnost: viditelný focus jen při klávesové navigaci (ne po kliknutí myší).
   Hlavně pro desktop/admin. */
:focus{outline:none}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,[tabindex]:focus-visible{
  outline:2px solid var(--color-primary);outline-offset:2px;border-radius:var(--radius-xs)}

/* Přístupnost: respektuj systémové omezení pohybu (nevolnost z animací). */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;
    transition-duration:.01ms!important;scroll-behavior:auto!important}
}
</style>
<style>
/* LAYOUT: ADMIN – desktopový shell (stálý levý sidebar + obsah s max šířkou ~980 px).

/* Neaktivní tlačítko – stejný jazyk jako .savebtn.dis (výplň surface-2, text hint).
   Bez tohoto pravidla vypadalo .btn-primary[disabled] přesně jako aktivní (admin: Uložit zápis, Odeslat). */
.btn-primary:disabled,.btn-ghost:disabled{background:var(--color-surface-2);color:var(--color-text-hint);border-color:var(--color-border);cursor:default}
.btn-del{display:block;background:none;border:none;color:var(--color-danger);font-size:var(--text-small);font-weight:600;cursor:pointer;margin:12px auto 0;font-family:var(--font-sans)}
/* Filtr seznamu. Pilulka s výplní četla jako tlačítko („proveď"), i když jen přepíná výřez
   dat – proto text s počtem a podtržením aktivního, ne button chrome. */
.filters{display:flex;gap:var(--space-xl);margin-bottom:var(--space-md);border-bottom:1px solid var(--color-border);overflow-x:auto;scrollbar-width:none}.filters::-webkit-scrollbar{display:none}
.filters button{flex:0 0 auto;min-height:44px;border:none;border-bottom:2px solid transparent;margin-bottom:-1px;background:none;font-family:var(--font-sans);font-size:var(--text-small);color:var(--color-text-muted);padding:0 2px;cursor:pointer;white-space:nowrap}
.filters button.on{color:var(--color-primary-strong);font-weight:600;border-bottom-color:var(--color-primary)}
.filters .cnt{color:var(--color-text-hint);font-variant-numeric:tabular-nums;margin-left:4px}
.filters button.on .cnt{color:var(--color-primary)}
.bdg{font-size:var(--text-chip);font-weight:600;padding:2px 7px;border-radius:var(--radius-xs);white-space:nowrap}
.bdg.pre{color:var(--state-brand-ink);background:var(--state-brand-bg)}.bdg.al{color:var(--state-danger-ink);background:var(--state-danger-bg)}
.pav{display:flex;justify-content:center;margin:6px 0 10px}
.pname{font-family:var(--font-serif);font-size:var(--text-display);text-align:center;color:var(--color-primary-strong)}
.pfull{text-align:center;font-size:var(--text-small);color:var(--color-text-muted);margin-bottom:var(--space-lg)}
.back{background:none;border:none;color:var(--color-primary);font-weight:600;font-size:var(--text-body);font-family:var(--font-sans);cursor:pointer;padding:4px 0;margin-bottom:10px}
.addbtn{min-height:44px;margin-top:10px;width:100%;border:1px dashed var(--color-border-strong);background:transparent;color:var(--color-text-muted);font-family:var(--font-sans);font-size:var(--text-small);padding:10px;border-radius:var(--radius-md);cursor:pointer}
.contact{display:flex;gap:7px;margin-top:6px}
.cbtn{flex:1;min-height:44px;display:flex;align-items:center;justify-content:center;text-align:center;border:1px solid var(--color-primary);color:var(--color-primary);border-radius:var(--radius-sm);padding:9px;font-size:var(--text-small);font-weight:600;text-decoration:none;font-family:var(--font-sans)}
.stepper{display:flex;align-items:center;justify-content:space-between;background:var(--color-surface-2);border:1px solid var(--color-border);border-radius:var(--radius-md);padding:6px 6px;margin-bottom:13px}
.stepper button{min-width:44px;min-height:44px;border:none;background:none;font-size:var(--text-title);color:var(--color-primary);cursor:pointer;padding:5px 16px;font-family:var(--font-serif);line-height:1}
.stepper button:disabled{color:var(--color-text-hint);cursor:default}
.stepper span{font-family:var(--font-serif);font-size:var(--text-heading);color:var(--color-primary-strong)}
/* minmax(0,1fr) místo 1fr: samotné 1fr je minmax(auto,1fr), takže se sloupec nesmrskne pod
   šířku obsahu a delší slovo („odpolední") mřížku roztlačí ven z kontejneru. */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:var(--space-xs)}
.calh{text-align:center;font-size:var(--text-micro);color:var(--color-text-muted);padding:2px 0}
table.wt td.ced{cursor:pointer;background:var(--wash-primary)}
table.wt td.ced:active{background:var(--soft-primary)}
/* Klikací buňky musí splnit dotykový cíl ≥44 px (design-system.md, přístupnost).
   Na mobilu jich bylo 40×39 – na desktopu se klikne myší, tam stačí výchozí výška.
   .wt-sm = tabulka s krátkými jmény (služby průvodců) → užší první sloupec uvolní šířku buňkám. */
@media (max-width:899px){
  table.wt td.ced{height:44px}
  table.wt.wt-sm th.who,table.wt.wt-sm td.who{width:33%}
}
table.wt td.pastc{opacity:.45}
.calcell{aspect-ratio:1;border:1px solid var(--color-border);border-radius:var(--radius-sm);background:var(--color-surface);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;position:relative}
.calcell .cnum{font-size:var(--text-small);color:var(--color-text)}
.calcell.we{background:transparent;border-color:transparent}.calcell.we .cnum{color:var(--color-text-hint)}
.calcell.today{border-color:var(--color-primary);border-width:1.5px}
.calcell.sel{background:var(--color-primary)}.calcell.sel .cnum{color:var(--color-on-primary)}
.cdot{width:5px;height:5px;border-radius:50%;background:var(--color-accent);margin-top:2px}
.ccount{font-size:var(--text-micro);font-weight:600;color:var(--color-primary);margin-top:1px}.ccount.lk{color:var(--color-text-hint)}
.calcell.sel .cdot{background:var(--color-on-primary)}

/* Dashboard – sdílený „soupis dne" (rodič i průvodce): velký datumový nadpis,
   prioritní sloupce, nadpisy karet .ch, program dne. Parent-specifické (listování
   dnů .dh-nav/.dh-step, day-picker) zůstávají v screens-rodic.css. */
.dash-head{display:flex;align-items:center;justify-content:flex-start;gap:14px;flex-wrap:wrap;margin:0 0 16px}
.dh-t{font-family:var(--font-serif);font-size:var(--text-display);font-weight:700;color:var(--color-primary-strong);line-height:var(--leading-tight);margin:0}
.dh-sub{width:100%;font-size:var(--text-small);color:var(--color-text-muted);margin-top:-8px}
/* Nadpis sekce (H1) v topbaru – na úrovni role/přepínače. Prázdná (overlay) → skrytá.
   Sdílené oběma mobilními appkami; na mobilu se zalomí pod řádek burger+role/přepínač. */
.dashhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-width:0;flex:1}
.dashhead:empty{display:none}
@media (max-width:899px){.topbar{flex-wrap:wrap} .dashhead{order:3;flex-basis:100%;margin-top:6px}}
/* plakát tématického plánu (reálný obrázek z nástěnky) – sdílené oběma appkami */
.tema-poster{display:block;width:100%;max-width:520px;border:1px solid var(--color-border);border-radius:var(--radius-md);margin:0 auto 10px}
.tema-poster:last-of-type{margin-bottom:0}
/* plakát jako klikací tlačítko (zvětšení) + lightbox */
.poster-btn{display:block;width:100%;max-width:520px;border:none;background:none;padding:0;margin:0 auto 10px;cursor:pointer;position:relative}
.poster-btn:last-of-type{margin-bottom:0}
.poster-btn .tema-poster{margin:0;max-width:100%}
.poster-zoom{position:absolute;top:8px;right:8px;width:30px;height:30px;display:flex;align-items:center;justify-content:center;background:rgba(31,42,46,.55);color:#fff;border-radius:var(--radius-sm);font-size:var(--text-action);pointer-events:none}
.lb-scrim{position:fixed;inset:0;background:rgba(20,26,28,.86);z-index:50;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px}
.lb-scrim.on{display:flex}
.lb-img{max-width:min(96vw,760px);max-height:82vh;border-radius:var(--radius-md);box-shadow:0 12px 40px rgba(0,0,0,.5)}
.lb-dl{background:var(--color-surface);color:var(--color-primary);font-family:var(--font-sans);font-size:var(--text-body);font-weight:600;padding:10px 18px;border-radius:var(--radius-md);text-decoration:none}
/* menu ikony (SVG line, stroke=currentColor → barevnost dle položky: neaktivní tmavá, aktivní zelená) */
.ditem .ic,.sb-item .ic{width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;opacity:.72}
.ditem.on .ic,.sb-item.on .ic{opacity:1}
.ic svg{width:20px;height:20px;display:block}
.ch{font-family:var(--font-serif);font-size:var(--text-heading);font-weight:600;color:var(--color-primary-strong);margin-bottom:var(--space-sm)}
.prog-day{font-family:var(--font-serif);font-size:var(--text-title);font-weight:600;color:var(--color-primary);margin:0 0 4px}
.cardlink{display:block;width:100%;min-height:44px;text-align:left;background:none;border:none;border-top:1px solid var(--color-border);margin-top:12px;padding:12px 0 2px;color:var(--color-primary);font-weight:600;font-size:var(--text-small);font-family:var(--font-sans);cursor:pointer}
@media (min-width:900px){
  .dash3{display:grid;grid-template-columns:repeat(2,1fr);gap:20px;align-items:start}
  .dcol{min-width:0}
}
@media (min-width:1200px){.dash3{grid-template-columns:repeat(3,1fr)}}

/* Novinky – sdílené karty se seznamem/detailem (rodič: sekce Novinky + overlay detail;
   průvodce: sekce Novinky + modal detail). Foto = placeholder tint jako sekce Fotky. */
.gal{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
.ph{aspect-ratio:4/3;border-radius:var(--radius-md);display:flex;align-items:center;justify-content:center;font-size:var(--text-note);color:rgba(31,42,46,.38);overflow:hidden}
.nc-hero img,.nd-hero img,.ph img{width:100%;height:100%;object-fit:cover}
.newsurg{display:inline-block;font-size:var(--text-chip);font-weight:700;color:var(--state-danger-ink);background:var(--state-danger-bg);border-radius:var(--radius-xs);padding:2px 8px;margin-bottom:6px;text-transform:uppercase;letter-spacing:.04em}
.newsmeta{font-size:var(--text-micro);color:var(--color-text-hint);margin-top:6px}
.news-grid{display:grid;gap:12px;margin-bottom:16px}
/* flex sloupec (ne display:block): <button> jinak obsah vertikálně centruje – karta bez fotky
   má začínat odshora; zároveň drží patičku „Celá novinka" u spodní hrany karty */
.newscard{display:flex;flex-direction:column;align-items:stretch;width:100%;text-align:left;background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-lg);overflow:hidden;cursor:pointer;font-family:var(--font-sans);padding:0}
.newscard.urgent{border-color:var(--edge-danger)}
.nc-hero{height:120px;flex:none;display:flex;align-items:center;justify-content:center;font-size:var(--text-note);color:rgba(31,42,46,.38)}
.nc-body{padding:12px 14px;display:flex;flex-direction:column;align-items:flex-start;flex:1;min-height:0;width:100%}
.nc-t{font-family:var(--font-serif);font-size:var(--text-action);font-weight:600;color:var(--color-primary-strong);line-height:var(--leading-snug)}
.nc-x{font-size:var(--text-small);color:var(--color-text);line-height:var(--leading-normal);margin:8px 0 12px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
/* patička karty – tenká linka + odkaz dole (vzor .cardlink z Docházky) */
.nc-foot{margin-top:auto;width:100%;padding-top:11px;border-top:1px solid var(--color-border);font-size:var(--text-small);font-weight:600;color:var(--color-primary)}
.nc-actions{display:flex;align-items:center;justify-content:space-between;gap:10px}
.wabtn{font-size:var(--text-meta);font-weight:600;color:var(--color-primary);border:1px solid var(--color-primary);border-radius:var(--radius-sm);padding:6px 11px;text-decoration:none;background:var(--color-surface)}
.nd-hero{height:170px;border-radius:var(--radius-lg);display:flex;align-items:center;justify-content:center;font-size:var(--text-note);color:rgba(31,42,46,.38);margin-bottom:11px;overflow:hidden}
.nd-t{font-family:var(--font-serif);font-size:var(--text-title);font-weight:600;color:var(--color-primary-strong);line-height:var(--leading-snug)}
.nd-p{font-size:var(--text-small);line-height:var(--leading-relaxed);color:var(--color-text);margin:0 0 10px}
.nd-p:last-child{margin-bottom:0}
@media (min-width:900px){.news-grid{grid-template-columns:repeat(2,1fr);gap:16px}}
@media (min-width:1200px){.news-grid{grid-template-columns:repeat(3,1fr)}}

/* Hover feedback – jen na zařízeních s myší (dotyk nezasažen). Doplněno v revizi ui-ux-pro-max. */
@media (hover:hover){
  .filters button:hover:not(.on){color:var(--color-primary)}
  a,button{transition:background-color .15s ease,color .15s ease,border-color .15s ease,filter .15s ease}
  /* navigace (drawer i admin sidebar) */
  .ditem:hover:not(.on),.sb-item:hover:not(.on){background:var(--wash-primary)}
  /* plné (primární) akce – jemné projasnění */
  .btn-primary:hover,.omluvbtn:hover,.addbig:hover,.savebtn:hover,.odbtn:hover,.fondbtn:hover,.btn-s.primary:hover,.omcheck:hover{filter:brightness(1.08)}
  /* ghost / outline / segment tlačítka – jemný tint */
  .cbtn:hover,.addbtn:hover,.bulktoggle:hover,.omx:hover,.switch button:hover:not(.on),.mini button:hover:not(.on),.temanav button:hover:not(.on),.kids button:hover:not(.on),.choices button:hover{background:var(--wash-primary);border-color:var(--color-primary)}
  /* klikací karty / řádky – zvýraznění povrchu */
  button.tile:hover,.akce:hover,.newsrow:hover,.kbtn:hover,.prehl-abs:hover,.stepper button:hover:not(:disabled),.dh-step:hover{background:var(--color-surface-2)}
  /* textové odkazy */
  .clink:hover,.newsmore:hover,.cardlink:hover,.tlabbtn:hover{text-decoration:underline}
}
/* Řádek jídelníčku (druh jídla · název · alergie). Sdílené – rodič jídelníček čte,
   průvodce podle něj chystá svačiny. Dřív žilo jen v screens-rodic.css. */
.mrow{display:flex;gap:var(--space-sm);align-items:baseline;padding:6px 0;border-top:1px solid var(--color-border);font-size:var(--text-small)}
.mrow:first-of-type{border-top:none;padding-top:0}
.mk2{font-size:var(--text-chip);color:var(--color-text-muted);min-width:72px;flex-shrink:0;text-transform:uppercase;letter-spacing:.03em}
.mv{flex:1}
/* Listovadlo (‹ popisek ›) – sdílené. Rodič ho má u docházky, jídelníčku, plánu i novinek,
   průvodce u jídelníčku. Dřív žilo jen v screens-rodic.css a v průvodcovské se rozpadlo
   na 8×20 px, protože se ten soubor nenačítá. */
.dh-nav{position:relative;display:flex;gap:6px;align-items:center;flex-shrink:0;flex-wrap:nowrap}
.dh-step{min-width:44px;min-height:44px;border:1px solid var(--color-border-strong);background:var(--color-surface);border-radius:var(--radius-md);font-size:var(--text-title);color:var(--color-primary);cursor:pointer}
.dh-step:disabled{color:var(--color-text-hint);cursor:default}
.dh-lbl{font-family:var(--font-serif);font-size:var(--text-action);color:var(--color-primary-strong);padding:0 6px;white-space:nowrap}
/* listovadlo na řádku s H1 v topbaru – přisazené doprava */
.plan-head-nav{margin-left:auto}
.plan-head-nav .dh-lbl{min-width:130px;text-align:center}

/* Napodobenina Google Kalendáře – sdílený kalendář školky, stejný v rodičovské i
   průvodcovské appce. Barvy a kompaktní rozměry jsou záměrná kopie Googlu, nesahat. */
.gcalwrap{background:#fff;border:1px solid rgba(60,64,67,.12);border-radius:var(--radius-md);padding:14px 10px}
.gcalhd{font-size:var(--text-title);font-weight:600;color:#3c4043;margin:0 4px 12px}
.gcal{display:grid;grid-template-columns:repeat(7,1fr);gap:1px}
.gh{font-size:var(--text-chip);color:#70757a;text-align:center;font-weight:500;padding:2px 0;letter-spacing:.03em}
.gcell{min-height:42px;display:flex;flex-direction:column;align-items:center;padding-top:3px;cursor:pointer;border-radius:var(--radius-sm)}
.gcell.gsel{background:#e8f0fe}
.gn{font-size:var(--text-note);color:#3c4043;width:24px;height:24px;display:flex;align-items:center;justify-content:center;border-radius:50%}
.gcell.gwe .gn{color:#9aa0a6}
.gcell.gtoday .gn{background:#1a73e8;color:#fff;font-weight:500}
.gbars{display:flex;flex-direction:column;gap:2px;width:100%;padding:2px 4px 0;align-items:stretch}
.gbar{height:3px;border-radius:2px}
.gbar.g-akce,.gvbar.g-akce{background:#33b679}
.gbar.g-naro,.gvbar.g-naro{background:#e67c73}
.gbar.g-rozvrh,.gvbar.g-rozvrh{background:#039be5}
.gbar.g-org,.gvbar.g-org{background:#8e24aa}
.gday{font-size:var(--text-body);font-weight:600;color:#3c4043;margin:14px 4px 8px}
.gev{display:flex;align-items:center;gap:11px;padding:9px 4px;font-size:var(--text-small);color:#3c4043;border-top:1px solid #f1f3f4}
.gev:first-of-type{border-top:none}
.gvbar{width:4px;height:18px;border-radius:2px;flex-shrink:0}
.gevt{margin-left:auto;color:#70757a;font-size:var(--text-micro)}
.gnone{font-size:var(--text-meta);color:#9aa0a6;font-style:italic;padding:8px 4px}
.gcalnav{display:flex;justify-content:space-between;align-items:center;margin:0 2px 12px}
.gstep{display:flex;align-items:center;gap:2px}
.gstep button{border:none;background:none;color:#5f6368;font-size:var(--text-title);cursor:pointer;padding:2px 8px;line-height:1}
.gstep .gmo{font-size:var(--text-heading);font-weight:600;color:#3c4043;min-width:64px;text-align:center;text-transform:capitalize}
.gstep .gyr{font-size:var(--text-heading);font-weight:600;color:#3c4043;min-width:42px;text-align:center}
.gcell.gempty{cursor:default;background:transparent}
@media (min-width:900px){
  /* Kalendář: mřížka vlevo, vybraný den vpravo – uvnitř bílého .gcalwrap */
  .kal-wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,300px);gap:20px;align-items:start}
  .kal-main{min-width:0}
  .kal-side{min-width:0;border-left:1px solid #f1f3f4;padding-left:18px}
  .kal-side .gday{margin-top:0}
}

/* Soupis dětí. Karty se dobře trefují prstem, ale na desktopu z 25 dětí udělají dva
   dlouhé sloupce – tam je čitelnější tabulka. Obojí je v DOM a přepíná se tady;
   appka nemá listener na resize, takže větvit v JS by při změně šířky nechalo starý výpis. */
.dtab{display:none}
@media (min-width:900px){
  #content > .deti,#content > .akce{column-span:all}
  .deti-cards,.akce-cards{display:none}
  .dtab{display:table;width:100%;border-collapse:collapse;background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-lg);overflow:hidden}
  .dtab thead th{text-align:left;padding:0;background:var(--color-surface-2);border-bottom:1px solid var(--color-border)}
  /* hlavička je tlačítko na řazení – šipka drží místo i když je sloupec neaktivní */
  .dtab thead th button{width:100%;display:flex;align-items:center;gap:5px;min-height:38px;padding:0 14px;border:none;background:none;cursor:pointer;
    font-family:var(--font-sans);font-size:var(--text-micro);text-transform:uppercase;letter-spacing:.04em;color:var(--color-text-muted);font-weight:600;text-align:left}
  .dtab thead th button:hover{color:var(--color-primary)}
  .dtab thead th.srt button{color:var(--color-primary-strong)}
  /* Indikátor řazení. 8 px byl pod hranicí čitelnosti; --text-note s muted barvou drží
     4,7:1 proti pozadí hlavičky (hint měl jen 3,4:1). Neaktivní ⇅ je pořád vidět, aby bylo
     poznat, že sloupec jde seřadit – jen se nepere s popiskem. */
  .dtab .arw{font-size:var(--text-note);line-height:1;min-width:11px;color:var(--color-text-muted)}
  .dtab thead th.srt .arw{color:var(--color-primary)}
  .dtab thead th button:hover .arw{color:var(--color-primary)}
  .dtab td{padding:11px 14px;font-size:var(--text-small);color:var(--color-text);border-top:1px solid var(--color-border)}
  .dtab tbody tr{cursor:pointer}
  .dtab tbody tr:first-child td{border-top:none}
  .dtab tbody tr:hover{background:var(--wash-primary)}
  .dtab td.nm{font-weight:500;white-space:nowrap;color:var(--color-primary-strong)}
  .dtab td.nm .av{vertical-align:middle;margin-right:9px}
  .dt-no{color:var(--color-text-hint)}
  /* akce: datum úzké a nezalomené, poznámka bere zbytek – jako jediná se láme na víc řádků */
  .akce-tab td.dt-date{white-space:nowrap;color:var(--color-primary);font-weight:600;width:1%}
  .akce-tab td.dt-note{color:var(--color-text-muted);font-size:var(--text-meta);line-height:var(--leading-snug)}
  .akce-tab td.nm{white-space:normal}
  .akce-tab td.dt-fond{white-space:nowrap}
  #content > .akce>.addbtn{max-width:340px}
}
/* Lišta nad soupisem: hledání + stažení. Do pole se píše jen jméno, takže nepotřebuje
   celou šířku – uvolněné místo zabere tlačítko. Na úzkém displeji se zalomí pod pole. */
.deti-bar{display:flex;flex-wrap:wrap;align-items:center;gap:var(--space-sm);margin-bottom:9px}
.deti-bar .search{flex:1 1 200px;margin-bottom:0}
.deti-exp{flex:0 0 auto;margin-left:auto;min-height:44px;padding:0 14px;font-size:var(--text-small);white-space:nowrap}
@media (min-width:900px){ .deti-bar .search{flex:0 1 320px} }
</style>
<style>
/* SCREENS: ADMIN – obrazovkové styly (dashboard vedení). Skládá z existujících komponent
   (.tile, .tlab, .bdg, .note2); nové jen tam, kde není co znovupoužít. */

.dash-head{font-size:var(--text-small);color:var(--color-text-muted);margin:0 2px 14px}

/* placeholder pro sekce mimo 3.1 */
.ph-tile{text-align:center;padding:40px 20px}
.ph-ic{font-size:var(--text-number-lg);margin-bottom:10px}
.ph-t{font-family:var(--font-serif);font-size:var(--text-title);color:var(--color-primary-strong);margin-bottom:4px}
.ph-d{font-size:var(--text-small);color:var(--color-text-muted)}

/* (a) kapacity */
.caps{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
.cap-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.cap-nm{font-family:var(--font-serif);font-size:var(--text-action);color:var(--color-primary-strong)}
.cap-n{font-size:var(--text-small);color:var(--color-text-muted);font-weight:600}
.cap-n.is-full{color:var(--color-accent-ink)}
.cap-bar{height:8px;background:var(--color-surface-2);border-radius:var(--radius-full);overflow:hidden}
.cap-fill{display:block;height:100%;background:var(--color-primary);border-radius:var(--radius-full)}
.cap-fill.is-full{background:var(--color-accent)}
.cap-sub{font-size:var(--text-micro);color:var(--color-text-muted);margin-top:6px;line-height:var(--leading-normal)}

/* (b) platby */
.pay-row{display:flex;align-items:center;gap:12px;padding:9px 0;border-top:1px solid var(--color-border)}
.pay-row:first-of-type{border-top:none}
.pay-main{flex:1;min-width:0}
.pay-nm{font-size:var(--text-body);font-weight:600;color:var(--color-text)}
.pay-sk{font-weight:400;color:var(--color-text-muted)}
.pay-sub{font-size:var(--text-note);color:var(--color-text-muted);margin-top:2px}
.pay-right{display:flex;align-items:center;gap:10px;flex-shrink:0}
.pay-amt{font-family:var(--font-serif);font-size:var(--text-action);color:var(--color-primary-strong)}

/* badge varianty stavů platby (základ .bdg + .al v components.css) */
.bdg.ne{color:var(--state-danger-ink);background:var(--state-danger-bg)}
.bdg.part{color:var(--state-warn-ink);background:var(--state-warn-bg)}
.bdg.wait{color:var(--state-info-ink);background:var(--state-info-bg)}

/* (c) upozornění */
.al-row{display:flex;gap:9px;align-items:flex-start;padding:7px 0;font-size:var(--text-small);color:var(--color-text);line-height:var(--leading-normal)}
.al-ic{flex-shrink:0;width:18px;text-align:center}
.al-sk{color:var(--color-text-muted)}
.al-data .al-ic{color:var(--color-accent-ink)}
.al-provoz .al-ic{color:var(--color-info)}
.al-system .al-ic{color:var(--color-success)}

/* (d) náhrady souhrn + (f) proklikové dlaždice */
.dash-link{display:block;width:100%;text-align:left;cursor:pointer;font-family:var(--font-sans)}
.dl-arr{float:right;color:var(--color-primary);font-weight:600}
.nh-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:4px}
.nh-cell{text-align:center;background:var(--color-surface-2);border-radius:var(--radius-md);padding:12px 6px}
.nh-num{font-family:var(--font-serif);font-weight:600;font-size:var(--text-number);color:var(--color-primary-strong);line-height:1}
.nh-num.warn{color:var(--color-accent-ink)}
.nh-lab{font-size:var(--text-micro);color:var(--color-text-muted);margin-top:5px}

/* (e) úkoly */
.tl-count{float:right;color:var(--color-text-muted);font-weight:600;letter-spacing:0;text-transform:none}
.task{display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:none;border:none;border-top:1px solid var(--color-border);padding:10px 0;cursor:pointer;font-family:var(--font-sans);font-size:var(--text-body);color:var(--color-text)}
.task:first-of-type{border-top:none}
.task-box{flex-shrink:0;width:22px;height:22px;border-radius:var(--radius-xs);border:1.5px solid var(--color-border-strong);background:var(--color-surface-2);display:flex;align-items:center;justify-content:center;font-size:var(--text-note);color:#fff}
.task.done .task-box{background:var(--color-primary);border-color:var(--color-primary)}
.task.done .task-t{color:var(--color-text-hint);text-decoration:line-through}

/* (f) porady řádky */
.por-row{display:flex;align-items:baseline;gap:11px;padding:8px 0;border-top:1px solid var(--color-border)}
.por-row:first-of-type{border-top:none}
.por-d{font-size:var(--text-meta);color:var(--color-text-muted);min-width:74px;flex-shrink:0}
.por-t{flex:1;font-size:var(--text-body);color:var(--color-text)}
.por-sk{color:var(--color-text-muted)}
.por-typ{font-size:var(--text-chip);font-weight:600;padding:2px 8px;border-radius:var(--radius-xs);flex-shrink:0}
.por-typ.porada{color:var(--color-primary);background:var(--soft-primary)}
.por-typ.evaluace{color:var(--color-accent-ink);background:var(--soft-accent)}

/* badge varianty stavů aktuality (základ .bdg z components.css) */
.bdg.sent{color:var(--state-brand-ink);background:var(--state-brand-bg)}
.bdg.arch{color:var(--state-muted-ink);background:var(--state-muted-bg)}

/* aktuality – seznam */
.ak-item{padding:14px 16px}
.ak-top{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.ak-date{margin-left:auto;font-size:var(--text-meta);color:var(--color-text-muted)}
.ak-txt{font-size:var(--text-body);color:var(--color-text);line-height:var(--leading-normal)}
.ak-empty{color:var(--color-text-hint);font-style:italic}
.ak-rec{font-size:var(--text-meta);color:var(--color-text-muted);margin-top:9px;line-height:var(--leading-normal)}
.ak-rlab{color:var(--color-text);font-weight:600}
.ak-norec{color:var(--color-danger)}
.ak-acts{display:flex;gap:8px;align-items:center;margin-top:12px}
.ak-hint,.ak-acts .ak-hint{font-size:var(--text-meta);color:var(--color-text-muted);font-style:italic}
.btn-s{border:1px solid var(--color-border-strong);background:var(--color-surface);font-family:var(--font-sans);font-size:var(--text-small);font-weight:500;color:var(--color-text);padding:8px 16px;border-radius:var(--radius-sm);cursor:pointer}
.btn-s.primary{background:var(--color-primary);border-color:var(--color-primary);color:var(--color-on-primary)}
.btn-s:disabled{opacity:.4;cursor:not-allowed}

/* aktuality – formulář */
.rec-sk{margin-bottom:11px}
.rec-sk:last-child{margin-bottom:0}
.rec-nm{font-size:var(--text-small);font-weight:600;color:var(--color-primary-strong);margin-bottom:6px}
.rec-fam{font-weight:400;color:var(--color-text-muted);font-size:var(--text-micro)}
.ak-preview{margin-top:4px}
.ak-preview b{color:var(--color-primary)}
.ak-warn{font-size:var(--text-small);color:var(--color-danger);background:var(--wash-danger);border:1px solid var(--edge-danger);border-radius:var(--radius-md);padding:10px 12px;line-height:var(--leading-normal)}
.btn-primary:disabled{opacity:.45;cursor:not-allowed}

/* porady – štítek chip */
.stitek{display:inline-block;font-size:var(--text-micro);font-weight:500;color:var(--color-text-muted);background:var(--color-surface-2);border:1px solid var(--color-border);padding:2px 9px;border-radius:var(--radius-full);margin:0 5px 5px 0}
.stitek.hi{color:var(--color-primary);background:var(--soft-primary);border-color:var(--edge-primary);font-weight:600}
.za-tags{margin-top:9px}

/* porady – seznam zápisů */
.za-item{display:block;width:100%;text-align:left;cursor:pointer;font-family:var(--font-sans)}
.za-sk{font-size:var(--text-meta);color:var(--color-text-muted)}
.za-nz{font-family:var(--font-serif);font-size:var(--text-heading);color:var(--color-primary-strong);margin-top:8px}
.za-nz-lg{font-size:var(--text-title)}
.za-ucast{font-size:var(--text-meta);color:var(--color-text-muted);margin-top:4px}

/* porady – detail odstavce */
.odst{border-top:1px solid var(--color-border);padding:13px 0}
.odst:first-of-type{border-top:none;margin-top:10px}
.odst-tx{font-size:var(--text-body);color:var(--color-text);line-height:var(--leading-relaxed)}
.odst-chips{margin-top:9px}
.odst-chips button{font-size:var(--text-micro);padding:5px 10px}

/* porady – filtrovaný výpis */
.vypis-head{margin:2px 2px 12px}
.vh-t{font-family:var(--font-serif);font-size:var(--text-title);color:var(--color-primary-strong)}
.vh-s{font-size:var(--text-meta);color:var(--color-text-muted);margin-top:2px}
.vy-item .vy-nz{font-family:var(--font-serif);font-size:var(--text-body);color:var(--color-primary);margin:6px 0 6px}
.vy-link{background:none;border:none;color:var(--color-primary);font-weight:600;font-size:var(--text-meta);font-family:var(--font-sans);cursor:pointer;padding:8px 0 0}

.print-only{display:none}

@media(max-width:720px){
  .caps,.nh-grid{grid-template-columns:1fr}
}

/* tisk / PDF export výpisu – skryje shell a ovládací prvky, nechá jen obsah */
@media print{
  .sidebar,.topbar-a,.switch,.no-print,.toast{display:none!important}
  .print-only{display:block}
  .admin{display:block}
  .main{display:block}
  .content-wrap{padding:0}
  .content-wrap #content{max-width:100%}
  .tile{border-color:#ccc;box-shadow:none;break-inside:avoid}
  .vypis-head{margin-bottom:16px}
  body{background:#fff}
}
</style>

/* === brand blok === */
/* rodič + průvodce: .drawer .dh */
.drawer{padding-top:0}
.drawer .dh{
  background:linear-gradient(rgba(239,238,233,.48),rgba(239,238,233,.7)),var(--wc-brand) center/cover no-repeat;
  padding:18px 20px;border-bottom:none;margin-bottom:10px;
}
.drawer .brand-mark{width:56px;height:56px}
.drawer .brand-txt{color:#141414;font-size:var(--text-display);font-weight:800;line-height:var(--leading-tight)}
/* admin: .sidebar .sb-brand */
.sidebar{padding-top:0}
.sidebar .sb-brand{
  background:linear-gradient(rgba(239,238,233,.48),rgba(239,238,233,.7)),var(--wc-brand) center/cover no-repeat;
  padding:18px 22px;border-bottom:none;margin-bottom:10px;
}
.sidebar .brand-mark{width:56px;height:56px}
.sidebar .brand-txt{color:#141414;font-size:var(--text-display);font-weight:800;line-height:var(--leading-tight)}

/* === jemný wash u patičky (odspoda nahoru) === */
/* rodič + průvodce – wash na .screen (ne .scroll): .scroll má na desktopu
   max-width:1060px a je vycentrovaný, takže wash na něm by na širokém okně
   měl ostrý viditelný okraj místo splynutí s pozadím přes celou šířku. */
.screen{position:relative}
.screen::after{content:"";position:absolute;left:0;right:0;bottom:0;height:210px;
  background:var(--wc-band) center bottom/cover no-repeat;opacity:.36;

  pointer-events:none;z-index:0}
.scroll{position:relative}
.scroll>#content,.scroll>.appfoot{position:relative;z-index:1}
.scroll>.topbar{position:relative;z-index:5}   /* nad obsahem, ať rozbalené menu/kalendář v hlavičce nezmizí pod kartami */

.main{position:relative}
.main::after{content:"";position:absolute;left:0;right:0;bottom:0;height:210px;
  background:var(--wc-band) center bottom/cover no-repeat;opacity:.36;

          mask-image:linear-gradient(to top,#000 0,#000 18%,transparent 100%);
  pointer-events:none;z-index:0}
.main>.content-wrap,.main>.appfoot{position:relative;z-index:1}
.main>.topbar-a{position:relative;z-index:5}
</style>

// text pro PDF stream musí být čisté ASCII – Helvetica nezná diakritiku a hlavně:
// byte-offsety v xref se počítají z délky řetězce, takže vícebajtový znak by je rozhodil.
const pdfAscii=s=>(s||'').replace(/[    ]/g,' ').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^\x20-\x7e]/g,'-').replace(/[()\\]/g,' ');
function makePDF(title,lines){
  const body=[[title,22]].concat((lines||['Demo dokument - Lesni skolka Vhaaji']).map(l=>[l,12]));
  let stream='BT 60 780 Td';
  body.forEach(([txt,sz],i)=>{stream+=` /F1 ${sz} Tf${i?' 0 -28 Td':''} (${pdfAscii(txt)}) Tj`;});
  stream+=' ET';
  const objs=[
    '<</Type/Catalog/Pages 2 0 R>>',
    '<</Type/Pages/Kids[3 0 R]/Count 1>>',
    '<</Type/Page/Parent 2 0 R/MediaBox[0 0 595 842]/Resources<</Font<</F1 5 0 R>>>>/Contents 4 0 R>>',
    `<</Length ${stream.length}>>\nstream\n${stream}\nendstream`,
    '<</Type/Font/Subtype/Type1/BaseFont/Helvetica>>',
  ];
  let pdf='%PDF-1.4\n';const off=[];
  objs.forEach((o,i)=>{off.push(pdf.length);pdf+=`${i+1} 0 obj\n${o}\nendobj\n`;});
  const xref=pdf.length;
  pdf+=`xref\n0 ${objs.length+1}\n0000000000 65535 f \n`;
  off.forEach(o=>{pdf+=String(o).padStart(10,'0')+' 00000 n \n';});
  pdf+=`trailer\n<</Size ${objs.length+1}/Root 1 0 R>>\nstartxref\n${xref}\n%%EOF`;
  return pdf;
}

/* Vrátí jídelníček dne (5 položek: svačinky/polévka/hlavní) podle dne v měsíci, nebo null,
   pokud pro daný den (víkend, nebo mimo dodané 4 týdny – 27.–30. 6.) žádný není. */
function jidelnicekTyden(den,m){m=m||6;return JIDELNICEK.find(t=>t.m===m&&den>=t.od&&den<=t.do);}
/* Index týdne v JIDELNICEK – appky si podle něj nastaví výchozí (aktuální) týden.
   Nehardkódovat 0: před červnem leží květnová historie, takže 0 je nejstarší týden. */
function jidIndex(den,m){m=m||6;return Math.max(0,JIDELNICEK.findIndex(t=>t.m===m&&den>=t.od&&den<=t.do));}
/* Popisek týdne „18.–22. 5." – měsíc bere z dat, ne natvrdo. */
function jidTydenLabel(t){return `${t.od}.–${t.do}. ${t.m}.`;}
function jidelnicekDen(den,m){const t=jidelnicekTyden(den,m);return t?t.dny[wd(den)]:null;}
/* Alergeny dle přílohy vyhlášky (jen ty, které se v jídelníčku Vhaaji reálně objevují). */
const ALERGENY_NAZVY={1:'lepek',4:'ryby',5:'arašídy',6:'sója',7:'mléko',8:'skořápkové plody',9:'celer'};
function alergenyZDne(dny){
  const s=new Set();
  dny.forEach(it=>{if(it[2])it[2].split(',').forEach(c=>{c=c.trim();if(c)s.add(Number(c));});});
  return [...s].sort((a,b)=>a-b);
}
function alergenyLegenda(dny){
  const cisla=alergenyZDne(dny);
  if(!cisla.length)return '';
  return `<div class="alerg-legend">Alergeny: `+cisla.map(c=>`<b>${c}</b> ${ALERGENY_NAZVY[c]||''}`).join(', ')+`</div>`;
}

function stahniCSV(soubor,hlavicky,radky){
  const bunka=v=>{v=String(v??'');return /[";\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;};
  const csv='\uFEFF'+[hlavicky,...radky].map(r=>r.map(bunka).join(';')).join('\r\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
  a.download=soubor;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function pocetDeti(n){return n+' '+(n===1?'dítě':(n>=2&&n<=4?'děti':'dětí'));}

<script>
/* SCREEN: ADMIN_PREHLED – dashboard vedení (BRIEF kap. 1):
   kapacity školek, chybějící platby, systémová upozornění, souhrn náhrad,
   provozní úkoly, poslední porady/evaluace. */
function renderPrehled(){
  let h=`<div class="dash-head">${DOW[wd(TODAYD)]} ${TODAYD}. června 2026 · přehled všech školek</div>`;

  // (a) kapacity školek – obsazeno / kapacita, vizuální pruh; u jednoskupinové školky
  // se rozpis tříd neduplikuje
  h+=`<div class="tile"><div class="ch">Kapacity školek</div><div class="caps">`;
  SKOLKY.forEach(s=>{
    const obs=obsazeno(s), pct=Math.round(obs/s.kapacita*100), full=obs>=s.kapacita;
    const tridy=s.tridy.length>1?s.tridy.map(t=>`${t.n} ${t.obs}/${t.kap}`).join(' · '):'';
    h+=`<div class="cap">`
      +`<div class="cap-top"><span class="cap-nm">${s.nazev}</span><span class="cap-n ${full?'is-full':''}">${obs}/${s.kapacita}${full?' · plno':''}</span></div>`
      +`<div class="cap-bar"><span class="cap-fill ${full?'is-full':''}" style="width:${pct}%"></span></div>`
      +(tridy?`<div class="cap-sub">${tridy}</div>`:'')
      +`</div>`;
  });
  h+=`</div></div>`;

  // (b) chybějící platby – kdo, částka, po splatnosti (badge stavů); řeší se mimo appku
  h+=`<div class="tile"><div class="ch">Chybějící platby</div>`;
  PLATBY.forEach(p=>{
    const st=PLATBASTAVY[p.stav];
    const dodat=p.stav==='po-splatnosti'?`po splatnosti ${p.poDnu} dní`
      :p.stav==='castecne'?`uhrazeno ${kc(p.uhrazeno)} z ${kc(p.castka)} Kč`
      :p.stav==='ceka'?'platba přišla, čeká na spárování':`splatnost prošla před ${p.poDnu} dny`;
    h+=`<div class="pay-row"><div class="pay-main"><div class="pay-nm">${p.dite} <span class="pay-sk">· ${p.skolka}</span></div>`
      +`<div class="pay-sub">${p.obdobi} – ${dodat}</div></div>`
      +`<div class="pay-right"><span class="pay-amt">${kc(p.castka)} Kč</span><span class="bdg ${st.cls}">${st.lab}</span></div></div>`;
  });
  h+=`<div class="note2">Fakturaci školka řeší mimo appku – zde jen přehled.</div></div>`;

  // (c) systémová upozornění vč. chybějících dat
  h+=`<div class="tile"><div class="ch">Systémová upozornění</div>`;
  UPOZORNENI.forEach(u=>{
    const ic=u.typ==='data'?'⚠':u.typ==='provoz'?'●':'✓';
    h+=`<div class="al-row al-${u.typ}"><span class="al-ic">${ic}</span><span class="al-tx">${u.text}${u.skolka?` <span class="al-sk">· ${u.skolka}</span>`:''}</span></div>`;
  });
  h+=`</div>`;

  // (d) souhrn náhrad – dostupné celkem, kolik brzy expiruje, naplánované
  h+=`<button class="tile dash-link" onclick="go('nahrady')"><div class="ch" style="margin:0">Náhrady <span class="dl-arr">›</span></div>`
    +`<div class="nh-grid">`
    +`<div class="nh-cell"><div class="nh-num">${NAHRADY_SUM.dostupne}</div><div class="nh-lab">dostupných</div></div>`
    +`<div class="nh-cell"><div class="nh-num warn">${NAHRADY_SUM.expiruje}</div><div class="nh-lab">propadne 30. 6. (konec šk. roku)</div></div>`
    +`<div class="nh-cell"><div class="nh-num">${NAHRADY_SUM.naplanovane}</div><div class="nh-lab">naplánovaných</div></div>`
    +`</div></button>`;

  // (e) provozní úkoly – checklist, odškrtávání v paměti
  const hotovo=UKOLY.filter(u=>u.done).length;
  h+=`<div class="tile"><div class="ch">Provozní úkoly <span class="tl-count">${hotovo}/${UKOLY.length}</span></div>`;
  UKOLY.forEach((u,i)=>{
    h+=`<button class="task ${u.done?'done':''}" onclick="toggleUkol(${i})"><span class="task-box">${u.done?'✓':''}</span><span class="task-t">${u.t}</span></button>`;
  });
  h+=`</div>`;

  // (f) poslední porady / evaluace – titulky (odvozené ze ZAPISY), proklik do sekce porad
  h+=`<button class="tile dash-link" onclick="go('porady')"><div class="ch" style="margin:0">Poslední porady a evaluace <span class="dl-arr">›</span></div>`;
  ZAPISY.slice().sort((a,b)=>b.dt-a.dt).slice(0,3).forEach(p=>{
    h+=`<div class="por-row"><span class="por-d">${p.datum}</span><span class="por-t">${p.nazev}<span class="por-sk"> · ${p.skolka}</span></span><span class="por-typ ${p.typ}">${p.typ==='porada'?'porada':'evaluace'}</span></div>`;
  });
  h+=`</button>`;

  return h;
}
const kc=n=>String(n).replace(/\B(?=(\d{3})+(?!\d))/g,' ');
window.toggleUkol=i=>{UKOLY[i].done=!UKOLY[i].done;render();};
</script>
<script>
/* SCREEN: ADMIN_AKTUALITY – Flow 4: vedení vytváří aktualitu, kterou NELZE odeslat
   bez určení příjemců; u odeslaných vidí, komu odešla. */

let akView='list';   // 'list' | 'new'
let formA=null;      // rozpracovaná aktualita {text,urgent,recip}
let akEditId=null;   // id upravovaného konceptu (null = nová)

function renderAktuality(){
  return akView==='new'?renderAkForm():renderAkList();
}

function renderAkList(){
  let h="";  // akce „+ Nová novinka" je v topbaru (core.js TOPACT)
  // pořadí: koncepty a naplánované nahoře, pak odeslané, pak archivované
  const order={koncept:0,naplanovana:1,odeslana:2,archivovana:3};
  const items=AKTUALITY.slice().sort((a,b)=>order[a.stav]-order[b.stav]);
  items.forEach(a=>{
    const st=AKSTAV[a.stav];
    h+=`<div class="tile ak-item">`;
    h+=`<div class="ak-top"><span class="bdg ${st.cls}">${st.lab}</span>`
      +(a.urgent?`<span class="bdg al">Důležité</span>`:``)
      +(a.datum?`<span class="ak-date">${a.datum}</span>`:``)+`</div>`;
    h+=`<div class="ak-txt">${escTa(a.text)||'<span class="ak-empty">(bez textu)</span>'}</div>`;
    // příjemci
    const rec=recipText(a.recip);
    if(rec.length){
      h+=`<div class="ak-rec"><span class="ak-rlab">Příjemci:</span> ${rec.map(escTa).join(' · ')}</div>`;
    }else if(a.stav==='koncept'){
      h+=`<div class="ak-rec ak-norec">Bez určených příjemců – před odesláním je nutné je vybrat.</div>`;
    }
    // akce dle stavu
    h+=`<div class="ak-acts">`;
    if(a.stav==='koncept'){
      h+=`<button class="btn-s" onclick="akEdit('${a.id}')">Upravit</button>`;
      h+=hasRecip(a.recip)
        ? `<button class="btn-s primary" onclick="akSendId('${a.id}')">Odeslat</button>`
        : `<button class="btn-s primary" disabled title="Nejdřív vyberte příjemce">Odeslat</button>`;
    }else if(a.stav==='odeslana'){
      h+=`<button class="btn-s" onclick="akArchive('${a.id}')">Archivovat</button>`;
    }else if(a.stav==='naplanovana'){
      h+=`<span class="ak-hint">Odešle se automaticky v naplánovaný čas.</span>`;
    }
    h+=`</div></div>`;
  });
  return h;
}

function renderAkForm(){
  const f=formA, recip=f.recip;
  const rec=recipText(recip), ok=hasRecip(recip), textOk=f.text.trim().length>0;
  let h=`<button class="back" onclick="akCancel()">‹ Zpět na seznam</button>`;
  h+=`<div class="tile">`;
  h+=`<div class="field"><div class="l">Text novinky</div>`
    +`<textarea class="pta" id="akText" placeholder="Co chcete rodičům oznámit?">${escTa(f.text)}</textarea></div>`;
  // důležité
  h+=`<div class="field"><div class="l">Označení</div><div class="pchips">`
    +`<button class="${f.urgent?'on':''}" onclick="akToggleUrgent()">Důležité (urgentní)</button></div></div>`;
  // příjemci – povinné
  h+=`<div class="field"><div class="l">Příjemci · povinné</div>`;
  SKOLKY.forEach(s=>{
    const r=recip[s.id]||{all:false,tridy:[]};
    h+=`<div class="rec-sk"><div class="rec-nm">${s.nazev} <span class="rec-fam">${obsazeno(s)} rodin</span></div><div class="pchips">`;
    h+=`<button class="${r.all?'on':''}" onclick="akToggleAll('${s.id}')">Celá školka</button>`;
    // u školky s jedinou skupinou by chip třídy jen dubloval „Celá školka"
    if(s.tridy.length>1)s.tridy.forEach(t=>{
      const on=!r.all&&r.tridy.indexOf(t.n)>=0;
      h+=`<button class="${on?'on':''}" onclick="akToggleTrida('${s.id}','${t.n}')">${t.n} <span class="rec-fam">${t.obs}</span></button>`;
    });
    h+=`</div></div>`;
  });
  h+=`</div>`;
  // náhled příjemců
  if(ok){
    h+=`<div class="tile note-info ak-preview"><b>Odešle se rodičům:</b><br>${rec.map(escTa).join('<br>')}</div>`;
  }else{
    h+=`<div class="ak-warn">⚠ Bez určených příjemců nelze novinku odeslat – vyberte alespoň jednu školku nebo třídu.</div>`;
  }
  // tlačítka
  h+=`<div class="mbtns">`;
  h+=`<button class="btn-ghost" onclick="akSaveDraft()">Uložit koncept</button>`;
  const canSend=ok&&textOk;
  h+=canSend
    ? `<button class="btn-primary" onclick="akSend()">Odeslat</button>`
    : `<button class="btn-primary" disabled>Odeslat</button>`;
  h+=`</div>`;
  if(ok&&!textOk)h+=`<div class="ak-warn" style="margin-top:8px">Doplňte text novinky.</div>`;
  h+=`</div>`;
  return h;
}

// před každou akcí, která překreslí, uložíme rozepsaný text (render zničí textarea)
function akSyncText(){const el=document.getElementById('akText');if(el&&formA)formA.text=el.value;}

window.akNew=()=>{formA={text:'',urgent:false,recip:{}};akEditId=null;akView='new';render();};
window.akEdit=id=>{const a=AKTUALITY.find(x=>x.id===id);formA={text:a.text,urgent:a.urgent,recip:JSON.parse(JSON.stringify(a.recip||{}))};akEditId=id;akView='new';render();};
window.akCancel=()=>{akView='list';formA=null;akEditId=null;render();};

window.akToggleUrgent=()=>{akSyncText();formA.urgent=!formA.urgent;render();};
window.akToggleAll=sid=>{akSyncText();const r=formA.recip[sid]||(formA.recip[sid]={all:false,tridy:[]});r.all=!r.all;r.tridy=[];if(!r.all)delete formA.recip[sid];render();};
window.akToggleTrida=(sid,tn)=>{akSyncText();const r=formA.recip[sid]||(formA.recip[sid]={all:false,tridy:[]});r.all=false;const i=r.tridy.indexOf(tn);if(i>=0)r.tridy.splice(i,1);else r.tridy.push(tn);if(!r.tridy.length)delete formA.recip[sid];render();};

function akCommit(stav){
  const dt=`${TODAYD}. 6. 2026`;
  if(akEditId){
    const a=AKTUALITY.find(x=>x.id===akEditId);
    a.text=formA.text;a.urgent=formA.urgent;a.recip=formA.recip;a.stav=stav;
    if(stav==='odeslana')a.datum=dt;
  }else{
    AKTUALITY.unshift({id:'ak'+(akUid++),text:formA.text,urgent:formA.urgent,stav,datum:stav==='odeslana'?dt:'',recip:formA.recip});
  }
}
window.akSaveDraft=()=>{akSyncText();akCommit('koncept');akView='list';formA=null;akEditId=null;showToast('Koncept uložen');render();};
window.akSend=()=>{akSyncText();if(!hasRecip(formA.recip)||!formA.text.trim())return;akCommit('odeslana');akView='list';formA=null;akEditId=null;showToast('Novinka odeslána');render();};

// odeslání přímo ze seznamu (koncept s vybranými příjemci)
window.akSendId=id=>{const a=AKTUALITY.find(x=>x.id===id);if(!hasRecip(a.recip)||!a.text.trim())return;a.stav='odeslana';a.datum=`${TODAYD}. 6. 2026`;showToast('Novinka odeslána');render();};
window.akArchive=id=>{const a=AKTUALITY.find(x=>x.id===id);a.stav='archivovana';showToast('Novinka archivována');render();};
</script>
<script>
/* SCREEN: ADMIN_PORADY – Flow 5: vedení hledá podklady pro inspekci.
   Seznam zápisů (filtr školka/typ) · detail se štítky u odstavců ·
   filtrovaný výpis (štítek + období) napříč zápisy · export do tisku. */

let poView='zapisy';   // 'zapisy' | 'vypis'
let poOpen=null;       // id otevřeného zápisu (detail), null = seznam
let poNew=false;       // formulář nového zápisu
let fSkolka='vse', fTyp='vse';         // filtry seznamu
let vStitek='hygiena', vObdobi='vse';  // filtry výpisu
let newZ=null;         // {nazev,typ,skolka,text,stitky:[]}

function renderPorady(){
  if(poNew)return renderPoForm();
  if(poOpen)return renderPoDetail();
  let h=`<div class="switch">`
    +`<button class="${poView==='zapisy'?'on':''}" onclick="poGo('zapisy')">Zápisy</button>`
    +`<button class="${poView==='vypis'?'on':''}" onclick="poGo('vypis')">Výpis podle štítku</button></div>`;
  h+=poView==='vypis'?renderPoVypis():renderPoList();
  return h;
}

/* ---- seznam zápisů ---- */
function renderPoList(){
  let h="";  // akce „+ Nový zápis" je v topbaru (core.js TOPACT)
  // filtry
  h+=`<div class="filters no-print">`
    +chip('fSkolka','vse','Všechny školky',fSkolka)
    +SKOLKY.map(s=>chip('fSkolka',s.nazev,s.nazev,fSkolka)).join('')
    +`</div>`;
  h+=`<div class="filters no-print">`
    +chip('fTyp','vse','Vše',fTyp)+chip('fTyp','porada','Porady',fTyp)+chip('fTyp','evaluace','Evaluace',fTyp)
    +`</div>`;
  const list=ZAPISY.slice().sort((a,b)=>b.dt-a.dt)
    .filter(z=>(fSkolka==='vse'||z.skolka===fSkolka)&&(fTyp==='vse'||z.typ===fTyp));
  if(!list.length)h+=`<div class="tile"><div class="ph-d">Žádné zápisy pro zvolený filtr.</div></div>`;
  list.forEach(z=>{
    const tags=[...new Set(z.odstavce.flatMap(o=>o.stitky))];
    h+=`<button class="tile za-item" onclick="poShow('${z.id}')">`
      +`<div class="ak-top"><span class="por-typ ${z.typ}">${z.typ}</span><span class="za-sk">${z.skolka}</span><span class="ak-date">${z.datum}</span></div>`
      +`<div class="za-nz">${escTa(z.nazev)}</div>`
      +`<div class="za-tags">${tags.map(t=>`<span class="stitek">${t}</span>`).join('')}</div>`
      +`</button>`;
  });
  return h;
}

/* ---- detail zápisu ---- */
function renderPoDetail(){
  const z=ZAPISY.find(x=>x.id===poOpen);
  let h=`<button class="back no-print" onclick="poBack()">‹ Zpět na seznam</button>`;
  h+=`<div class="tile">`
    +`<div class="ak-top"><span class="por-typ ${z.typ}">${z.typ}</span><span class="za-sk">${z.skolka}</span><span class="ak-date">${z.datum}</span></div>`
    +`<div class="za-nz za-nz-lg">${escTa(z.nazev)}</div>`
    +`<div class="za-ucast">Účastníci: ${z.ucastnici.join(', ')}</div>`;
  z.odstavce.forEach((o,i)=>{
    h+=`<div class="odst"><div class="odst-tx">${escTa(o.text)}</div>`
      +`<div class="pchips odst-chips no-print">`
      +STITKY.map(t=>`<button class="${o.stitky.indexOf(t)>=0?'on':''}" onclick="poToggleStitek('${z.id}',${i},'${t}')">${t}</button>`).join('')
      +`</div>`
      // v tisku se místo přepínačů ukážou jen aktivní štítky
      +`<div class="za-tags print-only">${o.stitky.map(t=>`<span class="stitek">${t}</span>`).join('')}</div>`
      +`</div>`;
  });
  h+=`<div class="note2 no-print">Štítek u odstavce přidáte/odeberete klepnutím – takto se odstavce zpřístupní filtrovanému výpisu.</div>`;
  h+=`</div>`;
  return h;
}

/* ---- filtrovaný výpis (jádro Flow 5) ---- */
function renderPoVypis(){
  const ob=OBDOBI.find(o=>o.k===vObdobi);
  // posbírej odstavce s vybraným štítkem v období, napříč zápisy
  const hits=[];
  ZAPISY.slice().sort((a,b)=>b.dt-a.dt).forEach(z=>{
    if(z.dt<ob.from||z.dt>ob.to)return;
    z.odstavce.forEach(o=>{if(o.stitky.indexOf(vStitek)>=0)hits.push({z,o});});
  });
  let h=`<div class="filters no-print">`
    +STITKY.map(t=>chip('vStitek',t,t,vStitek)).join('')+`</div>`;
  h+=`<div class="filters no-print">`
    +OBDOBI.map(o=>chip('vObdobi',o.k,o.label,vObdobi)).join('')+`</div>`;
  // hlavička výpisu (užitečná i na papíře)
  h+=`<div class="vypis-head"><div class="vh-t">Výpis zápisů – štítek „${vStitek}"</div>`
    +`<div class="vh-s">${ob.label} · ${hits.length} ${hits.length===1?'odstavec':(hits.length>=2&&hits.length<=4?'odstavce':'odstavců')}</div></div>`;
  h+=`<button class="btn-s primary no-print" style="margin-bottom:12px" onclick="window.print()">Exportovat výpis (tisk / PDF)</button>`;
  if(!hits.length){
    h+=`<div class="tile"><div class="ph-d">Pro tento štítek a období nejsou žádné odstavce.</div></div>`;
    return h;
  }
  hits.forEach(({z,o})=>{
    h+=`<div class="tile vy-item"><div class="ak-top"><span class="por-typ ${z.typ}">${z.typ}</span><span class="za-sk">${z.skolka}</span><span class="ak-date">${z.datum}</span></div>`
      +`<div class="vy-nz">${escTa(z.nazev)}</div>`
      +`<div class="odst-tx">${escTa(o.text)}</div>`
      +`<div class="za-tags">${o.stitky.map(t=>`<span class="stitek ${t===vStitek?'hi':''}">${t}</span>`).join('')}</div>`
      +`<button class="vy-link no-print" onclick="poShow('${z.id}')">→ celý zápis</button></div>`;
  });
  return h;
}

/* ---- nový zápis (minimální: titulek + text + štítky) ---- */
function renderPoForm(){
  const f=newZ;
  let h=`<button class="back" onclick="poCancel()">‹ Zpět na seznam</button>`;
  h+=`<div class="tile">`
    +`<div class="field"><div class="l">Název zápisu</div><input class="pin" id="nzNazev" value="${esc(f.nazev)}" placeholder="Např. Provozní porada – červen"></div>`;
  h+=`<div class="field"><div class="l">Typ</div><div class="pchips">`
    +`<button class="${f.typ==='porada'?'on':''}" onclick="poFType('porada')">Porada</button>`
    +`<button class="${f.typ==='evaluace'?'on':''}" onclick="poFType('evaluace')">Evaluace</button></div></div>`;
  h+=`<div class="field"><div class="l">Školka</div><div class="pchips">`
    +SKOLKY.map(s=>`<button class="${f.skolka===s.nazev?'on':''}" onclick="poFSkolka('${s.nazev}')">${s.nazev}</button>`).join('')+`</div></div>`;
  h+=`<div class="field"><div class="l">Text</div><textarea class="pta" id="nzText" placeholder="Zápis z porady…">${escTa(f.text)}</textarea></div>`;
  h+=`<div class="field"><div class="l">Štítky</div><div class="pchips">`
    +STITKY.map(t=>`<button class="${f.stitky.indexOf(t)>=0?'on':''}" onclick="poFStitek('${t}')">${t}</button>`).join('')+`</div></div>`;
  const ok=f.nazev.trim()&&f.text.trim();
  h+=`<div class="mbtns"><button class="btn-ghost" onclick="poCancel()">Zrušit</button>`
    +(ok?`<button class="btn-primary" onclick="poSave()">Uložit zápis</button>`:`<button class="btn-primary" disabled>Uložit zápis</button>`)+`</div>`;
  if(!ok)h+=`<div class="note2">Vyplňte název a text zápisu.</div>`;
  h+=`</div>`;
  return h;
}

/* ---- helpery / handlery ---- */
function chip(varName,val,label,cur){return `<button class="${cur===val?'on':''}" onclick="poFilter('${varName}','${val}')">${label}</button>`;}

window.poGo=v=>{poView=v;render();};
window.poShow=id=>{poOpen=id;poNew=false;render();};
window.poBack=()=>{poOpen=null;render();};
window.poFilter=(v,val)=>{if(v==='fSkolka')fSkolka=val;else if(v==='fTyp')fTyp=val;else if(v==='vStitek')vStitek=val;else if(v==='vObdobi')vObdobi=val;render();};

// přidání/odebrání štítku odstavci v detailu
window.poToggleStitek=(zid,i,t)=>{const o=ZAPISY.find(z=>z.id===zid).odstavce[i];const k=o.stitky.indexOf(t);if(k>=0)o.stitky.splice(k,1);else o.stitky.push(t);render();};

// nový zápis
window.poNewZ=()=>{newZ={nazev:'',typ:'porada',skolka:SKOLKY[0].nazev,text:'',stitky:[]};poNew=true;render();};
function nzSync(){const n=document.getElementById('nzNazev'),t=document.getElementById('nzText');if(newZ){if(n)newZ.nazev=n.value;if(t)newZ.text=t.value;}}
window.poFType=v=>{nzSync();newZ.typ=v;render();};
window.poFSkolka=v=>{nzSync();newZ.skolka=v;render();};
window.poFStitek=t=>{nzSync();const k=newZ.stitky.indexOf(t);if(k>=0)newZ.stitky.splice(k,1);else newZ.stitky.push(t);render();};
window.poCancel=()=>{poNew=false;newZ=null;render();};
window.poSave=()=>{nzSync();if(!newZ.nazev.trim()||!newZ.text.trim())return;
  const d=TODAYD, dt=20260600+d, datum=`${d}. 6. 2026`;
  ZAPISY.unshift({id:'z'+(zapisUid++),dt,datum,typ:newZ.typ,skolka:newZ.skolka,nazev:newZ.nazev.trim(),ucastnici:['vedení'],odstavce:[{text:newZ.text.trim(),stitky:newZ.stitky.slice()}]});
  poNew=false;newZ=null;showToast('Zápis uložen');render();};
</script>
<script>
/* CORE: ADMIN – stav, sekce, sidebar, render(), go(), úvodní spuštění.
   Desktopový shell: stálý levý sidebar místo mobilního draweru. */
const SECTIONS=[
  ['prehled','Přehled','⌂'],
  ['aktuality','Novinky','✉'],
  ['porady','Porady a evaluace','▤'],
  ['platby','Platby','₵'],
  ['nahrady','Náhrady','↻'],
];
const TITLES=Object.fromEntries(SECTIONS.map(s=>[s[0],s[1]]));

let section='prehled';

// Sekce mimo 3.1 zatím renderují decentní placeholder (navigace nevede do prázdna).
function renderPlaceholder(){
  return `<div class="tile ph-tile"><div class="ph-ic">🌿</div><div class="ph-t">${TITLES[section]}</div>`
    +`<div class="ph-d">Tato sekce se připravuje v další fázi prototypu.</div></div>`;
}
const RENDER={prehled:renderPrehled,aktuality:renderAktuality,porady:renderPorady,platby:renderPlaceholder,nahrady:renderPlaceholder};

function renderSidebar(){
  const el=document.getElementById('sidebar');
  el.innerHTML=`<div class="sb-brand"><img class="brand-mark" src="${VHAAJI_LOGO}" alt=""><span class="brand-txt">IS Vhaaji</span></div>`
    +`<div class="sb-nav">`+SECTIONS.map(s=>`<button class="sb-item ${section===s[0]?'on':''}" onclick="go('${s[0]}')"><span class="ic">${icon(s[0])||s[2]}</span>${s[1]}</button>`).join('')+`</div>`;
}
// Primární akce sekce – v topbaru vedle nadpisu, stejně jako v průvodcovské appce.
// Dřív to byl pruh .addbig přes celou šířku obsahu; táž akce tak vypadala v každé appce jinak.
const TOPACT={
  aktuality:`<button class="btn-primary" onclick="akNew()">+ Nová novinka</button>`,
  porady:`<button class="btn-primary no-print" onclick="poNewZ()">+ Nový zápis</button>`,
};
function render(){
  document.getElementById('ttl').textContent=TITLES[section];
  document.getElementById('topact').innerHTML=TOPACT[section]||'';
  renderSidebar();
  document.getElementById('content').innerHTML=RENDER[section]();
}
