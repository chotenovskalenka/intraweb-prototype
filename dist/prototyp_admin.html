<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Administrativa (prototyp)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Design tokens — sémantická vrstva (fáze 0.4). Hodnoty se oproti původním názvům NEMĚNÍ. */
:root{
  --color-bg:#EFE9DB;
  --color-surface:#FBF8F0;
  --color-surface-2:#F4EEDF;
  --color-text:#2B2A26;
  --color-text-muted:#736E61;
  --color-text-hint:#9A9384;
  --color-primary:#2E5E43;
  --color-primary-strong:#21402F;
  --color-accent-soft:#8FA48C;
  --color-accent:#B07D3A;
  --color-info:#5B7C99;
  --color-border:rgba(43,42,38,.10);
  --color-border-strong:rgba(43,42,38,.16);
  --color-danger:#B0492F;
  --color-success:#3C7A4E;
  --radius-md:14px;
  --font-serif:"Fraunces",Georgia,serif;
  --font-sans:"Hanken Grotesk","Segoe UI",sans-serif;
  /* spacing škála — zatím bez použití, připravená pro budoucí fáze */
  --space-xs:4px;
  --space-sm:8px;
  --space-md:12px;
  --space-lg:16px;
}
</style>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--color-bg);font-family:var(--font-sans);color:var(--color-text);-webkit-font-smoothing:antialiased;min-height:100vh;line-height:1.5}
</style>
<style>
/* LAYOUT: ADMIN — desktopový shell (stálý levý sidebar + obsah s max šířkou ~980 px).
   Skládá se ze stejných tokenů jako mobilní appky; mobil jen „nerozbité". */
.admin{display:flex;min-height:100vh;background:var(--color-bg)}
.sidebar{width:236px;flex-shrink:0;background:var(--color-bg);border-right:1px solid var(--color-border);padding:22px 0 16px;position:sticky;top:0;height:100vh;overflow-y:auto}
.sb-brand{font-family:var(--font-serif);font-size:20px;color:var(--color-primary-strong);padding:0 22px 10px;border-bottom:1px solid var(--color-border);margin-bottom:8px}
.sb-brand small{display:block;font-family:var(--font-sans);font-size:11.5px;color:var(--color-text-muted);font-weight:400;margin-top:2px}
.sb-item{display:flex;align-items:center;gap:11px;padding:11px 22px;font-size:14.5px;color:var(--color-text);cursor:pointer;border:none;background:none;width:100%;text-align:left;font-family:var(--font-sans)}
.sb-item.on{background:rgba(46,94,67,.10);color:var(--color-primary);font-weight:600;box-shadow:inset 3px 0 0 var(--color-primary)}
.sb-item .ic{width:18px;text-align:center;opacity:.7}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar-a{display:flex;align-items:center;gap:12px;padding:18px 32px;border-bottom:1px solid var(--color-border)}
.ttl-a{font-family:var(--font-serif);font-size:22px;color:var(--color-primary-strong);flex:1}
.role-a{font-size:11.5px;font-weight:500;color:var(--color-primary);background:rgba(46,94,67,.10);border:1px solid rgba(46,94,67,.18);padding:5px 12px;border-radius:999px;white-space:nowrap}
.content-wrap{padding:24px 32px 48px}
.content-wrap #content{max-width:980px;margin:0 auto}

/* Mobil: shell se nerozbije — sidebar nahoře jako vodorovná lišta. */
@media(max-width:720px){
  .admin{flex-direction:column}
  .sidebar{width:auto;height:auto;position:static;border-right:none;border-bottom:1px solid var(--color-border);padding:12px 0}
  .sb-brand{padding:0 16px 8px}
  .sb-nav{display:flex;overflow-x:auto;scrollbar-width:none}
  .sb-nav::-webkit-scrollbar{display:none}
  .sb-item{display:inline-flex;width:auto;flex:0 0 auto;white-space:nowrap;padding:9px 14px}
  .sb-item.on{box-shadow:inset 0 -3px 0 var(--color-primary)}
  .topbar-a{padding:14px 16px}
  .content-wrap{padding:16px}
}
</style>
<style>
.tile{background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-md);padding:13px 15px;margin-bottom:11px}
.tlab{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:#605B4F;margin-bottom:7px}
.tval{font-size:14.5px;color:var(--color-text);line-height:1.5}
.vhead{font-family:var(--font-serif);font-size:16px;color:var(--color-primary-strong);margin:4px 2px 9px}
.note2{font-size:12px;color:var(--color-text-hint);margin-top:10px;line-height:1.5}
.note-info{background:rgba(46,94,67,.06);border-color:rgba(46,94,67,.18);font-size:13.5px;color:var(--color-text);line-height:1.5}
.note-info b{color:var(--color-primary);font-weight:600}
.np{display:flex;justify-content:space-between;align-items:center;font-size:14px;padding:5px 0}.np b{font-weight:600}
.switch{display:flex;gap:6px;background:var(--color-surface-2);padding:4px;border-radius:999px;margin-bottom:14px}
.switch button{flex:1;border:none;background:transparent;font-family:var(--font-sans);font-size:13.5px;font-weight:500;color:var(--color-text-muted);padding:12px 4px;border-radius:999px;cursor:pointer}
.switch button.on{background:var(--color-primary);color:#F4EEDF}
.selin{border:1px solid var(--color-border-strong);border-radius:8px;padding:6px 9px;font-family:var(--font-sans);font-size:13.5px;background:var(--color-surface);color:var(--color-text)}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;min-width:76px;background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-md);padding:13px 15px 11px;text-align:center;cursor:pointer}
.modes{display:flex;gap:6px;margin-bottom:10px}
.modes button{flex:1;border:1px solid var(--color-border-strong);background:var(--color-surface);font-family:var(--font-sans);font-size:12.5px;font-weight:500;color:var(--color-text-muted);padding:11px 4px;border-radius:10px;cursor:pointer}
.modes button.on{background:var(--color-accent);border-color:var(--color-accent);color:#FBF8F0}
.c-N{background:rgba(176,73,47,.14);color:var(--color-danger)}
.rnote{margin:0 8px 8px;padding:9px 11px;background:rgba(176,73,47,.10);border-radius:9px;font-size:12.5px;color:var(--color-danger);line-height:1.45;font-weight:500}
.ghostred{background:transparent;border:1px solid var(--color-danger);color:var(--color-danger)}
.clink{color:var(--color-primary);font-weight:600;text-decoration:none}
.tab .num{font-family:var(--font-serif);font-weight:600;font-size:28px;line-height:1;color:var(--color-primary-strong)}
.tab .lab{font-size:11.5px;color:var(--color-text-muted);margin-top:4px}
.tab.on{background:var(--color-primary);border-color:var(--color-primary)}.tab.on .num{color:#F8F4E8}.tab.on .lab{color:rgba(244,238,223,.8)}
.tab.lead .num{color:var(--color-primary)}.tab.on.lead .num{color:#F8F4E8}
.ctxhead{display:flex;align-items:baseline;justify-content:space-between;margin:16px 2px 3px}
.ctxhead .t{font-family:var(--font-serif);font-size:16px;color:var(--color-primary-strong)}
.ctxhead .pres{font-size:13px;color:var(--color-text-muted)}.ctxhead .pres b{color:var(--color-primary);font-weight:600}
.sectip{font-size:13px;color:var(--color-text-muted);margin:0 2px 9px;min-height:17px}
.search{width:100%;border:1px solid var(--color-border-strong);border-radius:10px;padding:9px 11px;font-family:var(--font-sans);font-size:13.5px;color:var(--color-text);background:var(--color-surface);margin-bottom:9px}
.rosterbox{max-height:340px;overflow-y:auto;border:1px solid var(--color-border);border-radius:12px;padding:5px;background:rgba(251,248,240,.5)}
.row{background:var(--color-surface);border:1px solid var(--color-border);border-radius:10px;margin-bottom:5px;overflow:hidden}.row:last-child{margin-bottom:0}
.rmain{display:flex;align-items:center;gap:9px;padding:11px 12px;cursor:pointer;min-height:52px}
.pnote{background:var(--color-surface);border:1px solid var(--color-border);border-radius:8px;padding:9px 11px;font-size:13px;line-height:1.5;color:var(--color-text)}
.chk{flex-shrink:0;width:30px;height:30px;border-radius:8px;border:1.5px solid var(--color-border-strong);background:var(--color-surface-2);display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff;cursor:pointer}
.chk.on{background:var(--color-primary);border-color:var(--color-primary)}
.rmain .nm{font-weight:500;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex-shrink:1;min-width:60px}
.rmain .ind{margin-left:auto;font-size:11.5px;color:var(--color-text-muted);flex-shrink:0;white-space:nowrap}
.ind.sleep{color:var(--color-info)}.ind.awake{color:var(--color-accent)}.ind.off{color:var(--color-danger)}
.pill{font-size:10px;font-weight:500;padding:2px 6px;border-radius:6px;flex-shrink:0}
.p-cel{background:rgba(46,94,67,.10);color:var(--color-primary)}.p-odp{background:rgba(91,124,153,.13);color:#3f5d72}
.p-dop{background:rgba(176,125,58,.13);color:var(--color-accent)}.p-note{background:rgba(176,73,47,.10);color:var(--color-danger)}
.row.absent .nm{color:var(--color-text-hint);text-decoration:line-through}
.edit{border-top:1px solid var(--color-border);padding:11px 11px 12px;background:var(--color-surface-2)}
.field{margin-bottom:9px}.field .l{font-size:11px;color:var(--color-text-muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:5px}
.mini{display:flex;gap:5px}
.mini button{flex:1;border:1px solid var(--color-border-strong);background:var(--color-surface);font-family:var(--font-sans);font-size:12.5px;font-weight:500;color:var(--color-text-muted);padding:12px 6px;border-radius:9px;cursor:pointer}
.mini button.on{background:var(--color-primary);border-color:var(--color-primary);color:#F4EEDF}
.mini.warn button.on{background:var(--color-danger);border-color:var(--color-danger)}
.note{width:100%;border:1px solid var(--color-border-strong);border-radius:8px;padding:8px 10px;font-family:var(--font-sans);font-size:13.5px;color:var(--color-text);background:var(--color-surface);min-height:54px;resize:vertical;line-height:1.45}
.empty{font-size:13px;color:var(--color-text-hint);font-style:italic;text-align:center;padding:16px}
footer{margin-top:16px;padding-top:13px;border-top:1px solid var(--color-border);display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.meals{font-size:13.5px;color:var(--color-text-muted)}.meals b{color:var(--color-text);font-weight:600}
.pwa{font-size:11.5px;color:var(--color-text-hint)}
.hint{font-size:12.5px;color:var(--color-text-hint);text-align:center;margin-top:14px;line-height:1.45}
.av{display:inline-flex;border-radius:50%;overflow:hidden;flex-shrink:0;line-height:0}.av svg{display:block}
.works{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:4px}
.work{aspect-ratio:1;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:11px;color:rgba(43,42,38,.4)}
.weekbox{max-height:430px;overflow-y:auto;border:1px solid var(--color-border);border-radius:12px;background:var(--color-surface)}
table.wt{width:100%;border-collapse:collapse;table-layout:fixed}
table.wt th,table.wt td{padding:6px 2px;text-align:center;font-size:12.5px}
table.wt thead th{position:sticky;top:0;background:var(--color-surface-2);color:var(--color-text-muted);font-weight:600;font-size:11.5px;border-bottom:1px solid var(--color-border);z-index:1}
table.wt th.who,table.wt td.who{text-align:left;width:42%;padding-left:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
table.wt td.who{font-size:13px;font-weight:500}
table.wt td.who .av{vertical-align:middle;margin-right:6px}
table.wt tbody tr{border-bottom:1px solid var(--color-border)}
table.wt th.today,table.wt td.today{background:rgba(46,94,67,.06)}
table.wt thead th.today{color:var(--color-primary);background:rgba(46,94,67,.12)}
.wc{display:inline-block;width:24px;height:24px;line-height:24px;border-radius:6px;font-size:11px;font-weight:600}
.c-C{background:rgba(46,94,67,.16);color:var(--color-primary)}.c-D{background:rgba(176,125,58,.20);color:var(--color-accent)}
.c-O{background:rgba(91,124,153,.20);color:#3f5d72}.wc.e{background:transparent;color:var(--color-text-hint);font-weight:400}
table.wt tfoot td{position:sticky;bottom:0;background:var(--color-surface-2);font-weight:600;color:var(--color-primary-strong);border-top:1px solid var(--color-border-strong);font-size:12.5px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--color-text-muted);margin:10px 2px 0}.legend span b{font-weight:600;color:var(--color-text)}
.prow{background:var(--color-surface);border:1px solid var(--color-border);border-radius:12px;margin-bottom:6px;overflow:hidden}
.prow.open{border-color:var(--color-primary)}
.pmain{display:flex;align-items:center;gap:10px;padding:11px 13px;cursor:pointer}
.pd{font-size:13.5px;color:var(--color-text-muted);min-width:34px;flex-shrink:0}
.pp{font-family:var(--font-serif);font-size:15.5px;color:var(--color-primary-strong)}
.psub{padding:0 13px 10px;font-size:12.5px;color:var(--color-accent);margin-top:-4px}
.pedit{border-top:1px solid var(--color-border);background:var(--color-surface-2);padding:12px 13px}
.pl{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--color-text-muted);margin:9px 0 5px}.pl:first-child{margin-top:0}
.pchips{display:flex;flex-wrap:wrap;gap:6px}
.pchips button{border:1px solid var(--color-border-strong);background:var(--color-surface);font-family:var(--font-sans);font-size:12.5px;color:var(--color-text-muted);padding:6px 11px;border-radius:999px;cursor:pointer}
.pchips button.on{background:var(--color-primary);border-color:var(--color-primary);color:#F4EEDF}
.pin{width:100%;border:1px solid var(--color-border-strong);border-radius:9px;padding:9px 11px;font-family:var(--font-sans);font-size:13.5px;color:var(--color-text);background:var(--color-surface)}
.pta{width:100%;border:1px solid var(--color-border-strong);border-radius:9px;padding:9px 11px;font-family:var(--font-sans);font-size:13.5px;color:var(--color-text);background:var(--color-surface);min-height:62px;resize:vertical;line-height:1.5}
.addbig{width:100%;border:1.5px solid var(--color-primary);background:rgba(46,94,67,.07);color:var(--color-primary);font-family:var(--font-sans);font-size:15px;font-weight:600;padding:12px;border-radius:12px;cursor:pointer;margin-bottom:11px}
.acard{display:flex;gap:11px;align-items:flex-start;background:var(--color-surface);border:1px solid var(--color-border);border-radius:12px;padding:11px 13px;margin-bottom:7px;cursor:pointer;width:100%;text-align:left;font-family:var(--font-sans)}
.adate{font-family:var(--font-serif);font-size:14px;color:var(--color-primary);min-width:64px;flex-shrink:0;padding-top:1px}
.aname{font-size:14.5px;font-weight:500;color:var(--color-text)}
.ameta{font-size:12.5px;color:var(--color-text-muted);margin-top:2px;line-height:1.4}
.modal-scrim{position:fixed;inset:0;background:rgba(33,42,30,.5);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.modal{background:var(--color-bg);width:100%;max-width:460px;border-radius:18px 18px 0 0;padding:18px 18px 22px;max-height:90vh;overflow-y:auto;box-shadow:0 -8px 30px rgba(0,0,0,.22)}
.modal h3{font-family:var(--font-serif);font-size:19px;color:var(--color-primary-strong);margin-bottom:6px}
.mrow2{display:flex;gap:9px}
.mbtns{display:flex;gap:9px;margin-top:16px}
.btn-primary{flex:1;background:var(--color-primary);color:#F4EEDF;border:none;font-family:var(--font-sans);font-size:15px;font-weight:600;padding:13px;border-radius:11px;cursor:pointer}
.btn-ghost{flex:1;background:transparent;color:var(--color-text-muted);border:1px solid var(--color-border-strong);font-size:15px;padding:13px;border-radius:11px;cursor:pointer;font-family:var(--font-sans)}
.btn-del{display:block;background:none;border:none;color:var(--color-danger);font-size:13.5px;font-weight:600;cursor:pointer;margin:12px auto 0;font-family:var(--font-sans)}
.filters{display:flex;gap:8px;margin-bottom:12px;overflow-x:auto;scrollbar-width:none}.filters::-webkit-scrollbar{display:none}
.filters button{flex:0 0 auto;border:1px solid var(--color-border-strong);background:var(--color-surface);font-family:var(--font-sans);font-size:13px;color:var(--color-text-muted);padding:8px 15px;border-radius:999px;cursor:pointer}
.filters button.on{background:var(--color-primary);border-color:var(--color-primary);color:#F4EEDF}
.bdg{font-size:10px;font-weight:600;padding:2px 7px;border-radius:6px;white-space:nowrap}
.bdg.pre{color:var(--color-primary);background:rgba(46,94,67,.12)}.bdg.al{color:var(--color-danger);background:rgba(176,73,47,.12)}
.pav{display:flex;justify-content:center;margin:6px 0 10px}
.pname{font-family:var(--font-serif);font-size:22px;text-align:center;color:var(--color-primary-strong)}
.pfull{text-align:center;font-size:13px;color:var(--color-text-muted);margin-bottom:16px}
.back{background:none;border:none;color:var(--color-primary);font-weight:600;font-size:14px;font-family:var(--font-sans);cursor:pointer;padding:4px 0;margin-bottom:10px}
.addbtn{margin-top:10px;width:100%;border:1px dashed var(--color-border-strong);background:transparent;color:var(--color-text-muted);font-family:var(--font-sans);font-size:13px;padding:10px;border-radius:10px;cursor:pointer}
.contact{display:flex;gap:7px;margin-top:6px}
.cbtn{flex:1;text-align:center;border:1px solid var(--color-primary);color:var(--color-primary);border-radius:9px;padding:9px;font-size:13px;font-weight:600;text-decoration:none;font-family:var(--font-sans)}
.stepper{display:flex;align-items:center;justify-content:space-between;background:var(--color-surface-2);border:1px solid var(--color-border);border-radius:12px;padding:6px 6px;margin-bottom:13px}
.stepper button{border:none;background:none;font-size:20px;color:var(--color-primary);cursor:pointer;padding:5px 16px;font-family:var(--font-serif);line-height:1}
.stepper button:disabled{color:var(--color-text-hint);cursor:default}
.stepper span{font-family:var(--font-serif);font-size:16px;color:var(--color-primary-strong)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.calh{text-align:center;font-size:11px;color:var(--color-text-muted);padding:2px 0}
table.wt td.ced{cursor:pointer;background:rgba(46,94,67,.05)}
table.wt td.ced:active{background:rgba(46,94,67,.14)}
table.wt td.pastc{opacity:.45}
.calcell{aspect-ratio:1;border:1px solid var(--color-border);border-radius:9px;background:var(--color-surface);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;position:relative}
.calcell .cnum{font-size:13px;color:var(--color-text)}
.calcell.we{background:transparent;border-color:transparent}.calcell.we .cnum{color:var(--color-text-hint)}
.calcell.today{border-color:var(--color-primary);border-width:1.5px}
.calcell.sel{background:var(--color-primary)}.calcell.sel .cnum{color:#F4EEDF}
.cdot{width:5px;height:5px;border-radius:50%;background:var(--color-accent);margin-top:2px}
.ccount{font-size:11px;font-weight:600;color:var(--color-primary);margin-top:1px}.ccount.lk{color:var(--color-text-hint)}
.calcell.sel .cdot{background:#F4EEDF}
</style>
<style>
/* SCREENS: ADMIN — obrazovkové styly (dashboard vedení). Skládá z existujících komponent
   (.tile, .tlab, .bdg, .note2); nové jen tam, kde není co znovupoužít. */

.dash-head{font-size:13px;color:var(--color-text-muted);margin:0 2px 14px}

/* placeholder pro sekce mimo 3.1 */
.ph-tile{text-align:center;padding:40px 20px}
.ph-ic{font-size:34px;margin-bottom:10px}
.ph-t{font-family:var(--font-serif);font-size:19px;color:var(--color-primary-strong);margin-bottom:4px}
.ph-d{font-size:13.5px;color:var(--color-text-muted)}

/* (a) kapacity */
.caps{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.cap-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.cap-nm{font-family:var(--font-serif);font-size:15.5px;color:var(--color-primary-strong)}
.cap-n{font-size:13px;color:var(--color-text-muted);font-weight:600}
.cap-n.is-full{color:var(--color-accent)}
.cap-bar{height:8px;background:var(--color-surface-2);border-radius:999px;overflow:hidden}
.cap-fill{display:block;height:100%;background:var(--color-primary);border-radius:999px}
.cap-fill.is-full{background:var(--color-accent)}

/* (b) platby */

.pay-main{flex:1;min-width:0}
.pay-nm{font-size:14px;font-weight:600;color:var(--color-text)}

.pay-right{display:flex;align-items:center;gap:10px;flex-shrink:0}
.pay-amt{font-family:var(--font-serif);font-size:15px;color:var(--color-primary-strong)}

/* badge varianty stavů platby (základ .bdg + .al v components.css) */

.bdg.part{color:var(--color-accent);background:rgba(176,125,58,.14)}

/* (c) upozornění */
.al-row{display:flex;gap:9px;align-items:flex-start;padding:7px 0;font-size:13.5px;color:var(--color-text);line-height:1.45}
.al-ic{flex-shrink:0;width:18px;text-align:center}
.al-sk{color:var(--color-text-muted)}
.al-data .al-ic{color:var(--color-accent)}
.al-provoz .al-ic{color:var(--color-info)}

/* (d) náhrady souhrn + (f) proklikové dlaždice */
.dash-link{display:block;width:100%;text-align:left;cursor:pointer;font-family:var(--font-sans)}
.dl-arr{float:right;color:var(--color-primary);font-weight:600}
.nh-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:4px}
.nh-cell{text-align:center;background:var(--color-surface-2);border-radius:12px;padding:12px 6px}
.nh-num{font-family:var(--font-serif);font-weight:600;font-size:26px;color:var(--color-primary-strong);line-height:1}
.nh-num.warn{color:var(--color-accent)}
.nh-lab{font-size:11.5px;color:var(--color-text-muted);margin-top:5px}

/* (e) úkoly */
.tl-count{float:right;color:var(--color-text-muted);font-weight:600;letter-spacing:0;text-transform:none}
.task{display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:none;border:none;border-top:1px solid var(--color-border);padding:10px 0;cursor:pointer;font-family:var(--font-sans);font-size:14px;color:var(--color-text)}
.task:first-of-type{border-top:none}
.task-box{flex-shrink:0;width:22px;height:22px;border-radius:6px;border:1.5px solid var(--color-border-strong);background:var(--color-surface-2);display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff}
.task.done .task-box{background:var(--color-primary);border-color:var(--color-primary)}
.task.done .task-t{color:var(--color-text-hint);text-decoration:line-through}

/* (f) porady řádky */
.por-row{display:flex;align-items:baseline;gap:11px;padding:8px 0;border-top:1px solid var(--color-border)}
.por-row:first-of-type{border-top:none}
.por-d{font-size:12.5px;color:var(--color-text-muted);min-width:74px;flex-shrink:0}
.por-t{flex:1;font-size:14px;color:var(--color-text)}
.por-sk{color:var(--color-text-muted)}
.por-typ{font-size:10px;font-weight:600;padding:2px 8px;border-radius:6px;flex-shrink:0}
.por-typ.porada{color:var(--color-primary);background:rgba(46,94,67,.12)}
.por-typ.evaluace{color:var(--color-accent);background:rgba(176,125,58,.14)}

/* badge varianty stavů aktuality (základ .bdg z components.css) */
.bdg.sent{color:var(--color-primary);background:rgba(46,94,67,.12)}
.bdg.arch{color:var(--color-text-hint);background:rgba(43,42,38,.07)}

/* aktuality — seznam */
.ak-item{padding:14px 16px}
.ak-top{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.ak-date{margin-left:auto;font-size:12.5px;color:var(--color-text-muted)}
.ak-txt{font-size:14.5px;color:var(--color-text);line-height:1.5}
.ak-empty{color:var(--color-text-hint);font-style:italic}
.ak-rec{font-size:12.5px;color:var(--color-text-muted);margin-top:9px;line-height:1.45}
.ak-rlab{color:var(--color-text);font-weight:600}
.ak-norec{color:var(--color-danger)}
.ak-acts{display:flex;gap:8px;align-items:center;margin-top:12px}
.ak-hint,.ak-acts .ak-hint{font-size:12.5px;color:var(--color-text-muted);font-style:italic}
.btn-s{border:1px solid var(--color-border-strong);background:var(--color-surface);font-family:var(--font-sans);font-size:13px;font-weight:500;color:var(--color-text);padding:8px 16px;border-radius:9px;cursor:pointer}
.btn-s.primary{background:var(--color-primary);border-color:var(--color-primary);color:#F4EEDF}
.btn-s:disabled{opacity:.4;cursor:not-allowed}

/* aktuality — formulář */
.rec-sk{margin-bottom:11px}
.rec-sk:last-child{margin-bottom:0}
.rec-nm{font-size:13.5px;font-weight:600;color:var(--color-primary-strong);margin-bottom:6px}
.rec-fam{font-weight:400;color:var(--color-text-muted);font-size:11.5px}
.ak-preview{margin-top:4px}
.ak-preview b{color:var(--color-primary)}

.btn-primary:disabled{opacity:.45;cursor:not-allowed}

@media(max-width:720px){
  .caps,.nh-grid{grid-template-columns:1fr}
}

const fmt=t=>t?t.replace(/^0(\d:)/,'$1'):t;

function avHash(s){let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0;return h;}
function avatar(c,size){

  var h=avHash(c.n+(c.sur||'')),skin=SKIN[h%6],hair=HAIR[(h>>3)%6],bg=BG[(h>>6)%5],st=h%4;
  var hcy=[53,50,54,56][st],hr=[30,31,30,29][st],bun=st===2?'<circle cx="50" cy="26" r="7" fill="'+hair+'"/>':'';
  var svg='<svg viewBox="0 0 100 100" width="100%" height="100%" preserveAspectRatio="xMidYMid slice"><rect width="100" height="100" fill="'+bg+'"/>'+bun+'<circle cx="50" cy="'+hcy+'" r="'+hr+'" fill="'+hair+'"/><circle cx="50" cy="62" r="24" fill="'+skin+'"/><circle cx="42" cy="60" r="2.6" fill="#3a2f28"/><circle cx="58" cy="60" r="2.6" fill="#3a2f28"/><path d="M43 69 Q50 75 57 69" stroke="#3a2f28" stroke-width="2.4" fill="none" stroke-linecap="round"/></svg>';
  return '<span class="av" style="width:'+size+'px;height:'+size+'px">'+svg+'</span>';
}

function showToast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');clearTimeout(window._tt);window._tt=setTimeout(()=>t.classList.remove('on'),1500);}

<script>
/* DATA: ADMIN — seed pro appku vedení/administrativy (tři školky).
   Data se s ostatními appkami NESDÍLEJÍ; kde to dává smysl, čísla sedí s mobilními appkami
   (např. Eliška Dvořáková má neuhrazenou fakturu za březen — viz rodic/data.js). */

const TODAYD=3;                    // St 3. 6. 2026 — shodný simulovaný čas jako ostatní appky

/* Tři sesterské školky: obsazenost/kapacita a třídy/skupiny.
   Vhaaji sedí s průvodcovskou appkou (25 dětí). */
const SKOLKY=[
  {id:'vhaaji',nazev:'Vhaaji',kapacita:28,tridy:[
    {n:'Lišky',obs:13,kap:14},
    {n:'Veverky',obs:12,kap:14},
  ]},
  {id:'jaata',nazev:'Jaata',kapacita:24,tridy:[
    {n:'Sluníčka',obs:12,kap:12},
    {n:'Kapky',obs:12,kap:12},
  ]},
  {id:'maata',nazev:'Maata',kapacita:20,tridy:[
    {n:'Sovy',obs:9,kap:10},
    {n:'Ježci',obs:7,kap:10},
  ]},
];
const obsazeno=s=>s.tridy.reduce((n,t)=>n+t.obs,0);

/* Stavy platby (BRIEF kap. 4). Fakturační modul se nedělá — dashboard jen přehled
   „řeší se mimo appku". Eliška Dvořáková: Březen 2026, 5987 Kč (7983 − 1996 sleva) = shoda s rodic/data.js. */
const PLATBASTAVY={
  'po-splatnosti':{lab:'Po splatnosti',cls:'al'},
  'neuhrazeno':{lab:'Neuhrazeno',cls:'ne'},
  'castecne':{lab:'Částečně uhrazeno',cls:'part'},
  'ceka':{lab:'Čeká na spárování',cls:'wait'},
};
const PLATBY=[
  {dite:'Eliška Dvořáková',skolka:'Vhaaji',obdobi:'Školné · Březen 2026',castka:5987,stav:'po-splatnosti',poDnu:80},
  {dite:'Kuba Svoboda',skolka:'Vhaaji',obdobi:'Školné · Květen 2026',castka:5987,stav:'neuhrazeno',poDnu:19},
  {dite:'Tomáš Beran',skolka:'Jaata',obdobi:'Školné · Květen 2026',castka:8200,stav:'castecne',uhrazeno:4000,poDnu:19},
  {dite:'Ela Marešová',skolka:'Maata',obdobi:'Školné · Duben 2026',castka:7500,stav:'ceka',poDnu:0},
];

/* Systémová upozornění vč. chybějících / nevyplněných dat. */
const UPOZORNENI=[
  {typ:'data',text:'U 2 dětí chybí kontakt na zákonného zástupce',skolka:'Vhaaji'},
  {typ:'data',text:'U 1 dítěte chybí podepsaný GDPR souhlas',skolka:'Maata'},
  {typ:'provoz',text:'Jaata je plně obsazená — 3 rodiny v pořadníku',skolka:'Jaata'},
  {typ:'system',text:'Záloha dat proběhla v pořádku (3. 6. 04:00)',skolka:''},
];

/* Souhrn náhrad napříč školkami (detail přijde v sekci Náhrady). */
const NAHRADY_SUM={dostupne:14,expiruje30:3,naplanovane:5};

/* Provozní úkoly — jednoduchý checklist, odškrtávání funguje v paměti (mizí po reloadu). */
let UKOLY=[
  {t:'Objednat sezónní ovoce na červen (všechny tři školky)',done:false},
  {t:'Revize lékárniček — Vhaaji a Maata',done:false},
  {t:'Odeslat účetní podklady za květen',done:true},
  {t:'Připravit rozpis letního provozu',done:false},
  {t:'Potvrdit termín inspekce ČŠI',done:false},
];

/* Aktuality (Flow 4). Stavy: koncept / naplanovana / odeslana / archivovana.
   `naplanovana` jen v seed datech — plánování odeslání se nedělá (viz decision-log).
   `recip` = mapa skolkaId → {all:bool, tridy:[názvy tříd]}; příjemci jsou POVINNÍ pro odeslání.
   „Bez určených příjemců" (BRIEF kap. 4) je chyba, ne stav — v datech se neukládá.
   Odeslané aktuality sedí s NEWS v rodičovské appce (roupy, dřívější vyzvednutí) — simulace shodou seedu, žádné sdílení. */
const AKSTAV={
  koncept:{lab:'Koncept',cls:'wait'},
  naplanovana:{lab:'Naplánovaná',cls:'part'},
  odeslana:{lab:'Odeslaná',cls:'sent'},
  archivovana:{lab:'Archivovaná',cls:'arch'},
};
let akUid=10;
let AKTUALITY=[
  {id:'ak1',text:'Ve třídě se vyskytly roupy. Prosíme, zkontrolujte dítě.',urgent:true,stav:'odeslana',datum:'2. 6. 2026',recip:{vhaaji:{all:true,tridy:[]}}},
  {id:'ak2',text:'V pátek 5. 6. končíme už ve 14:00 (pedagogická porada). Prosíme o dřívější vyzvednutí.',urgent:true,stav:'odeslana',datum:'1. 6. 2026',recip:{vhaaji:{all:true,tridy:[]}}},
  {id:'ak3',text:'Sbíráme víčka od PET lahví na výtvarku — sběrný koš je u vchodu do maringotky.',urgent:false,stav:'archivovana',datum:'28. 5. 2026',recip:{vhaaji:{all:false,tridy:['Lišky']}}},
  {id:'ak4',text:'Letní provoz: přihlašování na červencové týdny je otevřené do 20. 6.',urgent:false,stav:'naplanovana',datum:'odešle se 10. 6. 2026',recip:{vhaaji:{all:true,tridy:[]},jaata:{all:true,tridy:[]},maata:{all:true,tridy:[]}}},
  {id:'ak5',text:'Brigáda na zahradě 13. 6. — připravit přihlašovací tabulku a rozeslat rodinám.',urgent:false,stav:'koncept',datum:'',recip:{}},
];
// souhrn příjemců aktuality → pole vět „Školka — všichni/třídy (N rodin)"; počet rodin ~ obsazenost
function recipText(recip){
  const parts=[];
  SKOLKY.forEach(s=>{
    const r=recip[s.id]; if(!r)return;
    if(r.all){parts.push(`${s.nazev} — všichni (${obsazeno(s)} rodin)`);}
    else if(r.tridy&&r.tridy.length){
      const fam=r.tridy.reduce((n,tn)=>{const t=s.tridy.find(x=>x.n===tn);return n+(t?t.obs:0);},0);
      parts.push(`${s.nazev} — ${r.tridy.join(', ')} (${fam} rodin)`);
    }
  });
  return parts;
}
const hasRecip=recip=>SKOLKY.some(s=>{const r=recip[s.id];return !!(r&&(r.all||(r.tridy&&r.tridy.length)));});

/* Poslední porady a evaluace — pro dashboard stačí titulky, plná data přijdou v 3.3. */
const PORADY=[
  {datum:'2. 6. 2026',typ:'porada',titul:'Provozní porada — červen',skolka:'Vhaaji'},
  {datum:'19. 5. 2026',typ:'evaluace',titul:'Čtvrtletní evaluace pedagogů',skolka:'Jaata'},
  {datum:'5. 5. 2026',typ:'porada',titul:'Bezpečnost a revize prostředí',skolka:'Maata'},
];

<script>
/* SCREEN: ADMIN_PREHLED — dashboard vedení (BRIEF kap. 1):
   kapacity tří školek, chybějící platby, systémová upozornění, souhrn náhrad,
   provozní úkoly, poslední porady/evaluace. */
function renderPrehled(){
  let h=`<div class="dash-head">${DOW[wd(TODAYD)]} ${TODAYD}. června 2026 · přehled tří školek</div>`;

  // (a) kapacity tří školek — obsazeno / kapacita, vizuální pruh
  h+=`<div class="tile"><div class="tlab">Kapacity školek</div><div class="caps">`;
  SKOLKY.forEach(s=>{
    const obs=obsazeno(s), pct=Math.round(obs/s.kapacita*100), full=obs>=s.kapacita;
    const tridy=s.tridy.map(t=>`${t.n} ${t.obs}/${t.kap}`).join(' · ');
    h+=`<div class="cap">`
      +`<div class="cap-top"><span class="cap-nm">${s.nazev}</span><span class="cap-n ${full?'is-full':''}">${obs}/${s.kapacita}${full?' · plno':''}</span></div>`
      +`<div class="cap-bar"><span class="cap-fill ${full?'is-full':''}" style="width:${pct}%"></span></div>`
      +`<div class="cap-sub">${tridy}</div>`
      +`</div>`;
  });
  h+=`</div></div>`;

  // (b) chybějící platby — kdo, částka, po splatnosti (badge stavů); řeší se mimo appku
  h+=`<div class="tile"><div class="tlab">Chybějící platby</div>`;
  PLATBY.forEach(p=>{
    const st=PLATBASTAVY[p.stav];
    const dodat=p.stav==='po-splatnosti'?`po splatnosti ${p.poDnu} dní`
      :p.stav==='castecne'?`uhrazeno ${kc(p.uhrazeno)} z ${kc(p.castka)} Kč`
      :p.stav==='ceka'?'platba přišla, čeká na spárování':`splatnost prošla před ${p.poDnu} dny`;
    h+=`<div class="pay-row"><div class="pay-main"><div class="pay-nm">${p.dite} <span class="pay-sk">· ${p.skolka}</span></div>`
      +`<div class="pay-sub">${p.obdobi} — ${dodat}</div></div>`
      +`<div class="pay-right"><span class="pay-amt">${kc(p.castka)} Kč</span><span class="bdg ${st.cls}">${st.lab}</span></div></div>`;
  });
  h+=`<div class="note2">Fakturaci školka řeší mimo appku — zde jen přehled.</div></div>`;

  // (c) systémová upozornění vč. chybějících dat
  h+=`<div class="tile"><div class="tlab">Systémová upozornění</div>`;
  UPOZORNENI.forEach(u=>{
    const ic=u.typ==='data'?'⚠':u.typ==='provoz'?'●':'✓';
    h+=`<div class="al-row al-${u.typ}"><span class="al-ic">${ic}</span><span class="al-tx">${u.text}${u.skolka?` <span class="al-sk">· ${u.skolka}</span>`:''}</span></div>`;
  });
  h+=`</div>`;

  // (d) souhrn náhrad — dostupné celkem, kolik brzy expiruje, naplánované
  h+=`<button class="tile dash-link" onclick="go('nahrady')"><div class="tlab" style="margin:0">Náhrady <span class="dl-arr">›</span></div>`
    +`<div class="nh-grid">`
    +`<div class="nh-cell"><div class="nh-num">${NAHRADY_SUM.dostupne}</div><div class="nh-lab">dostupných</div></div>`
    +`<div class="nh-cell"><div class="nh-num warn">${NAHRADY_SUM.expiruje30}</div><div class="nh-lab">expiruje do 30 dní</div></div>`
    +`<div class="nh-cell"><div class="nh-num">${NAHRADY_SUM.naplanovane}</div><div class="nh-lab">naplánovaných</div></div>`
    +`</div></button>`;

  // (e) provozní úkoly — checklist, odškrtávání v paměti
  const hotovo=UKOLY.filter(u=>u.done).length;
  h+=`<div class="tile"><div class="tlab">Provozní úkoly <span class="tl-count">${hotovo}/${UKOLY.length}</span></div>`;
  UKOLY.forEach((u,i)=>{
    h+=`<button class="task ${u.done?'done':''}" onclick="toggleUkol(${i})"><span class="task-box">${u.done?'✓':''}</span><span class="task-t">${u.t}</span></button>`;
  });
  h+=`</div>`;

  // (f) poslední porady / evaluace — titulky, proklik do sekce porad
  h+=`<button class="tile dash-link" onclick="go('porady')"><div class="tlab" style="margin:0">Poslední porady a evaluace <span class="dl-arr">›</span></div>`;
  PORADY.forEach(p=>{
    h+=`<div class="por-row"><span class="por-d">${p.datum}</span><span class="por-t">${p.titul}<span class="por-sk"> · ${p.skolka}</span></span><span class="por-typ ${p.typ}">${p.typ==='porada'?'porada':'evaluace'}</span></div>`;
  });
  h+=`</button>`;

  return h;
}
const kc=n=>String(n).replace(/\B(?=(\d{3})+(?!\d))/g,' ');
window.toggleUkol=i=>{UKOLY[i].done=!UKOLY[i].done;render();};
</script>
<script>
/* SCREEN: ADMIN_AKTUALITY — Flow 4: vedení vytváří aktualitu, kterou NELZE odeslat
   bez určení příjemců; u odeslaných vidí, komu odešla. */

let akView='list';   // 'list' | 'new'
let formA=null;      // rozpracovaná aktualita {text,urgent,recip}
let akEditId=null;   // id upravovaného konceptu (null = nová)

function renderAktuality(){
  return akView==='new'?renderAkForm():renderAkList();
}

function renderAkList(){
  let h=`<button class="addbig" onclick="akNew()">+ Nová aktualita</button>`;
  // pořadí: koncepty a naplánované nahoře, pak odeslané, pak archivované
  const order={koncept:0,naplanovana:1,odeslana:2,archivovana:3};
  const items=AKTUALITY.slice().sort((a,b)=>order[a.stav]-order[b.stav]);
  items.forEach(a=>{
    const st=AKSTAV[a.stav];
    h+=`<div class="tile ak-item">`;
    h+=`<div class="ak-top"><span class="bdg ${st.cls}">${st.lab}</span>`
      +(a.urgent?`<span class="bdg al">Důležité</span>`:``)
      +(a.datum?`<span class="ak-date">${a.datum}</span>`:``)+`</div>`;
    h+=`<div class="ak-txt">${escTa(a.text)||'<span class="ak-empty">(bez textu)</span>'}</div>`;
    // příjemci
    const rec=recipText(a.recip);
    if(rec.length){
      h+=`<div class="ak-rec"><span class="ak-rlab">Příjemci:</span> ${rec.map(escTa).join(' · ')}</div>`;
    }else if(a.stav==='koncept'){
      h+=`<div class="ak-rec ak-norec">Bez určených příjemců — před odesláním je nutné je vybrat.</div>`;
    }
    // akce dle stavu
    h+=`<div class="ak-acts">`;
    if(a.stav==='koncept'){
      h+=`<button class="btn-s" onclick="akEdit('${a.id}')">Upravit</button>`;
      h+=hasRecip(a.recip)
        ? `<button class="btn-s primary" onclick="akSendId('${a.id}')">Odeslat</button>`
        : `<button class="btn-s primary" disabled title="Nejdřív vyberte příjemce">Odeslat</button>`;
    }else if(a.stav==='odeslana'){
      h+=`<button class="btn-s" onclick="akArchive('${a.id}')">Archivovat</button>`;
    }else if(a.stav==='naplanovana'){
      h+=`<span class="ak-hint">Odešle se automaticky v naplánovaný čas.</span>`;
    }
    h+=`</div></div>`;
  });
  return h;
}

function renderAkForm(){
  const f=formA, recip=f.recip;
  const rec=recipText(recip), ok=hasRecip(recip), textOk=f.text.trim().length>0;
  let h=`<button class="back" onclick="akCancel()">‹ Zpět na seznam</button>`;
  h+=`<div class="tile">`;
  h+=`<div class="field"><div class="l">Text aktuality</div>`
    +`<textarea class="pta" id="akText" placeholder="Co chcete rodičům oznámit?">${escTa(f.text)}</textarea></div>`;
  // důležité
  h+=`<div class="field"><div class="l">Označení</div><div class="pchips">`
    +`<button class="${f.urgent?'on':''}" onclick="akToggleUrgent()">Důležité (urgentní)</button></div></div>`;
  // příjemci — povinné
  h+=`<div class="field"><div class="l">Příjemci · povinné</div>`;
  SKOLKY.forEach(s=>{
    const r=recip[s.id]||{all:false,tridy:[]};
    h+=`<div class="rec-sk"><div class="rec-nm">${s.nazev} <span class="rec-fam">${obsazeno(s)} rodin</span></div><div class="pchips">`;
    h+=`<button class="${r.all?'on':''}" onclick="akToggleAll('${s.id}')">Celá školka</button>`;
    s.tridy.forEach(t=>{
      const on=!r.all&&r.tridy.indexOf(t.n)>=0;
      h+=`<button class="${on?'on':''}" onclick="akToggleTrida('${s.id}','${t.n}')">${t.n} <span class="rec-fam">${t.obs}</span></button>`;
    });
    h+=`</div></div>`;
  });
  h+=`</div>`;
  // náhled příjemců
  if(ok){
    h+=`<div class="tile note-info ak-preview"><b>Odešle se rodičům:</b><br>${rec.map(escTa).join('<br>')}</div>`;
  }else{
    h+=`<div class="ak-warn">⚠ Bez určených příjemců nelze aktualitu odeslat — vyberte alespoň jednu školku nebo třídu.</div>`;
  }
  // tlačítka
  h+=`<div class="mbtns">`;
  h+=`<button class="btn-ghost" onclick="akSaveDraft()">Uložit koncept</button>`;
  const canSend=ok&&textOk;
  h+=canSend
    ? `<button class="btn-primary" onclick="akSend()">Odeslat</button>`
    : `<button class="btn-primary" disabled>Odeslat</button>`;
  h+=`</div>`;
  if(ok&&!textOk)h+=`<div class="ak-warn" style="margin-top:8px">Doplňte text aktuality.</div>`;
  h+=`</div>`;
  return h;
}

// před každou akcí, která překreslí, uložíme rozepsaný text (render zničí textarea)
function akSyncText(){const el=document.getElementById('akText');if(el&&formA)formA.text=el.value;}

window.akNew=()=>{formA={text:'',urgent:false,recip:{}};akEditId=null;akView='new';render();};
window.akEdit=id=>{const a=AKTUALITY.find(x=>x.id===id);formA={text:a.text,urgent:a.urgent,recip:JSON.parse(JSON.stringify(a.recip||{}))};akEditId=id;akView='new';render();};
window.akCancel=()=>{akView='list';formA=null;akEditId=null;render();};

window.akToggleUrgent=()=>{akSyncText();formA.urgent=!formA.urgent;render();};
window.akToggleAll=sid=>{akSyncText();const r=formA.recip[sid]||(formA.recip[sid]={all:false,tridy:[]});r.all=!r.all;r.tridy=[];if(!r.all)delete formA.recip[sid];render();};
window.akToggleTrida=(sid,tn)=>{akSyncText();const r=formA.recip[sid]||(formA.recip[sid]={all:false,tridy:[]});r.all=false;const i=r.tridy.indexOf(tn);if(i>=0)r.tridy.splice(i,1);else r.tridy.push(tn);if(!r.tridy.length)delete formA.recip[sid];render();};

function akCommit(stav){
  const dt=`${TODAYD}. 6. 2026`;
  if(akEditId){
    const a=AKTUALITY.find(x=>x.id===akEditId);
    a.text=formA.text;a.urgent=formA.urgent;a.recip=formA.recip;a.stav=stav;
    if(stav==='odeslana')a.datum=dt;
  }else{
    AKTUALITY.unshift({id:'ak'+(akUid++),text:formA.text,urgent:formA.urgent,stav,datum:stav==='odeslana'?dt:'',recip:formA.recip});
  }
}
window.akSaveDraft=()=>{akSyncText();akCommit('koncept');akView='list';formA=null;akEditId=null;showToast('Koncept uložen');render();};
window.akSend=()=>{akSyncText();if(!hasRecip(formA.recip)||!formA.text.trim())return;akCommit('odeslana');akView='list';formA=null;akEditId=null;showToast('Aktualita odeslána');render();};

// odeslání přímo ze seznamu (koncept s vybranými příjemci)
window.akSendId=id=>{const a=AKTUALITY.find(x=>x.id===id);if(!hasRecip(a.recip)||!a.text.trim())return;a.stav='odeslana';a.datum=`${TODAYD}. 6. 2026`;showToast('Aktualita odeslána');render();};
window.akArchive=id=>{const a=AKTUALITY.find(x=>x.id===id);a.stav='archivovana';showToast('Aktualita archivována');render();};
</script>
<script>
/* CORE: ADMIN — stav, sekce, sidebar, render(), go(), úvodní spuštění.
   Desktopový shell: stálý levý sidebar místo mobilního draweru. */
const SECTIONS=[
  ['prehled','Přehled','⌂'],
  ['aktuality','Aktuality','✉'],
  ['porady','Porady a evaluace','▤'],
  ['platby','Platby','₵'],
  ['nahrady','Náhrady','↻'],
];
const TITLES=Object.fromEntries(SECTIONS.map(s=>[s[0],s[1]]));

let section='prehled';

// Sekce mimo 3.1 zatím renderují decentní placeholder (navigace nevede do prázdna).
function renderPlaceholder(){
  return `<div class="tile ph-tile"><div class="ph-ic">🌿</div><div class="ph-t">${TITLES[section]}</div>`
    +`<div class="ph-d">Tato sekce se připravuje v další fázi prototypu.</div></div>`;
}
const RENDER={prehled:renderPrehled,aktuality:renderAktuality,porady:renderPlaceholder,platby:renderPlaceholder,nahrady:renderPlaceholder};

function renderSidebar(){
  const el=document.getElementById('sidebar');
  el.innerHTML=`<div class="sb-brand">Vhaaji<small>vedení a administrativa</small></div>`
    +`<div class="sb-nav">`+SECTIONS.map(s=>`<button class="sb-item ${section===s[0]?'on':''}" onclick="go('${s[0]}')"><span class="ic">${s[2]}</span>${s[1]}</button>`).join('')+`</div>`;
}
function render(){
  document.getElementById('ttl').textContent=TITLES[section];
  renderSidebar();
  document.getElementById('content').innerHTML=RENDER[section]();
}
window.go=s=>{section=s;if(s!=='aktuality')akView='list';render();};

render();
</script>
</body>
