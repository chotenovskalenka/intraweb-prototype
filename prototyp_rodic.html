<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rodičovská appka (prototyp)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--paper:#EFE9DB;--card:#FBF8F0;--card2:#F4EEDF;--ink:#2B2A26;--muted:#736E61;--hint:#9A9384;
    --forest:#2E5E43;--forest-dk:#21402F;--sage:#8FA48C;--ochre:#B07D3A;--sleep:#5B7C99;
    --line:rgba(43,42,38,.10);--line2:rgba(43,42,38,.16);--danger:#B0492F;--green:#3C7A4E;
    --r:14px;--serif:"Fraunces",Georgia,serif;--sans:"Hanken Grotesk","Segoe UI",sans-serif;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--paper);font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased;padding:0;min-height:100vh;line-height:1.5}
  .phone{width:100%;background:var(--paper)}
  .screen{background:var(--paper);min-height:100vh}.scroll{padding:14px 16px 22px}
  .topbar{display:flex;align-items:center;gap:12px;margin-bottom:13px}
  .burger{border:none;background:none;font-size:20px;line-height:1;color:var(--forest-dk);cursor:pointer;padding:2px 4px}
  .ttl{font-family:var(--serif);font-size:18px;color:var(--forest-dk);flex:1}
  .role{font-size:11.5px;font-weight:500;color:var(--forest);background:rgba(46,94,67,.10);border:1px solid rgba(46,94,67,.18);padding:5px 10px;border-radius:999px}
  .kids{display:flex;gap:7px;margin-bottom:13px}
  .kids button{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line2);background:var(--card);font-family:var(--serif);font-size:15px;font-weight:500;color:var(--muted);padding:9px 6px;border-radius:12px;cursor:pointer}
  .kids button.on{background:var(--forest);border-color:var(--forest);color:#F4EEDF}
  .kidsel{position:relative}
  .kbtn{display:flex;align-items:center;gap:7px;border:1px solid var(--line2);background:var(--card);border-radius:999px;padding:4px 10px 4px 4px;font-family:var(--serif);font-size:14px;font-weight:500;color:var(--ink);cursor:pointer}
  .kcaret{font-size:10px;color:var(--muted)}
  .kmenu{position:absolute;right:0;top:calc(100% + 6px);background:var(--card);border:1px solid var(--line2);border-radius:12px;box-shadow:0 8px 26px rgba(33,64,47,.18);padding:5px;z-index:8;min-width:160px}
  .kitem{display:flex;align-items:center;gap:8px;width:100%;border:none;background:none;padding:8px 10px;border-radius:8px;font-family:var(--sans);font-size:13.5px;color:var(--ink);cursor:pointer;text-align:left}
  .kitem.on{background:rgba(46,94,67,.08);font-weight:600}
  .kchk{margin-left:auto;color:var(--forest);font-weight:700}
  /* drawer */
  .scrim{position:fixed;inset:0;background:rgba(33,42,30,.42);z-index:5;display:none}.scrim.on{display:block}
  .drawer{position:fixed;top:0;left:0;bottom:0;width:76%;max-width:300px;background:var(--paper);z-index:6;transform:translateX(-101%);transition:.22s;padding:20px 0 14px;box-shadow:6px 0 28px rgba(0,0,0,.16);overflow-y:auto}
  .drawer.on{transform:none}
  .dh{font-family:var(--serif);font-size:17px;color:var(--forest-dk);padding:0 20px 14px;border-bottom:1px solid var(--line);margin-bottom:8px}
  .dh small{display:block;font-family:var(--sans);font-size:11.5px;color:var(--muted);font-weight:400}
  .ditem{display:flex;align-items:center;gap:11px;padding:12px 20px;font-size:14.5px;color:var(--ink);cursor:pointer;border:none;background:none;width:100%;text-align:left;font-family:var(--sans)}
  .ditem.on{background:rgba(46,94,67,.10);color:var(--forest);font-weight:600}
  .ditem .ic{width:18px;text-align:center;opacity:.7}
  /* dashboard / shared tiles */
  .hero{background:var(--forest);border-radius:var(--r);padding:15px 16px;margin-bottom:8px;color:#F4EEDF}
  .hero .hl{font-size:12px;opacity:.78;text-transform:uppercase;letter-spacing:.04em}
  .hkid{display:flex;align-items:center;gap:9px;width:100%;background:none;border:none;padding:0;cursor:pointer;color:#F4EEDF;text-align:left}
  .hkid .av{border:1.5px solid rgba(248,244,232,.45)}
  .hname{font-family:var(--serif);font-size:15px;font-weight:500}
  .harr{margin-left:auto;font-size:18px;opacity:.65}
  .hero .hrow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:13px;padding-top:13px;border-top:1px solid rgba(248,244,232,.18)}
  .hero .hchip{font-family:var(--serif);font-size:22px;font-weight:600}
  .hero .ed{background:rgba(248,244,232,.16);border:1px solid rgba(248,244,232,.3);color:#F8F4E8;font-family:var(--sans);font-size:13px;font-weight:500;padding:11px 16px;border-radius:10px;cursor:pointer}
  .profillink{background:none;border:none;color:var(--forest);font-weight:600;font-size:12.5px;font-family:var(--sans);cursor:pointer;padding:4px 2px;margin-bottom:9px}
  .tile{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:13px 15px;margin-bottom:11px}
  .tlab{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin-bottom:7px}
  .tval{font-size:13.5px;color:var(--ink)}
  .np{display:flex;justify-content:space-between;align-items:center;font-size:13.5px;padding:4px 0}.np b{font-weight:600}
  .np.pay{color:var(--ochre);border-top:1px solid var(--line);margin-top:4px;padding-top:8px}.np.pay b{color:var(--ochre)}
  .ev .evt{font-weight:600;font-size:14px;color:var(--forest-dk)}.ev .evd{font-size:13px;color:var(--ink);margin-top:3px}.ev .evd b{font-weight:600}
  .maplink{display:inline-block;margin-top:8px;font-size:12.5px;color:var(--forest);font-weight:600;text-decoration:none;border:1px solid var(--forest);border-radius:8px;padding:6px 12px}
  .gps{font-size:11px;color:var(--hint);margin-top:6px}
  .glab{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:13px 0 7px}
  .gchips{display:flex;gap:8px;flex-wrap:wrap}
  .gchip{display:flex;align-items:center;gap:6px;border:1px solid var(--line2);background:var(--card2);border-radius:999px;padding:4px 12px 4px 4px;font-family:var(--sans);font-size:13px;font-weight:600;color:var(--ink);cursor:pointer}
  .moon{color:var(--sleep);font-size:13px}
  .uline{font-size:12px;color:var(--sleep);margin-top:8px}
  .mrow{display:flex;gap:8px;align-items:baseline;padding:6px 0;border-top:1px solid var(--line);font-size:13px}.mrow:first-of-type{border-top:none;padding-top:0}
  .mk2{font-size:10.5px;color:var(--muted);min-width:72px;flex-shrink:0;text-transform:uppercase;letter-spacing:.03em}
  .mv{flex:1}.alerg{font-size:10px;color:var(--ochre);background:rgba(176,125,58,.12);border-radius:6px;padding:1px 6px;flex-shrink:0;align-self:center}
  .akce{display:flex;justify-content:space-between;width:100%;align-items:center;background:none;border:none;border-top:1px solid var(--line);padding:10px 0;font-family:var(--sans);font-size:13.5px;font-weight:500;color:var(--ink);cursor:pointer;text-align:left}
  .akce:first-of-type{border-top:none;padding-top:0}.akce .when{color:var(--muted);font-size:12.5px;font-weight:400}
  .back{background:none;border:none;color:var(--forest);font-weight:600;font-size:14px;font-family:var(--sans);cursor:pointer;padding:4px 0;margin-bottom:10px}
  .pav{display:flex;justify-content:center;margin:4px 0 10px}.pname{font-family:var(--serif);font-size:22px;text-align:center;color:var(--forest-dk)}.pfull{text-align:center;font-size:12.5px;color:var(--muted);margin-bottom:16px}
  .contact{display:flex;gap:7px;margin-top:6px}
  .cbtn{flex:1;text-align:center;border:1px solid var(--forest);color:var(--forest);border-radius:9px;padding:9px;font-size:12.5px;font-weight:600;text-decoration:none;font-family:var(--sans)}
  .cinfo{font-size:12px;color:var(--muted);margin-top:10px;text-align:center}
  /* platby */
  .frow{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}.frow:first-of-type{border-top:none;padding-top:2px}
  .fL{flex:1}.fo{font-size:13.5px;font-weight:500}.fv{font-size:11.5px;color:var(--muted)}
  .fa{font-size:13.5px;font-weight:600;text-align:right}
  .ubadge{font-size:10px;font-weight:600;padding:2px 8px;border-radius:6px;white-space:nowrap}
  .ubadge.ne{color:var(--danger);background:rgba(176,73,47,.12)}.ubadge.ano{color:var(--green);background:rgba(60,122,78,.12)}
  .pdf{font-size:9.5px;font-weight:700;color:var(--danger);border:1px solid rgba(176,73,47,.4);border-radius:5px;padding:2px 5px}
  /* profil */
  .doc{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-top:1px solid var(--line);font-size:13px}.doc:first-of-type{border-top:none}
  .doc .dt2{color:var(--muted);font-size:11.5px}
  .rozhov{font-size:13px;padding:8px 0;border-top:1px solid var(--line)}.rozhov:first-of-type{border-top:none}.rozhov .rd{font-size:11.5px;color:var(--muted);margin-bottom:2px}
  .works{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:4px}
  .work{aspect-ratio:1;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:11px;color:rgba(43,42,38,.4)}
  .addbtn{margin-top:10px;width:100%;border:1px dashed var(--line2);background:transparent;color:var(--muted);font-family:var(--sans);font-size:12.5px;padding:9px;border-radius:10px;cursor:pointer}
  /* kalendář / agenda */
  .ag{display:flex;gap:11px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}.ag:first-of-type{border-top:none}
  .agd{font-size:11.5px;color:var(--muted);min-width:54px;flex-shrink:0;font-weight:600}
  .agt{flex:1;font-size:13.5px}.agtag{font-size:10px;color:var(--forest);background:rgba(46,94,67,.10);border-radius:6px;padding:1px 7px;align-self:center}
  .agtag.naro{color:var(--ochre);background:rgba(176,125,58,.12)}.agtag.org{color:var(--muted);background:rgba(115,110,97,.12)}
  /* fotky */
  .gal{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
  .ph{aspect-ratio:4/3;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:12px;color:rgba(43,42,38,.38)}
  /* docházka */
  .switch{display:flex;gap:6px;background:var(--card2);padding:4px;border-radius:999px;margin-bottom:14px}
  .switch button{flex:1;border:none;background:transparent;font-family:var(--sans);font-size:13px;font-weight:500;color:var(--muted);padding:12px 4px;border-radius:999px;cursor:pointer}
  .switch button.on{background:var(--forest);color:#F4EEDF}
  .vhead{font-family:var(--serif);font-size:16px;color:var(--forest-dk);margin:2px 2px 8px}
  .bulktoggle{width:100%;border:1px solid var(--forest);background:var(--card);color:var(--forest);font-family:var(--sans);font-size:13px;font-weight:600;padding:13px;border-radius:10px;cursor:pointer;margin-bottom:10px}
  .nahline{display:flex;align-items:baseline;gap:6px;font-size:13px;color:var(--muted);margin:0 2px 10px}
  .nahline b{font-family:var(--serif);font-size:17px;color:var(--forest-dk)}
  .nahsub{font-size:11.5px;color:var(--hint)}
  .wx{padding:11px 15px}
  .wxrow{display:flex;align-items:center;gap:10px}
  .wxic{font-size:22px;line-height:1}
  .wxmain{font-size:13px;color:var(--muted)}.wxmain b{color:var(--ink);font-weight:600}
  .wxwet{margin-top:9px;padding:8px 11px;background:rgba(91,124,153,.10);border-radius:9px;font-size:12.5px;color:#3f5d72;line-height:1.45}
  .alerttile{background:rgba(176,73,47,.08);border:1px solid rgba(176,73,47,.28);border-radius:var(--r);padding:11px 14px;margin-bottom:11px;font-size:13px;color:var(--danger);line-height:1.45}
  .alertsub{display:block;font-size:10.5px;color:var(--hint);margin-top:3px}
  button.alerttile{display:block;width:100%;text-align:left;cursor:pointer;font-family:var(--sans)}
  .newsbox{padding-bottom:8px}
  .newsrow{display:flex;align-items:flex-start;gap:9px;width:100%;background:none;border:none;border-top:1px solid var(--line);padding:8px 0;font-family:var(--sans);font-size:13px;color:var(--ink);cursor:pointer;text-align:left;line-height:1.45}
  .newsrow:first-of-type{border-top:none;padding-top:2px}
  .newsdot{width:7px;height:7px;border-radius:50%;background:var(--danger);flex-shrink:0;margin-top:6px}
  .newsdot.q{background:var(--sage)}
  .newsline{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .newsmore{width:100%;background:none;border:none;border-top:1px solid var(--line);padding:9px 0 3px;font-family:var(--sans);font-size:12.5px;font-weight:600;color:var(--forest);cursor:pointer}
  .newsitem{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:9px}
  .newsitem.urgent{border-color:rgba(176,73,47,.35);background:rgba(176,73,47,.05)}
  .newsurg{display:inline-block;font-size:10px;font-weight:700;color:var(--danger);background:rgba(176,73,47,.12);border-radius:6px;padding:2px 8px;margin-bottom:6px;text-transform:uppercase;letter-spacing:.04em}
  .newstext{font-size:13.5px;line-height:1.5}
  .newsmeta{font-size:11px;color:var(--hint);margin-top:6px}
  .sbalit{margin-top:9px;padding:8px 11px;background:rgba(176,125,58,.10);border-radius:9px;font-size:12.5px;color:var(--ochre)}.sbalit b{font-weight:600}
  .zitra{display:block;width:100%;text-align:left;cursor:pointer;font-family:var(--sans);border-color:var(--sage)}
  .tilelink{display:block;width:100%;text-align:left;cursor:pointer;font-family:var(--sans)}
  .tlabrow{display:flex;align-items:center;justify-content:space-between}
  .tlabbtn{display:flex;align-items:center;justify-content:space-between;width:100%;background:none;border:none;padding:0;font:inherit;color:inherit;text-transform:inherit;letter-spacing:inherit;cursor:pointer}
  .tarr{font-size:15px;color:var(--forest);font-weight:600}
  .bulkbar{background:var(--card);border:1px solid var(--ochre);border-radius:12px;padding:11px 13px;margin-bottom:11px}
  .bulkbar .top{display:flex;justify-content:space-between;align-items:center}.bulkbar .top span{font-family:var(--serif);font-size:14px;color:var(--forest-dk)}
  .linkbtn{background:none;border:none;color:var(--forest);font-weight:600;cursor:pointer;font-size:13px;font-family:var(--sans)}
  .bulkactions{display:flex;gap:7px;margin-top:9px}.bulkactions button{flex:1;border:1px solid var(--line2);background:var(--card2);border-radius:9px;padding:8px;font-size:12.5px;color:var(--muted);font-family:var(--sans);cursor:pointer}
  .selinfo{font-size:12.5px;color:var(--ochre);font-weight:600;margin-top:11px}
  .daycard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 15px;margin-bottom:7px}
  .daycard .dt{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:2px}.daycard .wd{font-family:var(--serif);font-size:16px;color:var(--forest-dk)}.daycard .small{font-size:12px;color:var(--muted)}
  .wkrow{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:6px;overflow:hidden}
  .wkmain{display:flex;align-items:center;gap:11px;padding:14px 14px;cursor:pointer}.wkmain .d{font-weight:500;font-size:14px}.wkmain .d span{color:var(--muted);font-weight:400}.wkmain .cur{margin-left:auto;display:flex;align-items:center;gap:7px}
    .lockflag{font-size:10px;color:var(--muted);white-space:nowrap}
  .daypicker{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:11px;margin-bottom:11px}
  .dpcal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
  .dph{font-size:10px;color:var(--muted);text-align:center;font-weight:600;padding-bottom:2px}
  .dpcell{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:12.5px;border-radius:8px;cursor:pointer;color:var(--ink);background:var(--card2)}
  .dpcell.we{background:transparent;color:var(--hint);cursor:default}
  .dpcell.today{outline:2px solid var(--forest);outline-offset:-2px}
    .dpcell.sel{background:var(--forest);color:#F4EEDF}
  .dashedit{margin-top:-4px;border-top-left-radius:0;border-top-right-radius:0}
    .savebtn{width:100%;margin-top:11px;border:none;background:var(--forest);color:#F4EEDF;font-family:var(--sans);font-size:13.5px;font-weight:600;padding:11px;border-radius:10px;cursor:pointer}
  .savebtn.dis{background:var(--card2);color:var(--hint);cursor:default}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--forest-dk);color:#F4EEDF;font-size:13px;font-weight:500;padding:10px 18px;border-radius:999px;box-shadow:0 8px 24px rgba(0,0,0,.25);z-index:20}
  .latebtn{width:100%;border:1px solid var(--danger);background:transparent;color:var(--danger);font-family:var(--sans);font-size:13px;font-weight:500;padding:12px;border-radius:10px;cursor:pointer;text-align:left}
  .qrtile{text-align:center}
  .qramt{font-family:var(--serif);font-size:26px;font-weight:600;color:var(--forest-dk)}
  .qrsub{font-size:12px;color:var(--muted);margin:2px 0 12px}
  .qrbox{display:flex;justify-content:center}
  .qrbox svg{border:1px solid var(--line);border-radius:10px;padding:8px;background:#fff}
  .qrhint{font-size:12px;color:var(--muted);margin-top:11px;line-height:1.45}
  .fondbtn,.neuhr{display:block;width:100%;text-align:left;cursor:pointer;font-family:var(--sans)}
  .ftop{display:flex;justify-content:space-between;align-items:center}
  .more{font-size:12.5px;color:var(--forest);font-weight:600}
  .neuhr{border-color:var(--ochre);background:rgba(176,125,58,.07)}
  .neuhr .np,.neuhr .tlab,.neuhr b{color:var(--ochre)}
  .wkrow.today .wkmain{background:rgba(46,94,67,.06)}.wkrow.bsel{border-color:var(--ochre);box-shadow:0 0 0 1px var(--ochre)}
  .bchk{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--line2);flex-shrink:0;background:var(--card2)}.bchk.on{background:var(--ochre);border-color:var(--ochre)}
  .editbox{border-top:1px solid var(--line);padding:12px 13px;background:var(--card2);display:none}.wkrow.open .editbox,.daycard .editbox{display:block;border:none;background:transparent;padding:11px 0 0}
  .choices{display:flex;flex-wrap:wrap;gap:6px}.choices button{border:1px solid var(--line2);background:var(--card);font-family:var(--sans);font-size:13px;font-weight:500;color:var(--muted);padding:12px 14px;border-radius:10px;cursor:pointer}
  .choices button.on{background:var(--forest);border-color:var(--forest);color:#F4EEDF}.choices button.abs.on{background:var(--danger);border-color:var(--danger)}.bulkbar .choices{margin-top:9px}
  .note{width:100%;border:1px solid var(--line2);border-radius:9px;padding:9px 11px;font-family:var(--sans);font-size:13px;color:var(--ink);background:var(--card);min-height:48px;resize:vertical;margin-top:9px;line-height:1.45}
  .notelab{font-size:11px;color:var(--muted);margin-top:10px}
  .chip{display:inline-block;font-size:11px;font-weight:600;padding:3px 9px;border-radius:7px}
  .deadline{font-size:11.5px;color:var(--ochre);font-style:italic;margin-top:10px}
  .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.cal .h{font-size:10.5px;color:var(--muted);text-align:center;padding:2px 0;font-weight:600}
  .cal .cell{aspect-ratio:1;border:1px solid var(--line);border-radius:9px;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;padding:2px}
  .cal .cell.we{background:transparent;border-color:transparent;cursor:default}.cal .cell.today{outline:2px solid var(--forest);outline-offset:-2px}.cal .cell.sel{box-shadow:0 0 0 2px var(--ochre) inset}
  .cal .dnum{font-size:11px;color:var(--muted)}.cal .mk{font-size:10px;font-weight:700}
  .av{display:inline-flex;border-radius:50%;overflow:hidden;flex-shrink:0;line-height:0}.av svg{display:block}

function fakeQR(seed,px){
  const n=25,m=px/n,f=[[0,0],[0,18],[18,0]];

  let s=`<rect width="${px}" height="${px}" fill="#fff"/>`;
  f.forEach(p=>{const x=p[1]*m,y=p[0]*m;s+=`<rect x="${x}" y="${y}" width="${7*m}" height="${7*m}" fill="#111"/><rect x="${x+m}" y="${y+m}" width="${5*m}" height="${5*m}" fill="#fff"/><rect x="${x+2*m}" y="${y+2*m}" width="${3*m}" height="${3*m}" fill="#111"/>`;});
  let h=seed||1;
  for(let r=0;r<n;r++)for(let c=0;c<n;c++){if(inF(r,c))continue;h=(h*1103515245+12345)&0x7fffffff;if((h>>9)&1)s+=`<rect x="${c*m}" y="${r*m}" width="${m}" height="${m}" fill="#111"/>`;}
  return `<svg viewBox="0 0 ${px} ${px}" width="${px}" height="${px}">${s}</svg>`;

function editor(d){const c=cur();
  const dr=draft[d]||{};
  const cd=dr.code!==undefined?dr.code:code(c,d);
  const note=dr.note!==undefined?dr.note:(c.notes[d]||'');
  const dirty=dr.code!==undefined||dr.note!==undefined||dr.obed!==undefined;
  if(!editable(d)){
    const isNE=cd==='NE';
    let h=`<div class="lockwrap"><span class="chip" style="background:${CODES[code(c,d)][2]};color:${CODES[code(c,d)][1]}">${CODES[code(c,d)][0]}</span><div class="lockmsg">🔒 Změna byla možná do 20:00 předchozího dne, nyní je možné pouze neomluveno.</div>`;
    if(d===TODAY){
      h+=`<div class="choices"><button class="abs ${isNE?'on':''}" onclick="draftCode(${d},'NE')">Neomluveno</button></div>`;
      if(isNE){
        const ob=dr.obed!==undefined?dr.obed:(c.obed&&c.obed[d]);
        h+=`<div class="notelab">Vyzvednete si oběd?</div><div class="choices"><button class="${ob===true?'on':''}" onclick="draftObed(${d},true)">Ano</button><button class="${ob===false?'on':''}" onclick="draftObed(${d},false)">Ne</button></div>`;
        h+=`<div class="notelab">Důvod absence — nepovinné</div><textarea class="note" placeholder="např. nemoc, rodinný důvod…" oninput="draftNote(${d},this.value)">${note}</textarea>`;
      }
      if(dirty)h+=`<button class="savebtn" onclick="saveDay(${d})">Uložit</button>`;
    }
    return h+'</div>';
  }
  const OPTS=[['D','Dopolední'],['O','Odpolední'],['C','Celodenní'],['OM','Omluvit']];
  let h='<div class="choices">'+OPTS.map(([k,l])=>{const abs=(k==='OM');
    return `<button class="${cd===k?'on':''}${abs?' abs':''}" onclick="draftCode(${d},'${k}')">${l}</button>`;}).join('')+'</div>';
  if(cd==='OM'){h+=`<div class="notelab">Důvod absence — nepovinné</div><textarea class="note" placeholder="např. nemoc, rodinný důvod…" oninput="draftNote(${d},this.value)">${note}</textarea>`;}
  h+=`<button class="savebtn${dirty?'':' dis'}" ${dirty?'':'disabled'} onclick="saveDay(${d})">Uložit</button>`;
  return h;}

  if(selSet.size){h+=`<div class="selinfo">Vybráno: ${selSet.size} ${plural(selSet.size)} — nastavit na:</div><div class="choices">`+[['D','Dopolední'],['O','Odpolední'],['C','Celodenní'],['OM','Omluvit']].map(([k,l])=>{const abs=(k==='OM');return `<button class="${abs?'abs':''}" onclick="applyBulk('${k}')">${l}</button>`;}).join('')+'</div>';}
  return h+'</div>';}

const HINTS={den:'Vyberte docházku na dnešek. Změny na další dny v Týdnu nebo Měsíci.',tyden:'Klepněte na den a vyberte docházku. Pro více dní naráz „Nastavit více dní“.',mesic:'Klepněte na den a vyberte docházku. Pro více dní „Nastavit více dní“. Víkendy školka nemá.'};

function render(){
  document.getElementById('ttl').textContent=overlay?(overlay.type==='guide'?'Průvodce':overlay.type==='fond'?'Kulturní fond':overlay.type==='menu'?'Jídelníček':'Akce'):TITLES[section];
  renderHead();renderDrawer();

  document.getElementById('content').innerHTML = overlay?(overlay.type==='guide'?renderGuide(overlay.idx):overlay.type==='fond'?renderFond():overlay.type==='menu'?renderMenuDetail():renderAkceDetail(overlay.idx)):RENDER[section]();

window.go=s=>{section=s;overlay=null;drawerOpen=false;if(!PERCHILD.includes(s)){} render();};

window.toggleDashEdit=()=>{dashEdit=!dashEdit;render();};

window.goEditDay=d=>{section='dochazka';if(d<=5){view='tyden';}else{view='mesic';}sel=d;overlay=null;drawerOpen=false;render();};
window.stepDay=dir=>{let d=dashDay+dir;while(d>=1&&d<=30&&isWE(d))d+=dir;if(d>=1&&d<=30)dashDay=d;render();};
window.kalPick=d=>{kalSel=d;render();};
window.kalStep=(dm,dy)=>{kalM+=dm;if(kalM>11){kalM=0;kalY++;}if(kalM<0){kalM=11;kalY--;}kalY+=dy;render();};
window.toggleDashPicker=()=>{dashPickerOpen=!dashPickerOpen;render();};
window.pickDashDay=d=>{dashDay=d;dashPickerOpen=false;dashEdit=false;render();};
window.openGuide=i=>{overlay={type:'guide',idx:i};render();};
window.openAkce=i=>{overlay={type:'akce',idx:i};render();};
window.openFond=()=>{overlay={type:'fond'};render();};
window.openMenu=()=>{overlay={type:'menu'};render();};
window.closeOverlay=()=>{overlay=null;render();};
window.setView=v=>{view=v;sel=(v==='den')?TODAY:sel;bulk=false;selSet.clear();render();};
window.pick=d=>{if(bulk){if(!editable(d))return;selSet.has(d)?selSet.delete(d):selSet.add(d);render();return;}sel=(sel===d)?-1:d;render();};
window.toggleBulk=()=>{bulk=!bulk;selSet.clear();sel=-1;render();};
window.selectAll=()=>{const days=view==='tyden'?[1,2,3,4,5]:[...Array(30)].map((_,i)=>i+1);days.filter(d=>!isWE(d)&&editable(d)).forEach(d=>selSet.add(d));render();};
window.clearSel=()=>{selSet.clear();render();};
window.applyBulk=k=>{selSet.forEach(d=>{cur().att[d]=k;});selSet.clear();showToast('Docházka uložena');};
window.draftCode=(d,k)=>{draft[d]={...(draft[d]||{}),code:k};render();};
window.draftNote=(d,v)=>{draft[d]={...(draft[d]||{}),note:v};};
window.draftObed=(d,v)=>{draft[d]={...(draft[d]||{}),obed:v};render();};
window.saveDay=d=>{const dr=draft[d]||{};if(dr.code!==undefined)cur().att[d]=dr.code;if(dr.note!==undefined)cur().notes[d]=dr.note;if(dr.obed!==undefined){cur().obed=cur().obed||{};cur().obed[d]=dr.obed;}delete draft[d];dashEdit=false;showToast('Docházka uložena');};
window.showToast=m=>{toast=m;render();setTimeout(()=>{toast='';render();},1800);};
window.setCode=(d,k)=>{cur().att[d]=k;render();};
window.setNote=(d,v)=>{cur().notes[d]=v;};
render();
</script>
